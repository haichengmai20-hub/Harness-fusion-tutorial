.response .primary-link{display:block;margin-top:11px;text-decoration:none}.response .primary-link:hover{text-decoration:underline}

5ef6b1d8969c6ed8a3975c2063478a5c4986/src/agentscope/agent/_agent.py#L279"}}},"peerLinks":{"hermes":{"install":{"1":{"agentscope":{"lesson":"quickstart","point":null,"grade":"对应","text":"AgentScope 快速开始先安装固定版，再用 DashScope 凭证创建模型，以空 Toolkit 构建 Agent 并调用 reply。一次文字回复验证这条模型调用路径；空 Toolkit 下没有工具可供验收。","url":"https://docs.agentscope.io/zh/versions/2.0.12/quickstart"},"dsh":{"lesson":"chapter-1","point":1,"grade":"部分对应","text":"dsh 首章用确定性的工具往返看两步请求。它可以验证本地循环和 read/get_time 一类工具的反馈；原课离线试验没有验证真实账户认证，不能替代 Hermes 的 provider 检查。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-1"}}},"gateway-1":{"1":{"agentscope":{"lesson":"deploy-channel-routing","point":1,"grade":"对应","text":"AgentScope 先由路由规则选目标智能体，再由 session_scope 给消息分组。per_chat 让同一群共用上下文，per_chat_user 将群内成员分开。换规则会影响后续归组，消息正文相同不能决定会话。","url":"https://docs.agentscope.io/zh/versions/2.0.12/deploy/channel/routing"}}},"tui":{"1":{"agentscope":{"lesson":"building-blocks-console","point":1,"grade":"对应","text":"AgentScope 的终端入口消费 reply_stream 事件并渲染。工具调用开始、结果返回、整轮回复结束是不同事件；终端已经出现工具活动提示时，仍要读取结果事件才能判断执行结果。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/console"}}},"backends":{"1":{"agentscope":{"lesson":"building-blocks-workspace-run-workspace","point":1,"grade":"对应","text":"AgentScope 将工具交给所选 Workspace 后端。LocalWorkspace 的 workdir 在本机，容器或远程工作区的目录要按对应挂载与后端查看。界面所在机器不足以确定命令改了哪一份文件。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/workspace/run-workspace"}}},"interview-design":{"1":{"agentscope":{"lesson":"deploy-workspace-manager","point":1,"grade":"对应","text":"Agent Service 的工作区管理器显式选择本机目录、容器或远程沙箱等后端；其中 LocalWorkspaceManager 直接操作宿主文件系统。两个独立会话仍须核对是否映射到了同一实例、目录或挂载。","url":"https://docs.agentscope.io/zh/versions/2.0.12/deploy/workspace-manager"}}},"build-provider":{"1":{"agentscope":{"lesson":"building-blocks-model-llm","point":1,"grade":"部分对应","text":"AgentScope 通过凭证与具体模型类连接服务，格式化器把框架消息和工具定义变为 provider 输入。普通文本可用仅验证文本路径；还应检查一次工具请求及其反馈，经格式转换后是否仍可被下一次模型请求消费。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/model/llm"},"dsh":{"lesson":"chapter-1","point":2,"grade":"部分对应","text":"dsh 原课展示模型适配器如何提出工具请求，再通过统一通道取得结果。可用两次请求核对调用合同；页面的预生成数据和原课 fake provider 不证明某个线上 provider 接入成功。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-1"}}},"multimodal":{"1":{"agentscope":{"lesson":"building-blocks-message-and-event","point":null,"grade":"部分对应","text":"AgentScope 的 DataBlock 可以用 URL 或 Base64 表达图像数据，说明模型可能接收到原图。内容块本身不验证图中数值；要回答金额正确与否，仍要把模型解释同原表核对。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/message-and-event"}}},"build-plugin":{"1":{"dsh":{"lesson":"chapter-5","point":2,"grade":"对应","text":"dsh 的例子先检查 Context 中是否已有 word_count。缺少时登记插件定义，再运行插件令工具真正可见，随后用一次计数调用验证，最后可停止或删除。这里每一步都能在插件状态或结果中核对。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-5"},"agentscope":{"lesson":"building-blocks-tool-python-tool","point":1,"grade":"部分对应","text":"若统计功能只需一个确定性函数，AgentScope 原课可以用 Python 函数工具公开名称、参数和结果。它回答如何接入计算能力；本节没有 Hermes 那种通用插件分类与加载生命周期。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/tool/python-tool"}}},"evaluation":{"1":{"agentscope":{"lesson":"building-blocks-pipeline-goal","point":1,"grade":"部分对应","text":"GoalPipeline 显式配置执行者与验证者，验证不通过可将理由交给执行者重做。这里提供的是验收位置；CSV 的有效和、非法值与漏行仍须写进独立标准，模型担任验证者也不保证算术正确。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/pipeline/goal"},"dsh":{"lesson":"chapter-6","point":3,"grade":"部分对应","text":"dsh 教学例用可观察的轮次结果决定继续、完成、阻塞或停止。它能解释为什么不能拿一条结束回复当正确性证据；CSV 的答案仍需另设测试断言，这一章没有上游 CSV 评测集。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-6"}}},"tools":{"1":{"agentscope":{"lesson":"building-blocks-tool-manage-tools","point":1,"grade":"对应","text":"AgentScope Toolkit 可将工具划入组，未激活的非 basic 组不向这次请求提供相应能力；原课用 reset_tools 切换激活组。查到函数或定义之后，还要看实际启用的工具集合。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/tool/manage-tools"},"dsh":{"lesson":"chapter-5","point":2,"grade":"对应","text":"dsh 将保存定义与注册运行时工具分开。只做 cordis_define 时工具不在可调用集合，cordis_run 挂载插件后才能在 Context 中找到它。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-5"},"claude":{"lesson":"s02","point":1,"grade":"部分对应","text":"Claude 原课将送给模型的 TOOLS 定义与本地 TOOL_HANDLERS 分发表分开。只写处理函数不会让模型看到工具，公开了定义也不代表存在对应实现；这个小例没有覆盖 Hermes 的平台与 toolset 筛选。","url":"https://learn.shareai.run/zh/s02/"}}},"agent-loop":{"1":{"claude":{"lesson":"s01","point":1,"grade":"对应","text":"Claude 原课让模型先请求查看目录、按实际结果继续工作。每次循环得到一次模型响应，工具执行与结果追加发生在本次响应和下次请求之间；读账单、计算和最终文字也应按这个顺序分别定位。","url":"https://learn.shareai.run/zh/s01/"}},"2":{"claude":{"lesson":"s02","point":2,"grade":"对应","text":"原课的一个助手响应可以含多个 tool_use；收集每块的结果时复制该块的 ID，最后一起送回。两份输出归属由标识决定。教学代码逐块执行，不能从多块响应推出工具并发。","url":"https://learn.shareai.run/zh/s02/"}}},"memory":{"1":{"claude":{"lesson":"s09","point":1,"grade":"部分对应","text":"Claude 原课在每次用户请求开始时把 MEMORY.md 索引放入系统提示，再按近期对话挑选相关文件并临时注入正文。偏好写到文件、被列入索引、正文被本次请求实际读取要分别检查；Hermes 的注入时机须按本课配置判断。","url":"https://learn.shareai.run/zh/s09/"}},"2":{"claude":{"lesson":"s09","point":2,"grade":"部分对应","text":"Claude 教学在一轮正常文本结束后从压缩前快照提取，先与已有条目比较，仅在有新信息时写入文件。这个入口能区分候选信息与落盘内容，原课这里没有演示 Hermes 交互界面的逐项提案和人工批准。","url":"https://learn.shareai.run/zh/s09/"}}},"compression":{"1":{"claude":{"lesson":"s08","point":4,"grade":"对应","text":"Claude 教学先将完整历史写到 .transcripts/，随后用一条摘要取代活跃消息列表。若摘要省掉销售文件的缺失值规则，下一步输入便没有这条约束；示例也未提供把 transcript 自动检索回来的工具。","url":"https://learn.shareai.run/zh/s08/"}}}},"dsh":{"chapter-1":{"1":{"agentscope":{"lesson":"building-blocks-agent-overview","point":1,"grade":"对应","text":"AgentScope 的 Agent 在同一 reply 中交替推理与执行工具，状态决定是否还要执行或继续推理。对照工具调用、结果和整轮结束三种时刻，可以解释为什么一次用户输入会需要多个模型步骤。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/overview"},"claude":{"lesson":"s01","point":1,"grade":"对应","text":"原课的模型返回 tool_use 时，harness 执行 bash，再带工具结果进入下一次模型调用。只有模型没有请求工具时才从正常路径返回；这正说明一个用户回合为什么可以包含多个 Step。","url":"https://learn.shareai.run/zh/s01/"}},"2":{"claude":{"lesson":"s01","point":2,"grade":"部分对应","text":"Claude 教学将 bash 输出包装成 tool_result，保留 block.id 作为 tool_use_id，统一加入 messages。该示例能解释成功执行怎样反馈，但不足以证明未知工具、参数错误和处理器异常都采用 dsh 教学版的错误包装。","url":"https://learn.shareai.run/zh/s01/"}}},"chapter-2":{"1":{"agentscope":{"lesson":"building-blocks-context-offload-context","point":1,"grade":"部分对应","text":"AgentScope 的卸载器可以把体积过大的产物存到 Workspace 等后端，留给模型一个可回读引用。dsh 本章保留原历史并裁剪仅供模型读取的投影视图；两者保留原文的位置不同。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/context/offload-context"},"claude":{"lesson":"s08","point":3,"grade":"部分对应","text":"原课 tool_result_budget 在单条用户消息的工具结果总量过大时，优先把最大结果写入 .task_outputs/tool-results/，上下文里保留路径标记和开头预览。dsh 此章保留原始会话数据并按需生成首尾裁剪视图，原文和缩短版的存放方式不同。","url":"https://learn.shareai.run/zh/s08/"}},"3":{"claude":{"lesson":"s10","point":2,"grade":"部分对应","text":"Claude 原课以确定性序列化得到 context 签名；签名相同就复用上次拼好的系统提示字符串。它验证的是本地组装缓存，无法证明供应商缓存命中。dsh 的最长相同前缀同样是本地可检查的输入结构。","url":"https://learn.shareai.run/zh/s10/"}}},"chapter-3":{"1":{"hermes":{"lesson":"build-plugin","point":1,"grade":"部分对应","text":"Hermes 先辨别该能力应做成工具、技能还是通用插件，再在公共扩展入口登记。它能回答哪些贡献进入当前系统；不能据此断言 Hermes 采用本章 Context 的同一套安装回滚顺序。","url":"https://g1429566.github.io/hermes-tutorial/#/build-plugin"}},"2":{"hermes":{"lesson":"build-plugin","point":1,"grade":"部分对应","text":"Hermes 的插件类别和加载入口能定位谁贡献了能力。本节没有证明停止时会按 dsh 例子相同的逆序 effect 撤销所有注册；两边的生命周期应分开检查。","url":"https://g1429566.github.io/hermes-tutorial/#/build-plugin"}}},"chapter-4":{"1":{"agentscope":{"lesson":"building-blocks-message-and-event","point":1,"grade":"部分对应","text":"AgentScope 会发出模型、工具与内容块的事件，上层可以把流式增量组装为消息。dsh 此章还以按序保存的 SessionLog 重建过去的请求；单独消费一个事件流不能证明已经持久保存。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/message-and-event"},"claude":{"lesson":"s01","point":2,"grade":"部分对应","text":"Claude 教学先把助手的工具请求追加到 messages，再追加带 tool_use_id 的结果。可以从这份消息表读出一次往返；本章没有 dsh SessionLog 那样单独追加的、带序号的运行时事件。","url":"https://learn.shareai.run/zh/s01/"}},"3":{"hermes":{"lesson":"agent-loop","point":2,"grade":"部分对应","text":"Hermes 通过助手请求与结果共享的 tool_call_id 关联一次工具往返。这能追踪哪项结果属于哪次请求；它不会单凭 ID 冻结当时的所有工具清单或提示配置。","url":"https://g1429566.github.io/hermes-tutorial/#/agent-loop"},"claude":{"lesson":"s01","point":2,"grade":"部分对应","text":"原课每轮用当下的 messages 与 TOOLS 发出请求，工具结果能靠 tool_use_id 查回原调用。只看这个 ID 无法重建过去某一 Step 的完整工具清单；这里没有 dsh 示例用于历史重建的 request/header。","url":"https://learn.shareai.run/zh/s01/"}}},"chapter-5":{"1":{"hermes":{"lesson":"tools","point":1,"grade":"对应","text":"Hermes 区分已注册的处理函数、toolset 收录和当前平台选择。要回答某项统计能力现在能不能调用，须核对本次请求里真正公开的工具名。","url":"https://g1429566.github.io/hermes-tutorial/#/tools"}},"2":{"agentscope":{"lesson":"building-blocks-tool-manage-tools","point":1,"grade":"部分对应","text":"AgentScope 可以事先定义工具，再按激活的工具组决定模型可见集合。切换组能改变可用性；它不等价于执行一段新插件代码并挂载到 Cordis Context。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/tool/manage-tools"}}},"chapter-6":{"1":{"agentscope":{"lesson":"building-blocks-pipeline-goal","point":1,"grade":"部分对应","text":"AgentScope GoalPipeline 把任务目标交给执行者，用验证者的反馈决定是否重做，并允许中断、恢复。dsh 教学例把 Goal、Round 和终止原因显式记入会话；两边应分别查各自状态的存取位置。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/pipeline/goal"}},"3":{"agentscope":{"lesson":"building-blocks-pipeline-goal","point":1,"grade":"对应","text":"AgentScope 让验证者对照目标检查产出，未通过则连同理由再交回执行者，直到通过或用尽次数。单次执行者的回复结束不等于整个目标结束。","url":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/pipeline/goal"},"hermes":{"lesson":"evaluation","point":1,"grade":"部分对应","text":"Hermes 教程通过固定任务输入和外部标准判断输出是否达标，例如核对总额与异常条目。它说明继续改进需要用的结果证据，不表示其批评测器就是 dsh 的长程调度器。","url":"https://g1429566.github.io/hermes-tutorial/#/evaluation"}}}},"agentscope":{"quickstart":{"1":{"hermes":{"lesson":"tui","point":1,"grade":"部分对应","text":"Hermes TUI 将模型回复增量及工具活动从 Python 后端传给终端界面，同时保留有标识的请求和响应。读者可对照实时观察和最终结果；该宿主的接口不是 AgentScope 的两个 Python 方法。","url":"https://g1429566.github.io/hermes-tutorial/#/tui"},"claude":{"lesson":"s01","point":1,"grade":"部分对应","text":"Claude 教学用 client.messages.create(...) 等到本次完整响应，追加 response.content 后再检查 stop_reason。它能与 AgentScope 的同步观察点相对照；本章没有 reply_stream 那样逐块对外产出事件的入口。","url":"https://learn.shareai.run/zh/s01/"}}},"building-blocks-model-overview":{"1":{"hermes":{"lesson":"build-provider","point":1,"grade":"对应","text":"Hermes 的 provider 接入先配置认证与模型目录，再选模型并做最小真实请求。能看到模型名字只说明目录可用；要确认支持工具调用，仍需用一次调用核对名称、参数和结果回传。","url":"https://g1429566.github.io/hermes-tutorial/#/build-provider"}}},"building-blocks-model-llm":{"1":{"hermes":{"lesson":"build-provider","point":1,"grade":"对应","text":"Hermes 在 provider 边界转换框架消息与模型请求格式，并把返回的工具调用转回执行器能处理的形式。一次含工具反馈的往返比只观察普通文本更能验证这层转换。","url":"https://g1429566.github.io/hermes-tutorial/#/build-provider"}}},"building-blocks-model-asr":{"1":{"hermes":{"lesson":"multimodal","point":1,"grade":"部分对应","text":"Hermes 的多模态章节区分 STT 把输入语音转文字、TTS 把输出文字变成音频。转录文字进入当前任务前可能已有误差，涉及数字时需另行核实。它没有在本节给出 AgentScope 各 ASR 模型的流式接口。","url":"https://g1429566.github.io/hermes-tutorial/#/multimodal"}}},"building-blocks-console":{"1":{"hermes":{"lesson":"tui","point":1,"grade":"对应","text":"Hermes 用 Ink 界面经 JSON-RPC 接收 Python 后端的增量消息与工具状态。终端可以在最终答案出来前显示活动；界面显示和工具实际完成仍是两件独立可观察的事。","url":"https://g1429566.github.io/hermes-tutorial/#/tui"}}},"deploy-channel-overview":{"1":{"hermes":{"lesson":"gateway-1","point":1,"grade":"对应","text":"Hermes 的网关使用平台适配器接收各 IM 平台不同的事件，先转为核心可处理的消息，再把核心回复翻回平台消息。平台传输和 agent 执行分属不同阶段。","url":"https://g1429566.github.io/hermes-tutorial/#/gateway-1"}}},"deploy-channel-routing":{"1":{"hermes":{"lesson":"gateway-1","point":1,"grade":"对应","text":"Hermes 教程用平台消息的来源字段归出会话键。两人文字相同不足以判为同一会话；需要核对平台、聊天及线程等归键数据。它不使用本章的 per_chat/per_chat_user 配置名。","url":"https://g1429566.github.io/hermes-tutorial/#/gateway-1"}}},"building-blocks-workspace-overview":{"1":{"hermes":{"lesson":"backends","point":1,"grade":"部分对应","text":"Hermes 把终端工具指向选定的本机、SSH 或其他执行后端。相对路径在后端的工作目录中解析。本章的技能、MCP 等工作区资源生命周期还需要 AgentScope Workspace 自己管理。","url":"https://g1429566.github.io/hermes-tutorial/#/backends"}}},"building-blocks-workspace-run-workspace":{"1":{"hermes":{"lesson":"backends","point":1,"grade":"对应","text":"Hermes 先选实际运行命令的后端和 cwd。用 SSH 模式时到远程工作目录查文件；查看开发机上的同名目录不能证明远端的写入结果。","url":"https://g1429566.github.io/hermes-tutorial/#/backends"}}},"deploy-workspace-manager":{"1":{"hermes":{"lesson":"profiles","point":1,"grade":"部分对应","text":"Hermes profile 通过当前配置根目录区分配置、记忆等状态。这个边界回答哪些状态树彼此独立；实际命令的执行地点或是否共用外部服务还要分别核查。","url":"https://g1429566.github.io/hermes-tutorial/#/profiles"}}},"building-blocks-message-and-event":{"1":{"dsh":{"lesson":"chapter-4","point":4,"grade":"部分对应","text":"dsh 用按序追加的 SessionLog 派生请求与 Trace，并把同一步的调用、返回配回模型消息。它示范的是从保存的事件重建；这与 AgentScope 消费实时增量的输入时间点不同。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-4"},"claude":{"lesson":"s01","point":2,"grade":"部分对应","text":"原课先保存完整的 assistant 响应，再把返回同一 tool_use_id 的工具结果作为下一条 user 消息。这里能检查消息如何增长；没有用增量事件拼装同一块文本的过程。","url":"https://learn.shareai.run/zh/s01/"}}},"building-blocks-context-compress-context":{"2":{"dsh":{"lesson":"chapter-2","point":1,"grade":"部分对应","text":"dsh 教学版将超长工具结果裁成首尾片段，并保留完整历史。它展示单项工具输出与模型视图的分工，本节没有实现一次完整会话的 LLM 总结。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-2"}}},"building-blocks-tool-manage-tools":{"1":{"dsh":{"lesson":"chapter-5","point":2,"grade":"部分对应","text":"dsh 在 cordis_run 后才把定义所描述的工具实际挂入 Context；停止后工具可从集合中消失。它用插件生命周期改变能力集合，AgentScope 此课用工具组激活改变可见集合。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-5"}}},"building-blocks-pipeline-goal":{"1":{"dsh":{"lesson":"chapter-6","point":3,"grade":"对应","text":"dsh 的外层 LongTaskRunner 读取每个 Round 的结果，检查已完成、受阻、无进展或达到上限等出口；不要求由另一个模型扮演验证者。两边都把整项目标的判定放在执行者的一次回复之外。","url":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-6"}}}}},"practicePrompts":{"s01":{"question":"写文件的命令返回空输出后，模型会直接结束吗？","action":"在模拟器从第 0 步单步走到第 4 步，先预测下一步。再走到第 8 步，比较两次 bash 的作用。","expect":"第 4 步写入只返回空输出。模型随后要求用 cat 读回 hello.py，第 7 步才看到文件内容，第 8 步结束。","tab":"sim","needle":"uses only bash","point":1},"s02":{"question":"如果模型报出一个没有登记的工具名，分发器会把什么送回模型？","action":"在源码中找到按 block.name 查处理函数的那一行，假设查不到，顺着下面三行找出输出和关联编号。","expect":"查不到时生成含工具名的 Unknown 文本，仍构造 tool_result，将原来的 block.id 写入 tool_use_id。","tab":"source","needle":"handler = TOOL_HANDLERS.get(block.name)","point":1},"s03":{"question":"一个需要确认的工具请求到了权限层，在哪一步才真正得到执行结果？","action":"从模拟第 3 步开始看请求，依次走到第 4、5、6 步，分别记下规则裁决、用户选择和工具返回。","expect":"第 4 步硬拒绝检查通过，第二道规则要求询问。第 5 步用户允许，第 6 步才出现 bash 的结果。","tab":"sim","needle":"rule checks","point":1},"s04":{"question":"读取 package.json 时，前置和后置 Hook 分别能看到什么？","action":"在模拟第 4 步暂停，预测接下来先出现工具结果还是后置 Hook。继续到第 6 步核对。","expect":"第 4 步 PreToolUse 允许读取，第 5 步 read_file 才返回含 build 的 scripts 内容，第 6 步触发 PostToolUse。","tab":"sim","needle":"output handling","point":2},"s05":{"question":"列出重构计划以后，提醒出现在工具读取之前还是之后？","action":"从模拟第 2 步的待办清单读起，记录第 4 步的普通工具调用，再到第 5 步检查提醒写了什么。","expect":"第 2 步把检查解析器标为进行中、重构和测试列为待做。读 parser.py 后出现提醒，提示连续三轮未更新时应刷新待办。","tab":"sim","needle":"intended work visible","point":2},"s06":{"question":"子任务读了 cli.py，父任务随后得到的是文件内容还是调查结论？","action":"对照模拟第 3 步的子任务输入、第 4 步的 read_file 和第 5 步返回的工具名。","expect":"子任务以新的消息历史开始。文件读取发生在子循环里；回到父循环的是 task 的摘要，概述参数解析和命令分发。","tab":"sim","needle":"returns only a final summary","point":2},"s07":{"question":"模型第一次知道 code-review 这个名字，和第一次读到评审规范，是同一步吗？","action":"在模拟第 1 步看可用技能，再走到第 3、4 步。记下技能名第一次出现的位置和正文的消息类型。","expect":"第 1 步的目录已经有 code-review。第 3 步才请求 load_skill，第 4 步在工具结果中读到检查缺陷、回归和缺失测试的说明。","tab":"sim","needle":"cheap skill catalog","point":2},"s08":{"question":"十次读文件留下十条很长的工具结果。第八次的正文会被 L2 换成占位符吗？","action":"定位 L2 的 KEEP_RECENT_TOOL_RESULTS。假设十条结果依次编号 1～10 且正文都超过 120 个字符，手算循环切片，再检查替换条件。","expect":"第 8、9、10 条属于保留的最近三条。前七条才进入循环，达到长度条件的旧结果会被替换为占位说明。","tab":"learn","needle":"KEEP_RECENT_TOOL_RESULTS = 3","point":2},"s09":{"question":"新一轮模型从哪里知道项目常用的测试命令？","action":"比较模拟第 1 步和第 3 步：先记录加载的索引，再找出实际选中的记忆文件及测试命令。走到下一步验证。","expect":"索引有三项。第 3 步选中 project_facts.md，读出 npm run test:unit。第 4 步才请求用 bash 执行这个命令。","tab":"sim","needle":"selected project facts","point":1},"s10":{"question":"两次请求使用内容相同的 context，第二次还会重新拼接系统提示词吗？","action":"读 get_system_prompt 的 key 计算和紧接着的 if 分支。先画出已有缓存时的返回路线，再看条件不满足时调用哪个函数。","expect":"代码用有序键序列化 context。键相同且已有提示时返回 _last_prompt；否则调用 assemble_system_prompt 重新组装。这里缓存的是进程内的提示文本。","tab":"source","needle":"def get_system_prompt(context: dict)","point":2},"s11":{"question":"输出截断与输入超长都涉及 token，模拟中的恢复动作有什么不同？","action":"在模拟第 2 步记下 max_tokens 的变化，预测第 3 步遇到 prompt_too_long 是否仍会提高这个数，再单步揭晓。","expect":"第 2 步把输出预算从 8000 调到 64000。第 3 步改变输入消息，先做 reactive_compact，再重试一次。","tab":"sim","needle":"prompt overflow","point":2},"s12":{"question":"为什么部署任务已在图里，却第一次领取失败？","action":"到模拟第 3 步读部署任务的 blockedBy。尝试预测第 5 步的领取结果，以及完成 task_tests 后第 7 步会出现什么。","expect":"部署依赖 task_tests。首次领取返回阻塞项；完成测试任务后，结果列出 Deploy release 已解除阻塞。此时还没有部署执行结果。","tab":"sim","needle":"blockedBy dependencies","point":2},"s13":{"question":"第一次返回 task_42 时，能否向用户报告扫描找到了多少项？","action":"在模拟第 5 步先记下任务编号和结果类型，再只走一步，核对编号、完成状态与匹配数。","expect":"第 5 步只是后台任务启动的占位结果。第 6 步相同编号的 task_notification 标为 done，并报告找到了 12 项。","tab":"sim","needle":"main loop responsive","point":2},"s14":{"question":"定时任务到点时，哪个动作只负责排队，哪个动作才启动 Agent？","action":"比较模拟第 5 和第 6 步，分别抄下 cron_7 的生产者和消费者，判断 agent_loop 在哪一步收到 prompt。","expect":"第 5 步调度器匹配当前分钟，把 cron_7 放进队列。第 6 步队列处理器取出该项，调用 agent_loop(prompt)。","tab":"sim","needle":"queues due jobs","point":2},"s15":{"question":"队友已经写下测试通过，为什么 Lead 还要读自己的收件箱？","action":"在模拟第 5、6 步区分两个 JSONL 文件的收件人；继续到第 8 步，找出 Lead 获得回复的工具结果。","expect":"工作指令先进入 test-runner.jsonl，队友回信进入 lead.jsonl。Lead 调用 check_inbox 后，才在工具结果中读到队友报告的 Tests passed。","tab":"sim","needle":"file-backed mailboxes","point":2},"s16":{"question":"reviewer 已提交计划时，Lead 是否已经批准？","action":"从模拟第 3 步记下请求编号，对照第 5 步提交计划、第 6 步匹配响应、第 7 步审批的状态。","expect":"同一编号为 req_18。匹配到提交后状态是 ready_for_review，下一步才由 review_plan 明确给出 approved=true。","tab":"sim","needle":"response matching","point":2},"s17":{"question":"worker-a 看到无人的 task_5 时，已经取得执行资格了吗？","action":"比较模拟第 3、4、5 步：先读 owner，再找认领调用，最后看工作者进入哪种状态。","expect":"第 3 步 owner 为空，只说明它是候选。第 4 步请求领取，第 5 步工作者进入 WORK 并关联 task_5。","tab":"sim","needle":"claim eligible work","point":2},"s18":{"question":"待人工复核的工作树还有未提交改动。按默认参数清理，会在哪个分支停下？","action":"在源码定位 remove_worktree，查 discard_changes 的默认值及检查改动后的早返回，比较它与真正移除目录的调用顺序。","expect":"discard_changes 默认为 False。有改动时会先返回拒绝清理的信息，保留工作树以便复核；实际移除操作在这个判断之后。","tab":"source","needle":"def remove_worktree(name: str","point":2},"s19":{"question":"连接 docs 后，模型第一次看到可用名称和第一次得到搜索结果分别在哪里？","action":"在模拟第 4 步找服务端公布的两个名称，再走到第 5、6 步，按工具名核对调用和结果。","expect":"第 4 步列出 mcp__docs__search 与 mcp__docs__read。第 5 步才调用搜索，第 6 步的结果给出构建与环境变量提示。","tab":"sim","needle":"normalized tool namespace","point":2},"s20":{"question":"准备一次发布时，Agent 是先拿到上下文再委派，还是先启动队友？异步结果又何时回来？","action":"在模拟第 2 步读 assemble_prompt 的来源，然后找到第 5 步的队友调用和第 8 步的异步结果汇总。","expect":"第 2 步先组装记忆、任务图、技能、工具和策略。第 5 步分派文档工作，第 8 步才把后台完成、队友回信和 MCP 状态合回循环。","tab":"sim","needle":"composes context assembly","point":1}},"chapters":[{"id":"s01","title":"Agent Loop","zh":"模型与工具的往返","group":"循环与工具","previous":"你手里只有一条用户消息和一份有缺陷的 cart.py。用户报告每件 350 分，买两件却只收了 350 分。","problem":"程序能调用模型一次。如果模型只回复「应该是数量没乘上」，谁去查看现场，谁把结果告诉它？","mechanism":"Harness 是驱动模型做事的程序。每轮把当前消息交给模型，读出它要调用的工具或给用户的答复。遇到工具请求，程序执行工具、追加结果，再发起一轮模型请求。","input":"用户任务、固定的购物车快照，以及当前轮可见的消息。","output":"模型在一轮工具往返后可报告复现结果。本章的正常路径会测出错误仍在，修复要留给后续章节。","walkthrough":["先手算预期。350 × 2 = 700，程序给出 350，相差 350。只有一件商品的用例恰好算对，无法揭示这个错误。","单步走到 check_cart 请求。此时模型只是请程序检查购物车；继续找到工具真正返回的 actual=350 和 expected=700。","再走一步找到工具返回的内容。下一轮能利用这条证据，是因为 Harness 把它放回了消息序列。","走到最终回复，判断这个回合完成了什么。看见 350 与 700 的差异，足以报告错误已复现，尚需修改和新的断言结果才能交付修复。"],"failure":"失败路径里模型跳过检查就声称完成。可以核对消息序列，并指出它缺少哪一条能够支持结论的工具结果。","question":"模型已给出最终回复，最后一次可见的检查仍显示实际 350、预期 700。此时能确认什么？","options":["购物车已经修好","本次对话结束，检查仍暴露原错误","用户必须开启新会话才能继续检查"],"answer":1,"explanation":"结束由模型返回的动作决定。金额是否正确由同一快照上的断言决定，两者各有自己的证据。","next":"下一章把能调用哪些工具、每个工具接收什么参数，变成程序可检查的合同。","checkpoint":"工具结果进入下一次模型请求"},{"id":"s02","title":"Tool Use","zh":"注册与分发工具","group":"循环与工具","previous":"循环已经会把一个工具的返回值送回模型。","problem":"现在要读 cart.py，也可能需要运行检查。模型发来一组参数时，程序凭什么把它交给正确的函数？","mechanism":"注册表把公开工具名和本地函数对应起来。参数约束（schema）描述工具接受哪些字段。分发器先查名字、检查参数，再把执行结果和原调用 ID 一起送回循环。","input":"工具名、参数、调用 ID，以及运行时已经注册的工具。","output":"与请求 ID 配对的结果，可能是读取到的内容，也可能是查找或校验失败的说明。","walkthrough":["先看 tools-listed，再看 request-built 的 payload.tools：read 的 path 类型是 string。模型实际收到这份清单；对应的 Python 处理函数只保存在本地注册表。","对 cart.py 发起读取，跟踪产生的调用 ID。工具名可以重复出现，调用 ID 标识其中的一次请求。","沿同一个 ID 找回结果。把它与原请求并排，确认结果读的是想查的文件，随后才把内容用于定位 350 的来源。","切到失败路径。call-1 请求未注册的 scan，得到 unknown-tool；call-2 调用 read 却把 path 写成数字 12，得到 invalid-arguments。找到这两条错误分别回到了哪一次模型请求。"],"failure":"名字拼错或参数形状错误，都可能让一个看似合理的请求进不了工具函数。应把错误关联到原请求，模型才知道该改哪一次调用。","question":"同一轮有两次 read，一次读 cart.py，一次读测试。结果都写着 read，怎样可靠地配回请求？","options":["按源文件名的字母顺序","按返回内容的长度","用各自的工具调用 ID"],"answer":2,"explanation":"工具名标识可复用的能力。一对请求和结果共享的调用 ID 才能区分这两次读取，即使结果先后顺序发生变化也能配对。","next":"下一章给能修改购物车的工具加一道执行前检查。","checkpoint":"从工具名和参数找到本地函数"},{"id":"s03","title":"Permission","zh":"写入前的权限决策","group":"循环与工具","previous":"工具分发器已经能找到修改 cart.py 的函数，也能检查参数。","problem":"模型给出了能执行的修复请求。用户选择拒绝时，要怎样证明文件从未被这一次调用改过？","mechanism":"在调用写工具之前作出权限决策。允许时沿原路径分发；拒绝时直接形成带调用 ID 的工具结果，让模型获得决定和原因。","input":"同一次写入请求、目标文件、调用 ID 和本次允许或拒绝的决定。","output":"执行或跳过写入的分支、供下一轮读取的结果，以及能核对的文件状态。","walkthrough":["从同一缺陷快照开始。跟到模型请求写入时，先记下待改文件和当前金额结果。","在允许路径上找到 allowed=true 和工具返回的 changed=true。先预测修复后的金额，再在 outcome-checked 核对购物车函数实际算出 700。","重置后切到拒绝路径。相同的 write_fix 请求得到 permission-denied，executed 为 false，再次调用购物车函数仍得 350。","检查最后一步的 fileBytesChanged。程序重新读取 cart.py，与调用前的字节逐一对比。再回到第二次模型请求，看看模型收到的是哪一条拒绝回执。"],"failure":"写完文件才判断权限会留下副作用，即使最终对话写着「拒绝」。比较执行前后快照，并查工具执行记录，比只看拒绝文案更能发现这个错误。","question":"用户拒绝写 cart.py。哪组观测最能说明执行前权限生效？","options":["同一调用收到拒绝结果，写函数未执行，文件内容与开始时一致","最后一条回复含有「权限」二字","模型换了一种方式解释乘法"],"answer":0,"explanation":"拒绝结果说明调用者获知了决定；写函数没有运行且文件保持原样，则说明决定确实挡在副作用之前。","next":"下一章在工具边界挂上观测逻辑，检查写入前后到底发生了什么。","checkpoint":"权限决定先于写工具副作用"},{"id":"s04","title":"Hooks","zh":"工具前后的扩展点","group":"循环与工具","previous":"写入路径已有权限判断，也能返回工具结果。","problem":"想给工具加观测逻辑。如果直接修改每个工具函数，怎样保证所有工具都在相同的时机记录？","mechanism":"Hook 是运行时留给外部函数的回调位置。把观测逻辑分别挂在工具的执行前和执行后，同一处调度代码便能按约定次序通知它们。","input":"注册在边界上的回调、当前调用的身份和参数，以及执行后才产生的工具结果。","output":"可以在同一调用下对照的回调顺序、工具结果与异常状态。","walkthrough":["找到 write_fix 对应的 hook-before。执行前回调收到工具名、参数和调用 ID；在这里暂停，预测它能否读到本次工具的结果。","继续走过权限判断和写工具，再查看 hook-after。此时回调收到工具结果，其中 changed=true。外层循环要再往后一步，才将结果作为 tool 消息送回模型。","切到失败路径，找到执行前回调抛出的异常，再检查写工具有无执行。正常路径里同一位置接下来的动作可以作为对照。","推演一个后置回调异常。如果文件已经写入，判断是否重试前要先核对文件，避免对同一请求再次执行写入。"],"failure":"记录失败和写入失败可能出现在同一条调用上。若只看最后一条异常而忽略先前的执行顺序，就可能把已经生效的修改再做一次。","question":"对同一次调用，执行前回调、工具本体和执行后回调都跑完。哪一处最早有机会读取工具返回值？","options":["执行前回调刚开始时","工具本体返回后，进入执行后回调时","工具注册时"],"answer":1,"explanation":"请求参数在调用之前已经存在。本次工具返回值只有在本体返回时才出现，随后才能交给执行后回调。","next":"下一章把任务计划放进显式状态，让读者能看见谁声明了进度。","checkpoint":"执行前回调、工具副作用、执行后回调"},{"id":"s05","title":"TodoWrite","zh":"把计划写成可见状态","group":"计划与上下文","previous":"工具调用的先后顺序已经能观察。用户还想知道修复购物车进行到了哪一步。","problem":"一段回复把「修复」「验证」都打了勾，打开购物车仍可能算出 350 分。进度从哪里来？","mechanism":"把工作拆成带状态的待办项，允许更新计划。再把计划、工具动作和业务断言分别检查，才能判断每个勾有多少依据。","input":"计划项、已有状态、一次更新请求，以及实际工具和测试结果。","output":"读者可查的计划状态与金额断言。要让下一轮模型使用计划，还需将这些状态放入请求。","walkthrough":["先写下「定位错误、修正计算、验证两件商品」；计划里的词说明预期工作。","找到状态改为完成的位置，沿记录回查是否真的修改过 cart.py、是否拿到了测试输出。","对照失败路径，算一遍 350 × 2。即使界面把步骤勾完，实际结果仍可能是 350。"],"failure":"失败路径先把三项都记为 done。重算得到 350 后，程序将「修复」「验证」恢复为 pending。沿这两次状态更新就能区分进度声明与实际检查。","question":"计划显示「验证完成」，同一快照上的断言仍得到 350。该怎么处理这项进度？","options":["接受完成标记","只修改预期金额，让断言通过","记录验证失败，重新打开验证项"],"answer":2,"explanation":"计划状态可以人为设定。实际值与预期的差异说明验证目标尚未达到，应保留这一失败证据。","next":"下一章把一个计划项委派给只负责诊断的子 Agent。","checkpoint":"计划更新与业务检查分开记录"},{"id":"s06","title":"Subagent","zh":"限定子任务上下文","group":"计划与上下文","previous":"父 Agent 能保留计划、工具记录和完整对话。","problem":"父 Agent 请另一位助手诊断漏算数量。怎样让它只接触完成诊断所需的材料，最后又让父 Agent 拿到可用的结论？","mechanism":"父 Agent 建一段独立的子任务上下文，明确目标和可读范围。子 Agent 根据收到的材料独立工作，父 Agent 只接收约定的返回内容。","input":"父任务、子任务说明、允许读取的文件与子任务可用的资源。","output":"归属明确的子任务结果，以及父 Agent 获得的诊断或信息缺口。","walkthrough":["父任务保留「修复并说明金额错误」的目标，把「找出 cart.py 中的求和表达式」交给子任务。","展开子任务的输入，看它有没有拿到读取 cart.py 所需的范围。父对话里出现过的文件名不必然会进入子任务。","读回子任务的摘要。循环变量里有 quantity，求和式却只累加 unit_cents。先据此提出漏乘件数的解释，再通过修改和检查验证。"],"failure":"若委派时遗漏文件范围，子任务只能报告材料不足。父 Agent 应补充上下文或调整分工，凭猜测写下漏乘数量缺少依据。","question":"父 Agent 刚读过 cart.py，子任务提示「缺少可读文件」。首先应该检查哪里？","options":["委派时实际传给子任务的上下文和读取范围","父 Agent 的回复是否足够长","先把子任务标为完成"],"answer":0,"explanation":"子任务用自己的上下文工作。父任务读过资料只说明资料曾进入父任务，对子任务是否可见要沿委派边界核对。","next":"下一章让运行时根据任务加载专门知识，进一步控制什么会进入模型输入。","checkpoint":"父任务委派、子任务读取、摘要返回"},{"id":"s07","title":"Skill Loading","zh":"按任务装入技能说明","group":"计划与上下文","previous":"委派时可以控制任务材料。新会话还需要知道这个项目的金额单位和计算约束。","problem":"工具列表已经很长，再把所有编程约定整本放入每轮请求，成本会随材料增长。只把需要的约定传进去，怎样验证？","mechanism":"先列出技能名称和简介。购物车场景给出要加载的名称，运行时按名查找，只有匹配的技能正文才进入本轮输入。","input":"购物车任务、可发现的技能条目与被选中的技能内容。","output":"本轮请求新增的技能正文，或未加载时仍然缺少的约束。","walkthrough":["先找目录里的金额技能，指出这一条目录项透露了什么。","触发加载后再看模型可见的输入，寻找「金额使用整数分」这类具体要求。","切到失败路径。请求的是 currency，目录里登记的是 money；沿找不到条目、没有正文、请求缺约束这三步定位原因。"],"failure":"目录出现技能名，只能说明系统能发现它。若正文没有进入本次请求，模型就不能依靠该正文知道金额约束。","question":"要验证金额技能已经影响了本轮可用信息，最直接的是检查什么？","options":["磁盘上有一份技能文件","发送给模型的输入里出现了加载后的金额约束","模型在回复里使用「技能」一词"],"answer":1,"explanation":"文件存在、目录可见、正文进入请求是三个不同步骤。本题要验证的是最后一步。","next":"下一章研究上下文太长时，刚装入的约束能否被保留下来。","checkpoint":"技能目录命中，正文进入请求"},{"id":"s08","title":"Context Compact","zh":"压缩后还看得见什么","group":"计划与上下文","previous":"金额约束和工具输出会随多轮对话一起进入模型输入。","problem":"长日志被压成「实得 350 分，预期 700 分」之后，模型还能看见用户要求保留哪个函数接口吗？","mechanism":"上下文压缩把长历史整理成较短的可见输入。将要保留的任务约束、关键观察和原始记录分别核对，可以发现摘要遗失了哪条必要信息。","input":"带金额约束和工具结果的原始历史、压缩规则与当前任务。","output":"供下一轮使用的较短上下文，以及仍可回查的原始记录。","walkthrough":["展开执行前的消息，记下用户要求保留整数分和 total_cents 接口。再看八次检查中件数为 2 的实际值与预期值。","停在 context-compacted，仅根据执行后的 messages 回答两个问题：两件应收多少？补丁必须保留哪个函数名？","切到失败路径。摘要仍写着 350 分和 700 分，total_cents 却只在原始消息里。比较 originalIntact 和 constraintVisible，就能指出哪一步丢了接口约束。"],"failure":"保留原文能支持事后调查。下一轮只消费压缩后的信息时，原始档案中仍有的约束也可能对它不可见。","question":"失败摘要仍包含金额，却省掉了原始消息里的 total_cents。怎样让下一轮重新看到接口要求？","options":["只要原始档案保存成功就可以继续","从金额 350 和 700 推出函数名","让运行时回查原始约束，并把接口要求放回请求"],"answer":2,"explanation":"原始记录、用于压缩的摘要、发给模型的请求分别服务于追溯、缩短内容和推理。信息能否被模型使用取决于最后一层。","next":"下一章把时间拉到新会话，检查哪些信息能跨过会话边界。","checkpoint":"原始记录生成较短可见上下文"},{"id":"s09","title":"Memory","zh":"新会话如何记起项目偏好","group":"计划与上下文","previous":"上章发现一条约束在原始记录里仍可回查，下一轮可见的摘要却已经漏掉了它。","problem":"关闭对话再开始一次购物车修复。怎样判断项目偏好真正来自跨会话记忆，而非上一段聊天仍在输入里？","mechanism":"把偏好写入独立存储。会话 B 以空消息列表开始，启动时读回偏好，分别呈现 messages 与 recalled。要进一步验证模型真的使用了偏好，还要查看后续请求。","input":"旧会话中的项目偏好、独立存储和新会话的召回条件。","output":"新会话中实际召回的记录，或者查询为空的结果。","walkthrough":["让会话 A 记下「回归测试名用英文」。正常场景还会把这条偏好写入 preferences.json。","展开会话 B 的状态，确认 messages 为空，再看 recalled 中的 testNames 是否为 English。","沿失败路径只保留上一段消息。比较新会话和存储里的内容，可以解释为什么召回为空。"],"failure":"复用原会话也能让模型复述偏好，无法用来验证跨会话记忆。必须让旧消息退出新会话的输入，再检查召回过程。","question":"哪种对照最能验证这条偏好来自跨会话存储？","options":["新会话都从空历史开始，只改变是否将偏好写入独立存储，再比较召回","在原来的对话里连续问两次","把偏好直接放进第二次问题"],"answer":0,"explanation":"消除旧消息和新问题里的提示，才能把两次观察的差异定位到存储与召回路径。","next":"下一章在真正发起模型调用之前，把运行时掌握的不同信息拼入请求。","checkpoint":"结束旧会话，存储信息在新会话召回"},{"id":"s10","title":"System Prompt","zh":"构造本轮系统提示","group":"计划与上下文","previous":"模型可用的信息已经分散在配置、工具注册、技能和可召回的记录里。","problem":"项目明明写了金额单位，但模型发出的修复建议看起来按元计算。应从哪里判断是配置丢了，还是请求组装时没有带上？","mechanism":"系统提示词记录运行时给模型的高层约束。本章构造的请求将项目规则和预算放入 system，将用户问题放入 messages，并在 tools 单列可用工具名。","input":"项目金额约束、当前工具、预算和本轮任务。","output":"实际将交给教学模型的请求，其中可以逐项检查运行时选入的约束。","walkthrough":["先在配置或已加载资料中找到金额单位，记录它来自哪里。","在 request-built 暂停。system 段包含项目规则与每轮最多一次写入的预算，tools 另列 read、write_fix、check_cart，messages 保留用户问题。","切到缺约束路径。用户消息依然含有「350 分」，但 system 字段丢失了 README 里的接口与单位规则。分别比较这两个字段，才能找到漏掉的部分。"],"failure":"只读提示词模板可能误判。一个模板正确的项目，仍可能在渲染或拼装本轮请求时漏掉动态信息。","question":"README 要求返回整数分，失败场景的 system 字段却漏掉了这条规则。优先检查哪里？","options":["购物车乘法的执行速度","从配置生成本轮请求的组装逻辑","训练模型的参数量"],"answer":1,"explanation":"上游材料还在、送给模型的输入发生缺失，两个观测把故障范围缩小到了请求组装过程。","next":"下一章让系统在收到不同错误时选择不同的恢复方式。","checkpoint":"请求发送前拼入当前规则与能力"},{"id":"s11","title":"Error Recovery","zh":"按副作用决定重试","group":"计划与上下文","previous":"正常路径能够组织请求、选择工具并拿到结果。","problem":"读文件超时可以再读一次。若写入后只是回执丢了，再把写请求执行一遍会发生什么？","mechanism":"错误恢复先判断调用走到了哪一步、是否已经产生副作用，再选择安全重试、回读核验、报告缺口或终止。重试需要有次数或时间上限。","input":"失败阶段、工具是否写入、已有调用记录与剩余预算。","output":"重试的一次新尝试、核验结果，或附有原因的停止。","walkthrough":["在只读步骤注入超时。重读可以取得 cart.py，文件内容本身不会因重复读取而改变。","在写入完成后丢掉回执。此时「没有收到成功消息」和「文件没有变化」是两个不同判断。","读取文件并跑两件商品的用例。先确定当前是 350 还是 700，再决定需不需要补写。"],"failure":"按异常类型一律重试会把丢失回执当成工具从未执行。对于非幂等操作，即重复一次可能多产生一次副作用的操作，这会直接改变结果。","question":"写工具已落盘，发送回执时超时。下一步优先做什么？","options":["立即重复整个写操作","认为任务已失败并抹掉之前所有记录","核对现在的文件和检查结果，再决定是否补做"],"answer":2,"explanation":"超时说明调用者没拿到回执。读取当前状态可以区分「已经完成」与「尚未完成」，随后才有依据重试。","next":"下一章把恢复范围从一次工具调用扩展到有依赖关系的任务。","checkpoint":"错误发生点决定重试或回读"},{"id":"s12","title":"Task System","zh":"用依赖决定可领取工作","group":"任务与协作","previous":"单次工具调用遇错已经有恢复策略，计划也能显示进度。","problem":"任务进行一半中断。恢复后，调度器怎么知道「验证修复」是否已经可以领取，而不用重新读完整段聊天？","mechanism":"把任务状态和前置依赖存下来。调度器重新载入后，根据前置任务是否完成计算当前可领取的工作。","input":"持久任务记录、修复与验证之间的依赖、最近写入的状态。","output":"新计算的就绪任务集合、被阻挡的任务及其原因。","walkthrough":["让 verify 依赖 fix。在缺陷快照下询问调度器是否可领取这两项任务。","完成 fix 并保存状态，再重新载入记录；查看 verify 的就绪条件哪一项变了。","尝试提前领取 verify。任务表里能看见它，只说明它已被创建，领取仍受前置条件限制。"],"failure":"如果只从上一轮的聊天摘要恢复，可能遗漏 fix 已完成或仍未完成的事实。检查持久记录和依赖计算能定位为何阻挡或错误放行。","question":"重新载入后 fix 仍未完成，verify 正依赖它。此时哪件事成立？","options":["verify 已存在，但还不能领取","verify 从任务表中永久删除","verify 应立即将自己记为通过"],"answer":0,"explanation":"创建任务、前置条件满足、执行验证、验证通过分别是不同状态。恢复后要根据持久记录重新推导就绪性。","next":"下一章允许已经领取的慢任务脱离当前回复继续执行。","checkpoint":"读取持久依赖后计算就绪任务"},{"id":"s13","title":"Background Tasks","zh":"先提交，稍后读结果","group":"任务与协作","previous":"调度器知道验证任务何时具备启动条件。","problem":"检查购物车可能要等一段时间。若主循环提交后立刻回复「通过」，它到底看到了运行结果，还是只拿到了提交回执？","mechanism":"后台任务把提交和完成拆成两个时刻。先返回可追踪的任务标识，主循环继续其他工作，等结果可用时再按标识取回。","input":"验证请求、任务标识，以及后台工作的当前状态。","output":"提交回执、执行状态和最终可以取回的验证结果。","walkthrough":["把购物车检查放到后台，记下提交得到的任务标识。","读失败场景的 job-polled。job-1 仍在 queued，result 为空，主循环此时可以整理修改说明。","切回正常场景。实验器先推进队列，再读取同一任务，输出 700 与通过的断言。这个队列由实验器推进，重置可重复观察两个时机。"],"failure":"提交成功只说明任务已被接收。提前轮询看不到结果可能只是时机太早，判断任务失败还需要明确的终止状态。","question":"后台检查已提交，但第一次读取时仍在运行。此时可以向用户确认什么？","options":["两件商品的回归断言已通过","本次检查已被接受，仍待结果","这次检查已永久失败"],"answer":1,"explanation":"提交回执可以证明被接受，不能推出计算是否完成。用同一标识读到终态和输出，才有条件汇报结果。","next":"下一章将检查的触发者由当前用户动作换成一段可复现的时间规则。","checkpoint":"提交回执与后台完成分两次返回"},{"id":"s14","title":"Cron Scheduler","zh":"用可控时钟触发复查","group":"任务与协作","previous":"验证已经可以作为一个后台任务执行。","problem":"希望定时复查购物车。调度器在同一个应触发时刻被唤醒两次，会发出几个验证任务？","mechanism":"本章只注册一条复查规则。用可控时钟推进时间，把已处理的分钟槽记入 seen，再次收到同一分钟就跳过派发。扩展到多条规则时还要区分规则身份。","input":"调度规则、模拟时钟、当前时间槽和该槽的触发记录。","output":"新建的复查任务，或重复到达同一时间槽时的去重记录。","walkthrough":["先让模拟时钟停在触发点之前，观察是否创建检查。","把时钟推进到 5，出现一次 check@5。查看 jobs 和 seen，它们分别回答派了什么任务、哪个时间槽已经处理。","让同一个时刻再次到达，核对总派发次数。只看时钟跳了几次不能回答创建了几个任务。"],"failure":"相同时间槽重复到达很常见。若仅判断「现在已到时间」而不检查触发记录，两次唤醒会生成两份相同的复查。","question":"同一条规则、同一个应触发时间槽被处理两次。教学调度器应该留下几次实际派发？","options":["零次","两次","一次，重复处理留下去重依据"],"answer":2,"explanation":"时间槽把多次唤醒归到同一次预定执行。下一时间槽仍可正常触发，去重不能把以后所有执行一并屏蔽。","next":"下一章把一次工作交给不同角色协同完成，追踪各自所用的快照。","checkpoint":"时间槽命中并检查是否已派发"},{"id":"s15","title":"Agent Teams","zh":"分工之后如何复核","group":"任务与协作","previous":"任务可以被调度，也可以在后台运行。","problem":"修复者报告 cart.py 已改，复核者却仍测到 350 分。协调者怎样判断是修复本身有错，还是复核者读了旧文件？","mechanism":"给参与者分配明确职责，并记录各自的任务、输入快照和产物。汇总时要把验证结果关联到对应修复版本，才知道两份报告能否比较。","input":"修复任务、复核任务、各角色拿到的文件版本。","output":"按角色和版本归属的修改、验证结果与汇总结论。","walkthrough":["找到 builder 的报告。changed 为真说明写操作改变了 cart.py，金额结果还要看 reviewer 的检查。","把待验版本交给复核者，查看它实际使用哪个快照、期望金额是多少。","把失败场景里 reviewer 的起始副本和正常场景里的修复后副本并排，对照实际 350 与 700。两个报告必须连同 snapshot 一起阅读。"],"failure":"复核者可以认真运行正确用例，却测在旧文件上。汇总者若丢掉快照身份，会把旧版本的失败错误地归到新修改上。","question":"修复者报告文件已修改，复核者却算出 350 分。判断修复是否有效前，最该先核对什么？","options":["各自检查的文件版本和测试输入","谁的总结更详细","谁最后发送消息"],"answer":0,"explanation":"只有同一待验版本和同一输入下的结果才能直接比较。版本不同本身已经足以解释数字差异。","next":"下一章将角色间的回复组织成可关联、可处理重复投递的消息。","checkpoint":"按角色与快照汇总验证结果"},{"id":"s16","title":"Team Protocols","zh":"重复消息只处理一次","group":"任务与协作","previous":"团队成员已经能分工，复核者也能核对文件快照。","problem":"修复者请复核者检查 cart.py，同一个复核请求被投递了两次。接收方怎样避免重复受理？","mechanism":"团队协议约定请求携带消息类型、发送者、接收者和关联任务。接收方先检查消息标识，首次受理后记录它，再次收到同一标识即可识别重发。","input":"修复者 builder 发给 reviewer 的 review-request，消息编号 msg-1，关联任务 cart-fix。","output":"受理或重复投递的决定，以及接收方保留的已收消息编号。","walkthrough":["展开 builder 发给 reviewer 的请求，分别找到消息编号 msg-1 和任务编号 cart-fix。","第一次送达时，接收方记录 msg-1，返回 accepted。此处只证明请求已被受理，验证结果要等以后产生。","重复送达同一请求，看返回值是否变成 duplicate，再数一次 receivedIds 中留下几项。"],"failure":"两次独立的复核请求可以使用相同正文。对照消息编号能区分重发与新请求，再根据任务编号确定该由哪项工作消费。","question":"同一消息 ID 的复核请求重复抵达。什么结果能说明接收方去重有效？","options":["将请求受理两次","第一次受理，重复投递标为 duplicate","永久屏蔽修复者的后续消息"],"answer":1,"explanation":"同一请求可以收到多次。去重后只保留一次受理记录，修复者以后发送新编号的请求仍可正常处理。","next":"下一章让成员自己发现并领取工作，观察竞争同一任务时谁成功。","checkpoint":"消息抵达后按身份去重并归属"},{"id":"s17","title":"Autonomous Agents","zh":"自主发现并认领工作","group":"任务与协作","previous":"成员能接收任务报告，协调方也能计算可执行任务。","problem":"两名空闲成员都看到购物车修复任务 cart-fix 可领取。cart-verify 还依赖它，怎样避免重复领修复或抢先做验证？","mechanism":"成员主动查询就绪工作，并尝试认领。认领时把「仍可领取」的判断和「设置负责人」这次修改绑定在一个不可拆开的操作里。","input":"当前就绪任务、申请认领的成员、任务负责人和状态。","output":"明确的认领成功或失败，及找不到可领取工作时的空闲状态。","walkthrough":["先看 ready-discovered 的前后状态。SQLite 表有 cart-fix 和 cart-verify，后者依赖尚未完成的前者。第一次查询只返回 cart-fix。","在竞争场景中，A 和 B 先后读到同一个候选。A 的条件更新将修复项置为 running 并写入负责人。B 用旧候选提交时再次检查状态、负责人和依赖；查看 won 是否为真。","两次重新查询均为空：修复有人执行，验证尚未就绪。到 worker-stopped 核对 reason=idle-limit 和 allTasksDone=false。空闲次数达到上限只结束本次轮询。"],"failure":"只先读「无人负责」，过一会儿再写自己的名字，会给另一位成员留下竞争窗口。教学轨迹检查的是认领合同，生产中的并发保证还取决于同步或存储实现。","question":"两名成员都看到任务曾经空闲。怎样判断谁取得了执行资格？","options":["两人都会自动取得资格","谁先看到任务列表谁就有资格","以条件认领成功并写入的负责人为准"],"answer":2,"explanation":"发现候选工作与成功取得所有权分两步。认领的返回值和最终负责人共同决定谁可以执行。","next":"即便任务归属清楚，两位成员仍可能改到同一个文件。下一章处理这个冲突。","checkpoint":"在认领时检查状态并设置负责人"},{"id":"s18","title":"Worktree Isolation","zh":"分开工作目录再合并","group":"任务与协作","previous":"工作可以清楚地归属于不同成员，但它们仍可能编辑同一份文件。","problem":"工作副本修了乘法，在它合回前，主目录的 cart.py 多了一行注释。两人改的是不同位置，教学合并器会放行吗？","mechanism":"为每份工作提供独立目录和共同基线。准备合并时比较基线、当前目标与待合入修改，目标已变化时先报告冲突。教学实验用临时目录副本演示边界。","input":"共同起点、各自的工作副本，以及合并时的目标内容。","output":"可安全应用的更新，或保留两侧修改的冲突报告。","walkthrough":["从同一个有缺陷版本准备工作副本，在一个副本修复乘法，观察另一个副本是否随之变化。","目标仍与基线相符时，观察修复怎样合入，再核对金额。","让主目录添加一行注释。教学合并器按整份文件比较基线，连这个不同位置的改动也会触发 conflict；主目录的注释应当保留下来。"],"failure":"独立目录解决编辑时互相覆盖的问题。两个改动最终写回同一位置时仍可能冲突；本章实验覆盖目录副本和基线检查，真实 Git worktree 的分支、索引和合并需要另行验证。","question":"成员在自己的目录里测试通过，合并前目标文件已改变。较稳妥的下一步是什么？","options":["比较基线与两侧修改、处理冲突，再对合并结果运行检查","用测试通过的一侧直接覆盖目标","删除两个工作目录并宣布完成"],"answer":0,"explanation":"副本内通过只支持该副本的行为。合并目标发生变化时，要确定双方修改的关系，并验证最终形成的新版本。","next":"下一章把验收能力接到外部工具接口上，沿同一工具合同追踪请求和返回。","checkpoint":"工作副本并行编辑后检查合并基线"},{"id":"s19","title":"MCP Tools","zh":"发现并调用外部工具","group":"扩展与集成","previous":"工具注册表只能分发已知的本地能力。验证购物车时，也可能需要使用外部服务暴露的检查工具。","problem":"外部服务列出了一个工具。运行时怎样知道该传哪些参数，又怎样把返回的结果送回发起请求的那一轮？","mechanism":"MCP（模型上下文协议）为发现与调用外部工具提供约定。适配层先取得工具定义，再把名称、参数和调用送到服务，最后将结果或错误归回本地循环。","input":"服务公布的工具名和参数约束、实际调用参数、本次请求的标识。","output":"发现的可用能力，以及归属明确的外部成功结果或错误。","walkthrough":["先查看教学服务公布的工具清单，再到第一轮 request-built 看模型实际收到的 cart/cart_check 及参数约束。此时还没有业务结果。","id=1 取得清单；模型调用 call-1 后，适配器用协议 id=2 调用 cart_check。在 rpc-returned 核对响应 ID，继续走到 tool-finished 与下一轮 request-built。模型从 call-1 的工具消息中读出实际 350、预期 700。","切到失败路径。模型请求 missing_cart，协议错误也放回 call-1 对应的工具消息。看最终回复能否指出服务返回的具体错误。此处服务位于同一进程，网络传输和连接协商需另行实验。"],"failure":"工具发现成功只支持「该接口给出了定义」。实际执行还依赖名称、参数和服务端响应，把清单当成功结果会漏掉这些失败点。","question":"服务已列出检查工具。能说明本次调用真正完成的是哪项观测？","options":["清单中含有工具名称","存在与本次调用匹配的响应，并能检查它携带的结果或错误","页面显示服务地址"],"answer":1,"explanation":"发现阶段可以没有任何业务输出。一个与本次调用匹配的响应能说明调用有了结果，但其中仍可能是错误。","next":"最后把工具、权限和后台验证接在一起，按一条完整任务的结果验收。","checkpoint":"先发现工具，再关联调用和响应"},{"id":"s20","title":"Comprehensive Agent","zh":"从复现到验证的完整运行","group":"扩展与集成","previous":"工具、权限、任务、并行修改和结果回收都有了可独立观察的边界。","problem":"用户关心的是两件 350 分的商品是否已经按 700 分收费。怎么沿调用链给出一个站得住的答复？","mechanism":"把已有机制用于同一次修复。模型依次读取源码写入和新增测试的工具回执，然后结束对话。实验器接着运行后台检查和 unittest，汇总读者可以据以报告的验收结果。","input":"含缺陷的起始快照、金额单位约束、授权分支，以及对同一用例的预期值 700。","output":"一条可回查复现依据与写入决定的轨迹。其最后一项给出后台金额、回归用例、计划状态与 completed 判定。","walkthrough":["从 350 × 2 的断言开始，保留修改前实际 350、预期 700 的观察。","沿正常路径追踪写入和测试变更。第二条用例是 2 × 350 + 3 × 20 = 760 分。在最后一步分别核对后台返回 700，以及 unittest 的两个用例都通过。","从同一初始快照切到拒绝路径，找出正常与受阻轨迹第一次不同的决定。判断后续哪些结论还可以成立。","回到用户语言，分别说明问题能否复现、写入是否获准、修复后断言是否通过。若某项没有证据，就报告它停在哪一步。"],"failure":"最终回复和后台任务都能正常结束，但若缺少对修改后版本的断言，仍无法回答是否已修复。先定位最早分叉，再检查它具体破坏了哪项承诺。","question":"哪组证据足以支持「这次修复解决了给定用例」？","options":["出现最终回复并且所有待办打勾","后台任务已提交且模型解释了乘法","同一用例在旧快照得到 350，修改后目标快照返回 700，回归断言通过"],"answer":2,"explanation":"相同输入与预期、明确关联的前后快照、可核对的断言支持给定用例上的修复结论。对其他商品和规则的推广仍需相应测试。","next":"可以回到 s03 对照拒绝分支，再到 s13 检查何时拿到结果，用同一套问题分析自己的 Harness。","checkpoint":"从复现、写入决定一直追到目标版本的检查结果"}],"practiceOriginal":{"s01":[{"heading":"试一下","blocks":[{"tag":"blockquote","text":"教学 demo 提示：代码会执行模型生成的 shell 命令。建议在一个临时测试目录中运行，避免影响你的项目文件。s03 会讲真正的权限系统。"},{"tag":"p","text":"准备（首次运行）："},{"tag":"pre","text":"pip install -r requirements.txt\ncp .env.example .env\n# 编辑 .env，填入 ANTHROPIC_API_KEY 和 MODEL_ID\n"},{"tag":"p","text":"运行："},{"tag":"pre","text":"python s01_agent_loop/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Create a file called hello.py that prints \"Hello, World!\""},{"tag":"li","list":"ol","text":"List all Python files in this directory"},{"tag":"li","list":"ol","text":"What is the current git branch?"},{"tag":"p","text":"观察重点：模型什么时候调用工具（循环继续），什么时候不调用（循环结束）？"}]}],"s02":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s02_tool_use/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Read the file README.md and tell me what this project is about"},{"tag":"li","list":"ol","text":"Create a file called test.py that prints \"hello\", then read it back"},{"tag":"li","list":"ol","text":"Find all Python files in this directory"},{"tag":"li","list":"ol","text":"Read both README.md and requirements.txt, then create a summary file"},{"tag":"p","text":"观察重点：模型什么时候只调一个工具，什么时候一次调多个？多个工具调用的顺序和结果是否正确？"}]}],"s03":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s03_permission/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Create a file called test.txt in the current directory（应该直接通过）"},{"tag":"li","list":"ol","text":"Delete all temporary files in /tmp（bash + rm 会触发闸门 2）"},{"tag":"li","list":"ol","text":"What files are in the current directory?（只读，全部通过）"},{"tag":"li","list":"ol","text":"Try to write a file to /etc/something（写工作区外，触发闸门 2）"},{"tag":"p","text":"观察重点：哪些操作直接通过？哪些需要你确认？哪些被直接拒绝？"}]}],"s04":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s04_hooks/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Read the file README.md（应该直接通过，观察 hook 日志）"},{"tag":"li","list":"ol","text":"Create a file called test.txt（通过后观察 PostToolUse 是否触发）"},{"tag":"li","list":"ol","text":"Delete all temporary files in /tmp（bash + rm 触发权限 hook）"},{"tag":"p","text":"观察重点：每次工具执行前，是否出现了 [HOOK] 日志？权限被拒时，是 hook 拦截的还是循环里硬编码的？"}]}],"s05":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s05_todo_write/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Refactor s05_todo_write/example/hello.py: add type hints, docstrings, and a main guard（先列 3 步再执行）"},{"tag":"li","list":"ol","text":"Create a Python package under s05_todo_write/example/demo_pkg with __init__.py, utils.py, and tests/test_utils.py"},{"tag":"li","list":"ol","text":"Review Python files under s05_todo_write/example and fix any style issues"},{"tag":"p","text":"观察重点：第一次工具调用是不是 todo_write？TODO 列了几步？执行过程中状态有没有从 pending 变成 in_progress / completed？"}]}],"s06":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s06_subagent/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Use a subtask to find what testing framework this project uses（子 Agent 去读文件，主 Agent 只收结论）"},{"tag":"li","list":"ol","text":"Delegate: read all .py files in agents/ and summarize what each one does"},{"tag":"li","list":"ol","text":"Use a task to create s06_subagent/example/string_tools.py with a slugify(text: str) function, then verify it from the parent agent"},{"tag":"p","text":"观察重点：是否出现 [Subagent spawned] / [Subagent done]？子 Agent 的工具调用是否以 [sub] ... 输出？主 Agent 最后是否只继续处理子 Agent 返回的摘要？"}]}],"s07":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s07_skill_loading/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"What skills are available?"},{"tag":"li","list":"ol","text":"Load the code-review skill and follow its instructions"},{"tag":"li","list":"ol","text":"I need to do a code review -- load the relevant skill first"},{"tag":"p","text":"观察重点：Agent 是否直接从 SYSTEM 里的目录知道有哪些技能？需要完整规范时是否出现 [HOOK] load_skill？加载后回答是否使用了对应 skill 的说明？"}]}],"s08":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s08_context_compact/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Read the file README.md, then read code.py, then read s01_agent_loop/README.md（连续读多个文件，观察 L2 压缩旧结果）"},{"tag":"li","list":"ol","text":"Read every file in s08_context_compact/（一次性读大量内容，观察 L3 落盘）"},{"tag":"li","list":"ol","text":"反复对话 20+ 轮，观察是否出现 [auto compact] 或 [reactive compact]"},{"tag":"p","text":"观察重点：每次工具执行后，旧 tool_result 是否被压缩？连续对话后 token 超阈值时，是否自动触发了摘要？"}]}],"s09":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s09_memory/code.py\n"},{"tag":"p","text":"试试这些 prompt（分多轮输入，观察记忆的累积和加载）："},{"tag":"li","list":"ol","text":"I prefer using tabs for indentation, not spaces. Remember that."},{"tag":"li","list":"ol","text":"Create a Python file called test.py（观察 Agent 是否用了 tab）"},{"tag":"li","list":"ol","text":"What did I tell you about my preferences?（观察 Agent 是否记得）"},{"tag":"li","list":"ol","text":"I also prefer single quotes over double quotes for strings."},{"tag":"p","text":"观察重点：每轮结束后是否出现 [Memory: extracted N new memories]？.memory/ 目录下是否生成了 .md 文件？MEMORY.md 索引是否更新？新一轮对话时 Agent 是否自动加载了之前的记忆？"}]}],"s10":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s10_system_prompt/code.py\n"},{"tag":"p","text":"观察重点："},{"tag":"li","list":"ol","text":"输出中能看到哪些 section 被加载了（[assembled] sections: ... 标签）"},{"tag":"li","list":"ol","text":"连续对话时，缓存命中显示 [cache hit]"},{"tag":"li","list":"ol","text":"创建 .memory/MEMORY.md 文件后，下一轮 memory section 自动加载"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Read the file README.md（观察始终加载的三个 section）"},{"tag":"li","list":"ol","text":"Create a file called .memory/MEMORY.md with content \"- [test](test.md) — test memory\"（写入记忆索引）"},{"tag":"li","list":"ol","text":"Read the file code.py（观察 memory section 是否出现）"}]}],"s11":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s11_error_recovery/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"让 Agent 生成一段很长的代码，观察截断后是否自动续写（看 [max_tokens] escalating 日志）"},{"tag":"li","list":"ol","text":"连续读取大量文件撑大上下文，观察 reactive compact"},{"tag":"li","list":"ol","text":"如果遇到 429/529，观察指数退避的日志输出"}]}],"s12":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s12_task_system/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Create tasks: setup database schema, create API endpoints (depends on schema), write tests (depends on endpoints), write docs (depends on schema)"},{"tag":"li","list":"ol","text":"List all tasks and their statuses"},{"tag":"li","list":"ol","text":"Claim the first unblocked task and complete it"},{"tag":"li","list":"ol","text":"List tasks again — which ones are now unblocked?"},{"tag":"p","text":"观察重点：.tasks/ 目录下是否生成了 JSON 文件？完成任务后，被阻塞的任务是否解锁？"}]}],"s13":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s13_background_tasks/code.py\n"},{"tag":"p","text":"试试这些 prompt："},{"tag":"li","list":"ol","text":"Run pip list in the background and find all Python files in this directory"},{"tag":"li","list":"ol","text":"Run npm install (use run_in_background) and while waiting, read package.json"},{"tag":"li","list":"ol","text":"Create a task to setup the project, then run pip list in the background"},{"tag":"p","text":"观察重点：慢操作有没有被送到后台？bg_id 是否返回？后台通知有没有以 \u003ctask_notification> 格式注入？"}]}],"s14":[{"heading":"试一下","blocks":[{"tag":"pre","text":"cd learn-claude-code\npython s14_cron_scheduler/code.py\n"},{"tag":"p","t i","list":"ul","text":"队友是否提交 plan，并在 approval 前暂停"},{"tag":"li","list":"ul","text":"plan 批准后，队友是否能认领任务"},{"tag":"li","list":"ul","text":"worktree 绑定后，队友是否切到对应目录"}]}]},"chapterReadings":{"s10":{"documents":[{"title":"已确认定稿 · 请求字段与缓存断点","url":"/study-notes/s10/confirmed.html"},{"title":"作业、源码与旧笔记逐项对照","url":"/study-notes/s10/evidence.html"},{"title":"Harness Lab · 比较两次请求","url":"/study-notes/s10/lab.html"}],"points":[{"point":1,"title":"提示词里提到工具，实际调用还需要什么？","question":"system 里写了 read_file，模型凭哪份数据知道它接受一个 path 参数？","tutorial":"s10 在 system 中拼入固定的 identity、tools、workspace 三段。tools 段只列工具名字。发请求时另传 TOOLS，里面才有 read_file 的参数 schema；模型选中它后，主循环按名字从 TOOL_HANDLERS 找处理函数。","snapshot":"快照也分别构造 system、tools 和 messages。普通路径把通过筛选的工具交给 toolToAPISchema，生成 name、description、input_schema 等字段，最后用 allTools 填请求。文字中的工具说明和 API 里的工具定义应分别检查。","oldNote":"335 行对照稿的请求形状图值得配合原研究笔记的四字段总图看。教学版 tools 说明是常量；从处理器表删工具可以改变缓存键，即便提示词里的名字尚未变。","check":"对同一次读取，分别指出 system 的说明文字、tools 中的参数定义、assistant 的 tool_use，以及下一条 user 消息中带相同 ID 的 tool_result。","refs":[{"label":"教学 · 三个常驻片段","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":54},{"label":"教学 · 工具定义","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":134},{"label":"教学 · 请求和分发","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":176},{"label":"快照 · 构造工具 schema","path":"harness-fusion-tutorial/sources/claude-code/src/services/api/claude.ts","line":1235},{"label":"快照 · 请求字段汇合","path":"harness-fusion-tutorial/sources/claude-code/src/services/api/claude.ts","line":1701},{"label":"原研究笔记 · 请求总图","path":"claude-code-internals/notes/cc-prompt-assembly.md","line":14},{"label":"335 行对照稿 · 请求形状","path":"harness-fusion-tutorial/学习笔记/s10-prompt-cache与系统提示词组装-作业对照源码与旧笔记.md","line":153},{"label":"作业 · 三个工具","path":"harness-fusion-tutorial/learn-claude-code-homework-2026-11-23/s10_system_prompt/HOMEWORK.zh.md","line":37}]},{"point":1,"title":"写完 MEMORY.md，哪一次请求才读到新规则？","question":"在两次提问之间从程序外改文件，下一问一定马上收到新内容吗？","tutorial":"程序启动时取一份 context。agent_loop 入口拿已有 context 拼 system；一轮工具结束后才重新读文件并重算，同一轮内的下一次模型请求可因此看到新内容。用户问题结束后，外层也会再取 context。若在外层取完以后才从程序外改文件，下问的第一次模型请求仍可能用旧值。","snapshot":"快照在 QueryEngine.submitMessage 内调用 fetchSystemPromptParts。默认路径并行取得默认提示、userContext 和 systemContext。动态段中，普通段按名复用已算结果，标为 cacheBreak 的段会重新计算。进入一次组装流程并不意味着重新从磁盘读取每个来源。","oldNote":"335 行对照稿第 53、172 行分别列出读文件和查缓存的时机，作业也保存了两问之间从外部改文件的回放。原研究笔记曾把默认提示列在 submitMessage 之前；实际调用发生在该方法内，各段可独立复用。","check":"在纸上分别放置三个动作：程序外改文件、update_context、下一次 messages.create。试着交换前两个动作，再预测哪次请求会先看到新偏好。","refs":[{"label":"教学 · 实际读文件","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":159},{"label":"教学 · 入口使用已有 context","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":174},{"label":"教学 · 工具轮次后的刷新","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":196},{"label":"教学 · 提问结束后的刷新","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":214},{"label":"快照 · 提交消息时组装","path":"harness-fusion-tutorial/sources/claude-code/src/QueryEngine.ts","line":292},{"label":"快照 · 默认三路输入","path":"harness-fusion-tutorial/sources/claude-code/src/utils/queryContext.ts","line":61},{"label":"快照 · 段缓存命中条件","path":"harness-fusion-tutorial/sources/claude-code/src/constants/systemPromptSections.ts","line":50},{"label":"原研究笔记 · 时序表","path":"claude-code-internals/notes/cc-prompt-assembly.md","line":482},{"label":"335 行对照稿 · 读取时机","path":"harness-fusion-tutorial/学习笔记/s10-prompt-cache与系统提示词组装-作业对照源码与旧笔记.md","line":53},{"label":"335 行对照稿 · 两处写法可互查","path":"harness-fusion-tutorial/学习笔记/s10-prompt-cache与系统提示词组装-作业对照源码与旧笔记.md","line":172},{"label":"作业 · 外部写文件离线回放","path":"harness-fusion-tutorial/learn-claude-code-homework-2026-11-23/s10_system_prompt/HOMEWORK.zh.md","line":174}]},{"point":1,"title":"项目指令、记忆索引与 system 里的 memory 段","question":"同样写着“默认用中文”，在教学版和快照中，它会进入请求的哪个字段？","tutorial":"s10 只读 .memory/MEMORY.md，去掉两端空白后有内容，才把整个文件文本拼到 system 末尾的 Relevant memories 段。它没有沿索引再读各篇记忆。PROMPT_SECTIONS 里名为 memory 的模板没有被这个分支使用。","snapshot":"快照默认提示中的 memory 段由 loadMemoryPrompt 生成记忆使用说明。另一条路径收集项目指令与允许注入的自动记忆入口，由 getUserContext 提供 claudeMd 和日期，再由 prependUserContext 包装成 role=user 的元消息。若自动记忆索引过滤开关开启，AutoMem/TeamMem 会从这条前置路径移除。","oldNote":"原研究笔记把系统里的使用说明与用户上下文里的索引分开了。335 行对照稿的示例可用于比较字段，使用它时需保留自动记忆启用、索引过滤等条件。","check":"分别定位“如何维护记忆”的说明、记忆条目目录、用户实际提问。若打开索引过滤，哪部分可能仍在 system，哪部分需要转去附件查？","refs":[{"label":"教学 · 条件拼入完整文件内容","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":60},{"label":"教学 · 读取入口文件","path":"harness-fusion-tutorial/sources/learn-claude-code/s10_system_prompt/code.py","line":159},{"label":"快照 · memory 说明段","path":"harness-fusion-tutorial/sources/claude-code/src/constants/prompts.ts","line":495},{"label":"快照 · 系统说明与正文的分工","path":"harness-fusion-tutorial/sources/claude-code/src/memdir/memdir.ts","line":197},{"label":"快照 · 收集自动记忆入口","path":"harness-fusion-tutorial/sources/claude-code/src/utils/claudemd.ts","line":980},{"label":"快照 · 条件过滤 AutoMem 和 TeamMem","path":"harness-fusion-tutorial/sources/claude-code/src/utils/claudemd.ts","line":1146},{"label":"快照 · userContext 字段","path":"harness-fusion-tutorial/sources/claude-code/src/context.ts","line":185},{"label":"快照 · 前置元消息","path":"harness-fusion-tutorial/sources/claude-code/src/utils/api.ts","line":461},{"label":"原研究笔记 · 自动记忆两条输入路径","path":"claude-code-internals/notes/cc-prompt-assembly.md","line":257},{"label":"335 行对照稿 · 索引位置","path":"harness-fusion-tutorial/学习笔记/s10-prompt-cache与系统提示词组装-作业对照源码与旧笔记.md","line":231},{"label":"作业 · 只读一个文件","path":"harness-fusion-tutorial/learn-claude-code-homework-2026-11-23/s10_system_prompt/HOMEWORK.zh.md","line":36}]},{"point":1,"title":"按需召回的正文和技能目录怎样抵达模型？","question":"项目里已有一篇中文风格规范，要怎样证明本次请求真的收到它的内容？","tutorial":"本章只有主循环的一处模型调用。把文件名写进 MEMORY.md，只会使那行文字随 system 发出；s10 没有用目录做 side query，也没有列出 load_skill 工 e":"1.1 一次回答为什么会变成多个 Step","topic":"s01","crosswalk":1,"question":"第一次请求后得到工具调用，谁会再向模型发请求？","detail":"查看两步 get_time 示例。运行时执行工具，将结果加入消息，再以新历史发起下一步；当模型停止提出调用，当前 Turn 才结束。"},{"label":"1.2 工具执行需要一条统一的反馈入口","needle":"1.2 工具执行需要一条统一的反馈入口","topic":"s01","crosswalk":2,"question":"工具成功返回、工具名拼错和参数不合法分别如何回到模型？","detail":"跟到工具调用的执行和错误包装。运行时把工具身份及执行结果写回历史，模型可以在下一次请求中读到这次调用的结果或失败原因。"},{"label":"1.3 这条循环在 DSH 中处于什么位置","needle":"1.3 这条循环在 DSH 中处于什么位置","topic":"s20","crosswalk":4,"question":"第一章的小循环已经能做什么，哪些职责会在后面加入？","detail":"先保留 Step 的模型、工具与反馈路径，再把能力注册、会话事件和跨轮推进接进后续章节。只观察 Turn 结束还不能判断用户的目标达成。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-1 .evidence-block[data-evidence-cue]"},{"id":"chapter-2","title":"上下文与缓存复用","subtitle":"让稳定前缀尽可能长","path":"/dsh-course/?locale=zh#chapter-2","online":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-2","topics":["s08","s10"],"points":[{"label":"2.1 模型视图可以缩短，完整事实必须保留","needle":"2.1 模型视图可以缩短，完整事实必须保留","topic":"s08","crosswalk":2,"question":"工具返回很长的资料时，模型和事后回放看到的内容是否相同？","detail":"示例给投影设置字符上限，过长的工具结果只保留首尾和省略长度。源历史仍保留完整内容。它按输出长度处理，和原课按工具结果的新旧位置替换有区别。"},{"label":"2.2 请求的排列决定变化落在哪里","needle":"2.2 请求的排列决定变化落在哪里","topic":"s10","crosswalk":null,"question":"本次 Step 的动态说明放在哪，才会尽量少打断相邻请求的共同前缀？","detail":"固定系统规则和工具说明在前，历史按顺序追加，本步说明最后附上。与原课提示构造可比较的是模型实际输入如何排列。"},{"label":"2.3 用可重复的比较检查结构是否稳定","needle":"2.3 用可重复的比较检查结构是否稳定","topic":"s10","crosswalk":null,"question":"比较两份请求得出的前缀长度，能否证明供应商的缓存实际命中？","detail":"页面对序列化后的输入查找第一处分歧。该比较能够解释结构稳定性，真实缓存命中要读模型服务的使用记录。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-2 .evidence-block[data-evidence-cue]"},{"id":"chapter-3","title":"一切皆插件","subtitle":"用插件统一运行能力","path":"/dsh-course/?locale=zh#chapter-3","online":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-3","topics":["s02","s20"],"points":[{"label":"3.1 安装一项能力时，先确定它的生命周期","needle":"3.1 安装一项能力时，先确定它的生命周期","topic":"s02","crosswalk":1,"question":"一个插件把工具装到 Context 后，谁持有注册结果？","detail":"安装时记录活动插件。工具及服务等贡献关联到所属插件，安装失败时可以按登记的清理动作回滚。与原课工具分发共同观察的是能力何时真正可用。"},{"label":"3.2 注册能力时，同时记录它如何退出","needle":"3.2 注册能力时，同时记录它如何退出","topic":"s02","crosswalk":null,"question":"如果只删除插件名称，为什么工具可能还会留在运行时？","detail":"挂载时登记撤销函数，卸载时按反向顺序清理已登记贡献。读者可沿同一工具检查注册、可见和卸载三个时刻。"},{"label":"3.3 能力贡献的来源","needle":"3.3 同一条账目覆盖","topic":"s20","crosswalk":null,"question":"工具和系统提示等贡献，如何共同跟随插件的生命周期变化？","detail":"查看贡献来源和清理路径。TypeScript 教学版还展示监听器等贡献；Python 教学版在同一小节使用更小的工具和提示词例子。"},{"label":"3.4 这正是 DSH 与常见 Harness 拉开距离的地方","needle":"3.4 这正是 DSH 与常见 Harness 拉开距离的地方","topic":"s20","crosswalk":null,"question":"为什么这里要把能力的注册与撤销放到同一个 Context？","detail":"这个示例把运行时能力当作可安装、可观察和可释放的贡献。它解释教程通过哪种结构表达 dsh 的插件设计。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-3 .evidence-block[data-evidence-cue]"},{"id":"chapter-4","title":"让运行有迹可循","subtitle":"从日志重建执行过程","path":"/dsh-course/?locale=zh#chapter-4","online":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-4","topics":["s01","s20"],"points":[{"label":"4.1 先按发生顺序保存事实","needle":"4.1 先按发生顺序保存事实","topic":"s01","crosswalk":2,"question":"一次调用的用户消息、工具请求和反馈可以从哪里重新读出？","detail":"SessionLog 追加带序号的事件。还原某次模型请求时需要结合相应的 Step 和消息类型，把工具结果配回原来的请求。"},{"label":"4.2 记录模型可见的事实","needle":"4.2 日志必须","topic":"s20","crosswalk":1,"question":"只记最后回复，能否复原模型当时能看到的输入？","detail":"本章分别记录消息、工具调用与请求所依赖的事实。TypeScript 版还跟踪运行时能力变化，Python 版着重模型可见的事件。"},{"label":"4.3 请求头给重建过程划出当时的边界","needle":"4.3 请求头给重建过程划出当时的边界","topic":"s01","crosswalk":2,"question":"事后新增的工具会不会进入已经发出去的模型请求？","detail":"重建按 stepId 找到 request/header，依据该边界前已发生的事件重建消息，同时采用当时的输入投影配置。"},{"label":"4.4 从同一日志派生视图","needle":"复用同一份事实","topic":"s20","crosswalk":null,"question":"请求面板和执行轨迹能否独立手写两份顺序？","detail":"本章让请求视图和 Trace 从同一批有序事件派生。读者可对齐同一次工具往返。这个教学 SessionLog 的跨进程持久性需要另外实现。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-4 .evidence-block[data-evidence-cue]"},{"id":"chapter-5","title":"运行时自进化","subtitle":"编写并运行新的 Cordis 插件","path":"/dsh-course/?locale=zh#chapter-5","online":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-5","topics":["s02"],"points":[{"label":"5.1 先确认缺少什么，再决定补什么","needle":"5.1 先确认缺少什么，再决定补什么","topic":"s02","crosswalk":1,"question":"模型想数词时怎样确认 word_count 当下可用？","detail":"检查运行时当前登记的能力。模型输出一个工具名不会自动生成工具，只有成功挂载后的注册结果才能被后续步骤选用。"},{"label":"5.2 定义代码和挂载能力是两个时刻","needle":"5.2 定义代码和挂载能力是两个时刻","topic":"s02","crosswalk":1,"question":"已经保存了插件定义，为什么当前工具池仍可能看不到新工具？","detail":"对照 cordis_define 和 cordis_run。前者保存定义，后者取得定义并挂载插件，使 word_count 出现在当前 Context。"},{"label":"5.3 结果验证和释放让变更形成闭环","needle":"5.3 结果验证和释放让变更形成闭环","topic":"s02","crosswalk":null,"question":"怎样分别证明新工具曾经可用、停止后又从工具池移除？","detail":"用实际工具调用检验计数结果，再比较停止或删除定义后的可见能力。本章改变运行时插件集合，不涉及参数训练。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-5 .evidence-block[data-evidence-cue]"},{"id":"chapter-6","title":"长程任务续行","subtitle":"用 Goal 与 Round 推进长程任务","path":"/dsh-course/?locale=zh#chapter-6","online":"https://dsh-from-scratch.pages.dev/?locale=zh#chapter-6","topics":["s12","s01","s20"],"points":[{"label":"6.1 Goal 需要保存能跨轮检查的状态","needle":"6.1 Goal 需要保存能跨轮检查的状态","topic":"s12","crosswalk":null,"question":"一次 Turn 结束后，哪里还能看到整个目标和已推进的轮数？","detail":"Goal 记录目标、当前状态、轮数与原因；轮次事实写进会话日志。它可以与任务状态字段并排阅读，但不表示本章实现了任务依赖图。"},{"label":"6.2 下一轮仍然调用普通 Agent Loop","needle":"6.2 下一轮仍然调用普通 Agent Loop","topic":"s01","crosswalk":1,"question":"由谁启动下一轮，哪一层仍负责单次模型与工具往返？","detail":"外层 LongTaskRunner 检查状态和轮数，再调用 runRound。每个 Round 仍使用普通的 Agent Turn，Step 中的工具反馈规则未变。"},{"label":"6.3 续行要依据可观察的结果","needle":"6.3 续行要依据可观察的结果","topic":"s20","crosswalk":4,"question":"模型本轮结束时，还有什么信号足以让长程任务继续或停下？","detail":"已完成、受阻、没有进展以及达到轮数上限各自有出口；需要区分当前 Turn 的回答和整个 Goal 的完成状态。"},{"label":"6.4 六章放回同一条 DSH 运行时主线","needle":"6.4 六章放回同一条 DSH 运行时主线","topic":"s20","crosswalk":null,"question":"把插件、日志和跨轮状态放回一起后，哪些阶段仍能单独复核？","detail":"从一次模型输入沿工具执行查到 Session Log，再看这些事实怎样进入后续 Round。每个视图都有自己的观察对象和停止条件。"}],"practiceLabel":"本课实验","practiceSelector":"#chapter-6 .evidence-block[data-evidence-cue]"}],"revision":"bc4e47f5024f1f7bc6d8b6ac88ce44fa6e4249af","mount":"/dsh-course/"},"agentscope":{"id":"agentscope","name":"AgentScope","title":"AgentScope 2 nt","title":"消息与事件","heading":"消息与事件","group":"核心模块","description":"智能体通信，与前端流式数据传输","path":"/agentscope-course/building-blocks/message-and-event/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/message-and-event","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/message-and-event.mdx","topics":["s01"],"points":[{"label":"从事件流重建消息","needle":"从事件流重建消息","topic":"s01","crosswalk":2,"question":"上层如何把一串增量事件还原成完整回复？","detail":"每个事件通过 append_event 追加到消息对象。工具请求和结果的配对还需要查看对应内容块与事件携带的标识。"}],"slug":"building-blocks/message-and-event"},{"id":"building-blocks-agent-overview","title":"智能体 · 概述","heading":"概述","group":"核心模块 / 智能体","description":"AgentScope 的核心抽象：无状态的推理-行动循环引擎","path":"/agentscope-course/building-blocks/agent/overview/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/overview","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/agent/overview.mdx","topics":["s01"],"points":[{"label":"主循环","needle":"主循环","topic":"s01","crosswalk":1,"question":"什么时候推理、执行工具、暂停或结束？","detail":"主循环图把等待外部事件单列为出口。阅读图中各条边，可以区分等待确认和已经生成最终消息。"}],"slug":"building-blocks/agent/overview"},{"id":"building-blocks-agent-configure-agent","title":"配置智能体","heading":"配置智能体","group":"核心模块 / 智能体","description":"用模型、工具与配置对象组装一个智能体","path":"/agentscope-course/building-blocks/agent/configure-agent/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/configure-agent","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/agent/configure-agent.mdx","topics":["s10"],"points":[{"label":"参数说明","needle":"参数说明","topic":"s10","crosswalk":1,"question":"哪些能力在构造 Agent 时注入？","detail":"沿参数表检查 system_prompt、model、toolkit 和各配置对象；再到上下文一节查看它们如何参与单次请求。"}],"slug":"building-blocks/agent/configure-agent"},{"id":"building-blocks-agent-run-agent","title":"运行智能体","heading":"运行智能体","group":"核心模块 / 智能体","description":"运行智能体，处理它的回复、上下文与状态","path":"/agentscope-course/building-blocks/agent/run-agent/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/run-agent","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/agent/run-agent.mdx","topics":["s01","s12"],"points":[{"label":"观察消息","needle":"观察消息","topic":"s01","crosswalk":2,"question":"只把信息加入上下文时会触发一次模型调用吗？","detail":"比较 observe 与 reply。前者更新可供后续推理读取的上下文，后者才驱动本轮回复。"},{"label":"持久化状态","needle":"持久化状态","topic":"s12","crosswalk":1,"question":"进程外保存的是什么，恢复时又装回哪里？","detail":"对照本节导出与装载状态的示例。任务信息能否跨运行保留，还取决于应用是否保存并重新装载这份状态。"}],"slug":"building-blocks/agent/run-agent"},{"id":"building-blocks-agent-interrupt-agent","title":"中断智能体","heading":"中断智能体","group":"核心模块 / 智能体","description":"干净地停止运行中或暂停中的智能体，并从一致状态恢复","path":"/agentscope-course/building-blocks/agent/interrupt-agent/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/interrupt-agent","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/agent/interrupt-agent.mdx","topics":["s11"],"points":[{"label":"asyncio.CancelledError","needle":"asyncio.CancelledError","topic":"s11","crosswalk":null,"question":"使用者中断回复后，怎样继续对话？","detail":"运行中的协程可通过取消进入中断分支；下一次输入使用保留下来的上下文。调用者主动取消和模型服务瞬时失败走不同路径。"}],"slug":"building-blocks/agent/interrupt-agent"},{"id":"building-blocks-agent-human-in-the-loop","title":"人机交互","heading":"人机交互","group":"核心模块 / 智能体","description":"暂停以等待用户确认或外部执行，再通过结果事件恢复","path":"/agentscope-course/building-blocks/agent/human-in-the-loop/","online":"https://docs.agentscope.io/zh/versions/2.0.12/building-blocks/agent/human-in-the-loop","source":"https://github.com/agentscope-ai/docs/blob/e0ee835d1aca5d2b840d29bdd2f70770bbef69e8/zh/versions/2.0.12/building-blocks/agent/human-in-the-loop.mdx"   <script>function createPracticePanel(root, data, escape){
  const notes = new Map();
  let displayed = null;
  const storageKey = id => "original.reader.practice.v1:" + id;
  function noteFor(id){
    if(!notes.has(id)){
      let note="";
      try {note=localStorage.getItem(storageKey(id))||"";} catch {}
      notes.set(id,note);
    }
    return notes.get(id);
  }
  function renderBlocks(blocks){
    let html="", list="";
    for(const b of blocks){
      const kind=b.tag==="li"?(b.list==="ul"?"ul":"ol"):"";
      if(kind!==list || (list && b.start!==undefined)){
        if(list)html+=`</${list}>`;
        if(kind)html+=`<${kind}${kind==="ol"&&Number.isInteger(b.start)?` start="${b.start}"`:""}>`;
        list=kind;
      }
      const t=escape(b.text);
      if(kind)html+=`<li>${t}</li>`;
      else if(b.tag==="pre")html+=`<pre tabindex="0"><code>${t}</code></pre>`;
      else if(/^h[2-6]$/.test(b.tag))html+=`<h4>${t}</h4>`;
      else if(b.tag==="blockquote")html+=`<blockquote>${t}</blockquote>`;
      else html+=`<p>${t}</p>`;
    }
    return html+(list?`</${list}>`:"");
  }
  function show(id){
    root.hidden=!id;
    if(!id||id===displayed)return;
    const sections=data.practiceOriginal[id], p=data.practicePrompts[id];
    root.innerHTML=`
      <article class="practice-card" data-original-tasks>
        <h2>原课 · 试一下</h2>
        <button data-practice-original>定位左侧原题 ↗</button>
        <button data-observation-start>跳到免密钥观察 ↓</button>
        <small class="practice-guidance">以下命令用于原课配套工程。浏览器中的观察练习可直接在本页完成。</small>
        ${sections.map(section=>renderBlocks(section.blocks)).join("")}
      </article>
      <article class="practice-card observation" data-observation>
        <h2>配套观察练习</h2><p class="practice-question">${escape(p.question)}</p>
        <p>${escape(p.action)}</p>
        <button data-practice-observe>去原页观察 ↗</button>
        <label class="note-label" for="practice-note">我的预测 / 观察记录</label>
        <textarea id="practice-note" rows="3" placeholder="先写下预测，再记下你看到的字段或步骤。"></textarea>
        <small class="note-status" aria-live="polite"></small>
        <details id="practice-expected"><summary>核对参考现象</summary><p>${escape(p.expect)}</p></details>
        <button data-practice-compare>回到本题的框架对照 →</button>
      </article>
      <div id="practice-status" role="status"></div>`;
    displayed=id;
    root.querySelector("#practice-note").value=noteFor(id);
  }
  root.addEventListener("input",e=>{
    if(e.target.id!=="practice-note"||!displayed)return;
    const value=e.target.value;
    notes.set(displayed,value);
    const feedback=root.querySelector(".note-status");
    try {
      if(value)localStorage.setItem(storageKey(displayed),value);
      else localStorage.removeItem(storageKey(displayed));
      feedback.textContent=value?"已保存在本浏览器":"记录已清空";
    } catch {feedback.textContent="记录暂存在当前页面";}
  });
  root.addEventListener("click",e=>{
    if(e.target.closest("[data-observation-start]")){
      root.querySelector("[data-observation]").scrollIntoView({block:"start"});
      root.querySelector("[data-practice-observe]").focus({preventScroll:true});
    }
  });
  return show;
}

</script>
  <script>function bindStudyLinks(container){
  let editor="vscode";
  try {editor=localStorage.getItem("reader.sourceEditor")==="cursor"?"cursor":"vscode";}catch{}
  const selector=container.querySelector("[data-study-editor]");
  if(selector){
    selector.value=editor;
    selector.onchange=()=>{
      try{localStorage.setItem("reader.sourceEditor",selector.value);}catch{}
      bindStudyLinks(container);
    };
  }
  const links=[...container.querySelectorAll("[data-study-path]")];
  if(!links.length)return;
  if(!["127.0.0.1","localhost","[::1]"].includes(location.hostname))return;
  const roots=bindStudyLinks.roots ||= fetch("/__study_local__/editors.json").then(r=>r.ok?r.json():{}).catch(()=>({}));
  roots.then(map=>{
    const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
    for(const link of links){
      const ref=link.dataset.studyPath;
      const key=keys.find(k=>ref.startsWith(k+"/"));
      if(!key||!map[key]){link.removeAttribute("href");link.title=ref+"（本机未安装此资料）";continue;}
      const path=map[key]+ref.slice(key.length);
      const uriPath=path.split("/").map((part,i)=>i===0&&/^[a-z]:$/i.test(part)?part:encodeURIComponent(part)).join("/");
      link.href=editor+"://file/"+uriPath.replace(/^\/+/,"")+":"+Number(link.dataset.line||1);
      link.title=path+":"+Number(link.dataset.line||1);
    }
  });
}
if(document.querySelector('main [data-study-path]'))bindStudyLinks(document);

</script>
  <script>function mountCourseSwitcher(data, initial, escape){
  const names={claude:"Learn Claude Code",hermes:"Hermes",dsh:"dsh",agentscope:"AgentScope"};
  const $=s=>document.querySelector(s);
  const valid=id=>Object.hasOwn(names,id);
  const storeKey="harness.reader.courses.v1.";
  function recall(key){try{return JSON.parse(localStorage.getItem(storeKey+key));}catch{return null;}}
  function save(key,value){try{localStorage.setItem(storeKey+key,JSON.stringify(value));}catch{}}
  const primary=valid(initial.get("primary"))?initial.get("primary"):
    initial.size===0 && valid(recall("last"))?recall("last"):"claude";
  const catalog=data.courses[primary];
  const others=Object.keys(names).filter(id=>id!==primary);
  const mainSelector=$("#primary-course");mainSelector.value=primary;
  const iframe=$("#original-frame");
  const mobile=()=>matchMedia("(max-width:850px)").matches;
  function urlFor(dest,params){
    const p=new URLSearchParams(params);p.set("primary",dest);
    if(dest==="claude")p.set("mode","original");
    return "?"+p.toString();
  }
  function resume(dest){
    const saved=recall("url."+dest);
    if(typeof saved==="string"&&saved.startsWith("?")){
      const p=new URLSearchParams(saved);
      p.set("resume","1");
