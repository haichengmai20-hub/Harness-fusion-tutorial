<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#302044">
  <title>Harness 研习室</title>
  <style>:root {
  --ink:#262333; --muted:#625e70; --accent:#633bc1; --line:#e3dfeb;
  --pale:#f2edfc; --paper:#fff; --canvas:#fbfafe; --header:62px;
  font-family:Inter,"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  color:var(--ink); background:var(--canvas); font-size:15px;
}
* {box-sizing:border-box}
body {margin:0}
button,a {touch-action:manipulation}
button,select {font:inherit}
button {color:inherit;cursor:pointer}
button:disabled {opacity:.45;cursor:default}
a {color:var(--accent);text-underline-offset:.2em}
button:focus-visible,a:focus-visible,summary:focus-visible,g:focus-visible,pre:focus-visible {outline:3px solid #a179ed;outline-offset:3px}
button {background:none;border:0}
button svg,a svg,h2 svg,.code-head svg {vertical-align:middle;flex:none}
.sr,.skip:not(:focus) {width:1px;height:1px;overflow:hidden;position:absolute;clip-path:inset(50%)}
.skip:focus {position:fixed;z-index:20;top:5px;left:10px;background:white;padding:12px}
.top {position:sticky;top:0;z-index:5;display:flex;height:var(--header);align-items:center;border-bottom:1px solid var(--line);background:#fffffffa}
.brand {padding:0 22px;display:flex;align-items:center;gap:10px;width:254px;flex:none;height:100%;color:var(--ink);text-decoration:none;font-size:19px;font-weight:700;letter-spacing:-.6px;border-right:1px solid var(--line)}
.brand svg {width:31px;height:31px}
.brand b {font-size:16px;font-weight:650}
.top-inner {display:flex;justify-content:space-between;align-items:center;padding:0 clamp(24px,4.5vw,76px);width:100%;gap:10px}
.crumb {color:var(--muted);font-size:13px}
.crumb span {padding:0 9px;color:#aaa1ba}
.crumb b {font:600 12px Consolas,monospace;color:#503c71}
#reader-back {margin-left:auto;font-size:12px;white-space:nowrap}
.offline {display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.offline i,.chapter-kicker i,.diagram-head span i {display:inline-block;width:7px;height:7px;border-radius:50%;background:#41896e}
#menu {display:none}
.layout {display:grid;grid-template-columns:254px minmax(0,1fr)}
#sidebar {align-self:start;position:sticky;top:var(--header);height:calc(100dvh - var(--header));display:flex;flex-direction:column;border-right:1px solid var(--line);background:#f6f5f9;z-index:4}
.side-heading {padding:26px 19px 14px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650}
.side-heading svg {color:var(--accent)}
.side-heading span {margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
#sidebar nav {overflow:auto;padding:0 10px 16px;scrollbar-width:thin;scrollbar-color:#d4ccdf transparent}
.side-group {margin:18px 10px 6px;font-size:11px;color:#777080;font-weight:650;letter-spacing:.09em}
.chapter {display:flex;align-items:center;gap:9px;padding:8px 11px;min-height:34px;border-radius:6px;color:#514c5e;text-decoration:none;font-size:13px;line-height:1.4}
.chapter:hover,.chapter:focus-visible {background:#eeeaf5}
.chapter.active {background:#e9e0fa;color:#553497;font-weight:650}
.chap-no,.mono,.chapter-kicker,.node-code,.code-head small,.callid,.timeline small,code,pre {font-family:"IBM Plex Mono",Consolas,"Liberation Mono","Microsoft YaHei UI",monospace}
.chap-no {font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.pass {font-style:normal;color:#2a806e;margin-left:auto}
.progress {margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);font-size:12px;background:#f6f5f9}
.progress div {display:flex;justify-content:space-between}.progress b {font-family:Consolas,monospace}
.progress small {color:var(--muted)}
progress {width:100%;height:5px;border:0;display:block;border-radius:8px;overflow:hidden;background:#e0dbe8;margin:8px 0}
progress::-webkit-progress-bar {background:#e0dbe8} progress::-webkit-progress-value {background:#7b55c2}
main {width:100%;max-width:1230px;margin:0 auto;padding:34px clamp(24px,4.5vw,76px) 50px;outline:none}
.lesson-heading {position:relative}
.chapter-kicker {display:flex;gap:9px;align-items:center;color:#6d499d;font-weight:650;font-size:12px}
.chapter-kicker i {border-radius:2px;width:8px;height:8px;background:#8962cd;transform:rotate(45deg)}
.chapter-kicker span {color:#82798d;font-weight:400}
h1,h2,h3,h4,p {margin:0}
h1 {font-size:clamp(36px,4.4vw,64px);line-height:1.06;font-weight:675;letter-spacing:-.055em;margin:12px 0 6px}
.subtitle {color:#51445f;font-size:18px;font-weight:550}
.lesson-heading p {max-width:81ch;color:var(--muted);margin:11px 0 20px;line-height:1.75}
h2 {font-size:20px;line-height:1.42;letter-spacing:-.025em}
h3 {font-size:17px;line-height:1.5} h4 {font-size:13px;line-height:1.5}
p,dd,li {overflow-wrap:anywhere}
p,dd {line-height:1.8}
.diagram {background:#2e2241;color:#f8f4ff;border-radius:13px;overflow:hidden;border:1px solid #423252;
  background-image:radial-gradient(ellipse at 75% 30%,#5237695e,transparent 60%),radial-gradient(#b99bd329 .85px,transparent .85px);background-size:auto,15px 15px}
.diagram-head,.diagram-foot,.split-head {display:flex;align-items:center;justify-content:space-between;gap:12px}
.diagram-head {margin:0 18px;padding:13px 0 0}
.diagram-head h2 {font-size:14px;display:flex;align-items:center;gap:8px;color:#fff}
.diagram-head span {display:flex;align-items:center;gap:6px;color:#e4d9f2;font-size:11px}
.diagram-head span i {background:#dec4ff}
.map-scroll {overflow-x:auto}
.map-scroll>svg {display:block;width:100%;height:clamp(138px,14.4vw,201px);min-width:485px}
.node {cursor:pointer}.node rect {fill:#3a2e4d;stroke:#836f99;stroke-width:1.4}
.node.hot rect,.node:hover rect,.node:focus-visible rect {stroke:#e4c7ff;stroke-width:2;fill:#5e437a}
.node circle {fill:#b497cd}.node.hot circle {fill:#efceff}
.node.later {opacity:.57}
.predict,.anchor-note {margin:12px 0;font-size:13px}
.predict {display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.predict label {display:flex;align-items:center;gap:5px;cursor:pointer}
.predict input {accent-color:var(--accent)}
.predict span {color:var(--muted)}
.anchor-note {background:var(--pale);border-left:3px solid #ac88d4;padding:9px 12px;border-radius:0 5px 5px 0}
.anchor-note strong {font-size:12px;color:#67458c}
.node-name {fill:#fbf5ff;font:600 16px "Segoe UI","Microsoft YaHei UI",sans-serif}
.node-code,.edge-text {font-size:13px;fill:#d2bfdc}
.diagram-foot {padding:8px 17px;border-top:1px solid #c7a7d62a;background:#281c36a6;font-size:12px}
.diagram-foot span {color:#dfd2ed;line-height:1.5}
.diagram-foot b {color:#907aa2;margin:0 3px}
.diagram-foot button {display:flex;align-items:center;gap:7px;color:#f4e8ff;white-space:nowrap;font-size:12px}
.tabs {display:flex;gap:clamp(10px,2.6vw,38px);border-bottom:1px solid var(--line);margin-top:14px;scroll-margin-top:76px}
.tabs button {display:inline-flex;align-items:center;gap:7px;padding:13px 2px 11px;border-bottom:3px solid transparent;margin-bottom:-1px;color:#6d6777;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button[aria-current=page] {border-color:var(--accent);color:var(--accent)}
.focus-bar {margin-top:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.focus-bar>a {margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.switch {display:inline-flex;align-items:center;padding:3px;border:1px solid var(--line);border-radius:8px;background:#efecf4}
.switch button {padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;color:#696172}
.switch button[aria-pressed=true] {background:white;color:#563393;box-shadow:0 1px 3px #26163b1f}
.content-section,.frame-card,.all-mech,.quiz {margin:26px 0}
.content-section h2,.quiz h2 {margin-bottom:10px}
.lead {font-size:16px;color:#3c3746}.muted,.code-note {color:var(--muted)}
.io,.state-pair,.compare {display:grid;gap:14px;margin-top:14px}
.io {grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;background:#f2eff7;border:1px solid var(--line);border-radius:8px;padding:13px 17px}
.io label,.facts dt {font-size:12px;font-weight:700;color:#715a91}.io p {font-size:14px}
.io svg {color:#846c9f}.walk {padding:0;list-style:none;counter-reset:steps;margin:10px 0 16px}
.walk li {position:relative;padding:8px 0 8px 36px;line-height:1.8;counter-increment:steps}
.walk li::before {content:counter(steps,decimal-leading-zero);position:absolute;left:0;top:12px;font:12px Consolas,monospace;color:#7956a9}
.action,.nav-link {display:inline-flex;gap:8px;align-items:center;border-radius:7px;font-weight:600;font-size:13px;text-decoration:none}
.action {background:var(--accent);color:white;padding:9px 14px}.action:hover {background:#512caa}
.frame-card,.quiz {border:1px solid var(--line);border-radius:10px;background:white;overflow:hidden;scroll-margin-top:80px}
.frame-card>.split-head {border-bottom:1px solid var(--line);padding:13px 18px;background:#f5f2f9}
.frame-card h2 {font-size:15px;display:flex;align-items:center;gap:9px}
.frame-body,.quiz {padding:16px 18px}
.evidence {display:flex;align-items:center;gap:8px;font-size:12px;color:#675776;margin-bottom:7px}
.evidence span,.mode {background:var(--pale);border-radius:5px;padding:3px 7px;color:#664b84;font-size:12px}
.frame-body h3 {margin-bottom:6px}
.facts {margin:13px 0}
.facts>div {display:grid;grid-template-columns:68px 1fr;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid #ece9f1}
.facts dd {margin:0;font-size:14px}
.source-link,.text-action {display:inline-flex;gap:6px;align-items:baseline;font-size:12px;color:var(--accent);overflow-wrap:anywhere;text-decoration:none}
.source-link:hover,.text-action:hover,.focus-bar a:hover {text-decoration:underline}
.all-mech,details {border-top:1px solid var(--line);padding:12px 0}
summary {cursor:pointer;font-weight:600}
.all-mech ol {list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.all-mech li {display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.all-mech small,.future a {color:var(--muted)}
.sim-controls,.play-controls,.code-head,.code-head span {display:flex;align-items:center;gap:8px}
.sim-controls {margin:14px 0;justify-content:space-between;flex-wrap:wrap}
.play-controls {gap:5px}
.play-controls button:not(.action) {background:white;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
.trace-grid {display:grid;grid-template-columns:minmax(166px,32%) 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:white}
.timeline {max-height:350px;overflow:auto;position:relative;background:#f6f3f9;padding:6px;border-right:1px solid var(--line);scrollbar-width:thin}
.timeline button {width:100%;display:flex;text-align:left;gap:9px;padding:8px 7px;border-radius:5px;line-height:1.5;font-size:13px}
.timeline button>span {font:12px Consolas,monospace;padding-top:3px;color:#69567d}
.timeline button[aria-current=step] {background:#e8ddfa;color:#4c2c87}
.timeline small {display:block;overflow-wrap:anywhere;color:#6e6478;font-size:10px}
.event {padding:15px;min-width:0}
.event h3 {margin:3px 0}.event h4 {margin-top:8px}
.mono {font-size:11px;letter-spacing:.06em}
.callid {margin-top:6px;color:#785995;font-size:12px;word-break:break-all}
.state-json {max-height:225px;overflow:auto;border-radius:6px;border:1px solid var(--line);padding:9px;background:#f8f7fa;color:#45394f;font-size:12px;line-height:1.55;tab-size:4}
.state-pair,.compare {grid-template-columns:repeat(2,minmax(0,1fr))}
.state-pair h3 {font-size:14px}.state-pair+.details {margin-top:12px}
.code-head {justify-content:space-between;border:1px solid #3e3449;background:#342c40;color:#e6dceb;border-radius:8px 8px 0 0;padding:9px 13px;margin-top:12px;font-size:12px;overflow-wrap:anywhere}
.code-head small {color:#c8b9d5}
.code {margin:0;background:#241e2e;color:#efeaf5;padding:10px 0;border-radius:0 0 8px 8px;max-height:570px;overflow:auto;line-height:1.65;font-size:12px;tab-size:4}
.code .line {display:block;min-width:max-content;padding-right:14px}
.code .line i {display:inline-block;width:4.3em;padding-right:1em;text-align:right;font-style:normal;color:#a397af;user-select:none}
.line.added {background:#244438;color:#bfeccd}.line.removed {background:#4e2c3c;color:#f2ccdc}
.line.target {background:#694784;color:white;scroll-margin:80px}
.code-note {font-size:12px;margin-top:8px;overflow-wrap:anywhere}
.compare {grid-template-columns:repeat(3,minmax(0,1fr))}
.compare article {padding:13px;border:1px solid var(--line);border-radius:8px;background:white}
.compare small {color:#785995}.compare p {font-size:13px;margin:6px 0}
.answers {display:grid;gap:7px;margin:12px 0}
.answers button {display:flex;text-align:left;align-items:baseline;gap:9px;padding:8px 10px;line-height:1.6;border:1px solid var(--line);border-radius:6px}
.answers button span {font:12px Consolas,monospace;color:#80619a}
.answers button[aria-pressed=true] {border-color:var(--accent);background:var(--pale)}
.feedback {color:#5e467a;font-size:13px}
footer {border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding-top:17px}
footer>div {display:flex;justify-content:space-between;gap:14px;margin-top:14px}
.nav-link {padding:9px 12px;background:white;border:1px solid var(--line);color:#56446c}.next {margin-left:auto}
@media(min-width:1600px){.layout {grid-template-columns:280px minmax(0,1fr)}.brand {width:280px}}
@media(max-width:1050px){.brand {width:217px}.layout {grid-template-columns:217px minmax(0,1fr)} main {padding:25px 25px 36px}.top-inner {padding:0 25px}.compare {grid-template-columns:1fr}.diagram-foot span {max-width:78%}}
@media(max-width:760px){
  :root {--header:53px}.layout {display:block}.brand {width:auto;border:0;padding:0 12px;font-size:16px}.brand b {font-size:14px}.brand svg {width:26px;height:26px}
  .top-inner {padding:0 13px 0 0;justify-content:flex-end}.crumb {display:none}#menu {display:block;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:5px 7px}
  #sidebar {display:none;position:fixed;top:var(--header);left:0;width:min(300px,86vw);box-shadow:8px 8px 25px #261b401c}#sidebar.open {display:flex}
  main {padding:23px 16px 32px}.lesson-heading p {font-size:14px}.map-scroll>svg {height:145px}
  .diagram-head {margin:0 12px}.diagram-foot {padding:7px 10px}.diagram-foot span {max-width:69%}.tabs {gap:0;justify-content:space-between}
  .tabs button {font-size:13px;gap:5px}.focus-bar {gap:6px}.focus-bar>a {max-width:100%;margin-left:0}
  .trace-grid {grid-template-columns:1fr}.timeline {max-height:155px;border-right:0;border-bottom:1px solid var(--line)}
  .state-pair,.all-mech ol {grid-template-columns:1fr}
  .split-head {align-items:flex-start;flex-wrap:wrap}
  .io {grid-template-columns:1fr;gap:5px}.io>svg {transform:rotate(90deg)}
  .facts>div {grid-template-columns:56px 1fr;gap:5px}
  .offline {font-size:11px}.progress {padding:9px 16px}.frame-body,.quiz {padding:13px}
  .chapter-kicker {font-size:11px}.nav-link {font-size:12px}
}
@media(max-width:600px){.map-scroll>svg {min-width:0;height:auto;max-height:280px;margin:7px 0}.diagram-head {padding-top:10px}}
@media(prefers-reduced-motion:reduce){* {scroll-behavior:auto!important}}
</style>
</head>

  <script id="packed" type="application/json">{"chapters":[{"id":"s01","title":"Agent Loop","zh":"模型与工具的往返","group":"循环与工具","previous":"你手里只有一条用户消息和一份有缺陷的 cart.py。用户报告每件 350 分，买两件却只收了 350 分。","problem":"程序能调用模型一次。如果模型只回复「应该是数量没乘上」，谁去查看现场，谁把结果告诉它？","mechanism":"Harness 是驱动模型做事的程序。每轮把当前消息交给模型，读出它要调用的工具或给用户的答复。遇到工具请求，程序执行工具、追加结果，再发起一轮模型请求。","input":"用户任务、固定的购物车快照，以及当前轮可见的消息。","output":"模型在一轮工具往返后可报告复现结果。本章的正常路径会测出错误仍在，修复要留给后续章节。","walkthrough":["先手算预期。350 × 2 = 700，程序给出 350，相差 350。只有一件商品的用例恰好算对，无法揭示这个错误。","单步走到 check_cart 请求。此时模型只是请程序检查购物车；继续找到工具真正返回的 actual=350 和 expected=700。","再走一步找到工具返回的内容。下一轮能利用这条证据，是因为 Harness 把它放回了消息序列。","走到最终回复，判断这个回合完成了什么。看见 350 与 700 的差异，足以报告错误已复现，尚需修改和新的断言结果才能交付修复。"],"failure":"失败路径里模型跳过检查就声称完成。可以核对消息序列，并指出它缺少哪一条能够支持结论的工具结果。","question":"模型已给出最终回复，最后一次可见的检查仍显示实际 350、预期 700。此时能确认什么？","options":["购物车已经修好","本次对话结束，检查仍暴露原错误","用户必须开启新会话才能继续检查"],"answer":1,"explanation":"结束由模型返回的动作决定。金额是否正确由同一快照上的断言决定，两者各有自己的证据。","next":"下一章把能调用哪些工具、每个工具接收什么参数，变成程序可检查的合同。","checkpoint":"工具结果进入下一次模型请求"},{"id":"s02","title":"Tool Use","zh":"注册与分发工具","group":"循环与工具","previous":"循环已经会把一个工具的返回值送回模型。","problem":"现在要读 cart.py，也可能需要运行检查。模型发来一组参数时，程序凭什么把它交给正确的函数？","mechanism":"注册表把公开工具名和本地函数对应起来。参数约束（schema）描述工具接受哪些字段。分发器先查名字、检查参数，再把执行结果和原调用 ID 一起送回循环。","input":"工具名、参数、调用 ID，以及运行时已经注册的工具。","output":"与请求 ID 配对的结果，可能是读取到的内容，也可能是查找或校验失败的说明。","walkthrough":["先看 tools-listed，再看 request-built 的 payload.tools：read 的 path 类型是 string。模型实际收到这份清单；对应的 Python 处理函数只保存在本地注册表。","对 cart.py 发起读取，跟踪产生的调用 ID。工具名可以重复出现，调用 ID 标识其中的一次请求。","沿同一个 ID 找回结果。把它与原请求并排，确认结果读的是想查的文件，随后才把内容用于定位 350 的来源。","切到失败路径。call-1 请求未注册的 scan，得到 unknown-tool；call-2 调用 read 却把 path 写成数字 12，得到 invalid-arguments。找到这两条错误分别回到了哪一次模型请求。"],"failure":"名字拼错或参数形状错误，都可能让一个看似合理的请求进不了工具函数。应把错误关联到原请求，模型才知道该改哪一次调用。","question":"同一轮有两次 read，一次读 cart.py，一次读测试。结果都写着 read，怎样可靠地配回请求？","options":["按源文件名的字母顺序","按返回内容的长度","用各自的工具调用 ID"],"answer":2,"explanation":"工具名标识可复用的能力。一对请求和结果共享的调用 ID 才能区分这两次读取，即使结果先后顺序发生变化也能配对。","next":"下一章给能修改购物车的工具加一道执行前检查。","checkpoint":"从工具名和参数找到本地函数"},{"id":"s03","title":"Permission","zh":"写入前的权限决策","group":"循环与工具","previous":"工具分发器已经能找到修改 cart.py 的函数，也能检查参数。","problem":"模型给出了能执行的修复请求。用户选择拒绝时，要怎样证明文件从未被这一次调用改过？","mechanism":"在调用写工具之前作出权限决策。允许时沿原路径分发；拒绝时直接形成带调用 ID 的工具结果，让模型获得决定和原因。","input":"同一次写入请求、目标文件、调用 ID 和本次允许或拒绝的决定。","output":"执行或跳过写入的分支、供下一轮读取的结果，以及能核对的文件状态。","walkthrough":["从同一缺陷快照开始。跟到模型请求写入时，先记下待改文件和当前金额结果。","在允许路径上找到 allowed=true 和工具返回的 changed=true。先预测修复后的金额，再在 outcome-checked 核对购物车函数实际算出 700。","重置后切到拒绝路径。相同的 write_fix 请求得到 permission-denied，executed 为 false，再次调用购物车函数仍得 350。","检查最后一步的 fileBytesChanged。程序重新读取 cart.py，与调用前的字节逐一对比。再回到第二次模型请求，看看模型收到的是哪一条拒绝回执。"],"failure":"写完文件才判断权限会留下副作用，即使最终对话写着「拒绝」。比较执行前后快照，并查工具执行记录，比只看拒绝文案更能发现这个错误。","question":"用户拒绝写 cart.py。哪组观测最能说明执行前权限生效？","options":["同一调用收到拒绝结果，写函数未执行，文件内容与开始时一致","最后一条回复含有「权限」二字","模型换了一种方式解释乘法"],"answer":0,"explanation":"拒绝结果说明调用者获知了决定；写函数没有运行且文件保持原样，则说明决定确实挡在副作用之前。","next":"下一章在工具边界挂上观测逻辑，检查写入前后到底发生了什么。","checkpoint":"权限决定先于写工具副作用"},{"id":"s04","title":"Hooks","zh":"工具前后的扩展点","group":"循环与工具","previous":"写入路径已有权限判断，也能返回工具结果。","problem":"想给工具加观测逻辑。如果直接修改每个工具函数，怎样保证所有工具都在相同的时机记录？","mechanism":"Hook 是运行时留给外部函数的回调位置。把观测逻辑分别挂在工具的执行前和执行后，同一处调度代码便能按约定次序通知它们。","input":"注册在边界上的回调、当前调用的身份和参数，以及执行后才产生的工具结果。","output":"可以在同一调用下对照的回调顺序、工具结果与异常状态。","walkthrough":["找到 write_fix 对应的 hook-before。执行前回调收到工具名、参数和调用 ID；在这里暂停，预测它能否读到本次工具的结果。","继续走过权限判断和写工具，再查看 hook-after。此时回调收到工具结果，其中 changed=true。外层循环要再往后一步，才将结果作为 tool 消息送回模型。","切到失败路径，找到执行前回调抛出的异常，再检查写工具有无执行。正常路径里同一位置接下来的动作可以作为对照。","推演一个后置回调异常。如果文件已经写入，判断是否重试前要先核对文件，避免对同一请求再次执行写入。"],"failure":"记录失败和写入失败可能出现在同一条调用上。若只看最后一条异常而忽略先前的执行顺序，就可能把已经生效的修改再做一次。","question":"对同一次调用，执行前回调、工具本体和执行后回调都跑完。哪一处最早有机会读取工具返回值？","options":["执行前回调刚开始时","工具本体返回后，进入执行后回调时","工具注册时"],"answer":1,"explanation":"请求参数在调用之前已经存在。本次工具返回值只有在本体返回时才出现，随后才能交给执行后回调。","next":"下一章把任务计划放进显式状态，让读者能看见谁声明了进度。","checkpoint":"执行前回调、工具副作用、执行后回调"},{"id":"s05","title":"TodoWrite","zh":"把计划写成可见状态","group":"计划与上下文","previous":"工具调用的先后顺序已经能观察。用户还想知道修复购物车进行到了哪一步。","problem":"一段回复把「修复」「验证」都打了勾，打开购物车仍可能算出 350 分。进度从哪里来？","mechanism":"把工作拆成带状态的待办项，允许更新计划。再把计划、工具动作和业务断言分别检查，才能判断每个勾有多少依据。","input":"计划项、已有状态、一次更新请求，以及实际工具和测试结果。","output":"读者可查的计划状态与金额断言。要让下一轮模型使用计划，还需将这些状态放入请求。","walkthrough":["先写下「定位错误、修正计算、验证两件商品」；计划里的词说明预期工作。","找到状态改为完成的位置，沿记录回查是否真的修改过 cart.py、是否拿到了测试输出。","对照失败路径，算一遍 350 × 2。即使界面把步骤勾完，实际结果仍可能是 350。"],"failure":"失败路径先把三项都记为 done。重算得到 350 后，程序将「修复」「验证」恢复为 pending。沿这两次状态更新就能区分进度声明与实际检查。","question":"计划显示「验证完成」，同一快照上的断言仍得到 350。该怎么处理这项进度？","options":["接受完成标记","只修改预期金额，让断言通过","记录验证失败，重新打开验证项"],"answer":2,"explanation":"计划状态可以人为设定。实际值与预期的差异说明验证目标尚未达到，应保留这一失败证据。","next":"下一章把一个计划项委派给只负责诊断的子 Agent。","checkpoint":"计划更新与业务检查分开记录"},{"id":"s06","title":"Subagent","zh":"限定子任务上下文","group":"计划与上下文","previous":"父 Agent 能保留计划、工具记录和完整对话。","problem":"父 Agent 请另一位助手诊断漏算数量。怎样让它只接触完成诊断所需的材料，最后又让父 Agent 拿到可用的结论？","mechanism":"父 Agent 建一段独立的子任务上下文，明确目标和可读范围。子 Agent 根据收到的材料独立工作，父 Agent 只接收约定的返回内容。","input":"父任务、子任务说明、允许读取的文件与子任务可用的资源。","output":"归属明确的子任务结果，以及父 Agent 获得的诊断或信息缺口。","walkthrough":["父任务保留「修复并说明金额错误」的目标，把「找出 cart.py 中的求和表达式」交给子任务。","展开子任务的输入，看它有没有拿到读取 cart.py 所需的范围。父对话里出现过的文件名不必然会进入子任务。","读回子任务的摘要。循环变量里有 quantity，求和式却只累加 unit_cents。先据此提出漏乘件数的解释，再通过修改和检查验证。"],"failure":"若委派时遗漏文件范围，子任务只能报告材料不足。父 Agent 应补充上下文或调整分工，凭猜测写下漏乘数量缺少依据。","question":"父 Agent 刚读过 cart.py，子任务提示「缺少可读文件」。首先应该检查哪里？","options":["委派时实际传给子任务的上下文和读取范围","父 Agent 的回复是否足够长","先把子任务标为完成"],"answer":0,"explanation":"子任务用自己的上下文工作。父任务读过资料只说明资料曾进入父任务，对子任务是否可见要沿委派边界核对。","next":"下一章让运行时根据任务加载专门知识，进一步控制什么会进入模型输入。","checkpoint":"父任务委派、子任务读取、摘要返回"},{"id":"s07","title":"Skill Loading","zh":"按任务装入技能说明","group":"计划与上下文","previous":"委派时可以控制任务材料。新会话还需要知道这个项目的金额单位和计算约束。","problem":"工具列表已经很长，再把所有编程约定整本放入每轮请求，成本会随材料增长。只把需要的约定传进去，怎样验证？","mechanism":"先列出技能名称和简介。购物车场景给出要加载的名称，运行时按名查找，只有匹配的技能正文才进入本轮输入。","input":"购物车任务、可发现的技能条目与被选中的技能内容。","output":"本轮请求新增的技能正文，或未加载时仍然缺少的约束。","walkthrough":["先找目录里的金额技能，指出这一条目录项透露了什么。","触发加载后再看模型可见的输入，寻找「金额使用整数分」这类具体要求。","切到失败路径。请求的是 currency，目录里登记的是 money；沿找不到条目、没有正文、请求缺约束这三步定位原因。"],"failure":"目录出现技能名，只能说明系统能发现它。若正文没有进入本次请求，模型就不能依靠该正文知道金额约束。","question":"要验证金额技能已经影响了本轮可用信息，最直接的是检查什么？","options":["磁盘上有一份技能文件","发送给模型的输入里出现了加载后的金额约束","模型在回复里使用「技能」一词"],"answer":1,"explanation":"文件存在、目录可见、正文进入请求是三个不同步骤。本题要验证的是最后一步。","next":"下一章研究上下文太长时，刚装入的约束能否被保留下来。","checkpoint":"技能目录命中，正文进入请求"},{"id":"s08","title":"Context Compact","zh":"压缩后还看得见什么","group":"计划与上下文","previous":"金额约束和工具输出会随多轮对话一起进入模型输入。","problem":"长日志被压成「实得 350 分，预期 700 分」之后，模型还能看见用户要求保留哪个函数接口吗？","mechanism":"上下文压缩把长历史整理成较短的可见输入。将要保留的任务约束、关键观察和原始记录分别核对，可以发现摘要遗失了哪条必要信息。","input":"带金额约束和工具结果的原始历史、压缩规则与当前任务。","output":"供下一轮使用的较短上下文，以及仍可回查的原始记录。","walkthrough":["展开执行前的消息，记下用户要求保留整数分和 total_cents 接口。再看八次检查中件数为 2 的实际值与预期值。","停在 context-compacted，仅根据执行后的 messages 回答两个问题：两件应收多少？补丁必须保留哪个函数名？","切到失败路径。摘要仍写着 350 分和 700 分，total_cents 却只在原始消息里。比较 originalIntact 和 constraintVisible，就能指出哪一步丢了接口约束。"],"failure":"保留原文能支持事后调查。下一轮只消费压缩后的信息时，原始档案中仍有的约束也可能对它不可见。","question":"失败摘要仍包含金额，却省掉了原始消息里的 total_cents。怎样让下一轮重新看到接口要求？","options":["只要原始档案保存成功就可以继续","从金额 350 和 700 推出函数名","让运行时回查原始约束，并把接口要求放回请求"],"answer":2,"explanation":"原始记录、用于压缩的摘要、发给模型的请求分别服务于追溯、缩短内容和推理。信息能否被模型使用取决于最后一层。","next":"下一章把时间拉到新会话，检查哪些信息能跨过会话边界。","checkpoint":"原始记录生成较短可见上下文"},{"id":"s09","title":"Memory","zh":"新会话如何记起项目偏好","group":"计划与上下文","previous":"上章发现一条约束在原始记录里仍可回查，下一轮可见的摘要却已经漏掉了它。","problem":"关闭对话再开始一次购物车修复。怎样判断项目偏好真正来自跨会话记忆，而非上一段聊天仍在输入里？","mechanism":"把偏好写入独立存储。会话 B 以空消息列表开始，启动时读回偏好，分别呈现 messages 与 recalled。要进一步验证模型真的使用了偏好，还要查看后续请求。","input":"旧会话中的项目偏好、独立存储和新会话的召回条件。","output":"新会话中实际召回的记录，或者查询为空的结果。","walkthrough":["让会话 A 记下「回归测试名用英文」。正常场景还会把这条偏好写入 preferences.json。","展开会话 B 的状态，确认 messages 为空，再看 recalled 中的 testNames 是否为 English。","沿失败路径只保留上一段消息。比较新会话和存储里的内容，可以解释为什么召回为空。"],"failure":"复用原会话也能让模型复述偏好，无法用来验证跨会话记忆。必须让旧消息退出新会话的输入，再检查召回过程。","question":"哪种对照最能验证这条偏好来自跨会话存储？","options":["新会话都从空历史开始，只改变是否将偏好写入独立存储，再比较召回","在原来的对话里连续问两次","把偏好直接放进第二次问题"],"answer":0,"explanation":"消除旧消息和新问题里的提示，才能把两次观察的差异定位到存储与召回路径。","next":"下一章在真正发起模型调用之前，把运行时掌握的不同信息拼入请求。","checkpoint":"结束旧会话，存储信息在新会话召回"},{"id":"s10","title":"System Prompt","zh":"构造本轮系统提示","group":"计划与上下文","previous":"模型可用的信息已经分散在配置、工具注册、技能和可召回的记录里。","problem":"项目明明写了金额单位，但模型发出的修复建议看起来按元计算。应从哪里判断是配置丢了，还是请求组装时没有带上？","mechanism":"系统提示词记录运行时给模型的高层约束。本章构造的请求将项目规则和预算放入 system，将用户问题放入 messages，并在 tools 单列可用工具名。","input":"项目金额约束、当前工具、预算和本轮任务。","output":"实际将交给教学模型的请求，其中可以逐项检查运行时选入的约束。","walkthrough":["先在配置或已加载资料中找到金额单位，记录它来自哪里。","在 request-built 暂停。system 段包含项目规则与每轮最多一次写入的预算，tools 另列 read、write_fix、check_cart，messages 保留用户问题。","切到缺约束路径。用户消息依然含有「350 分」，但 system 字段丢失了 README 里的接口与单位规则。分别比较这两个字段，才能找到漏掉的部分。"],"failure":"只读提示词模板可能误判。一个模板正确的项目，仍可能在渲染或拼装本轮请求时漏掉动态信息。","question":"README 要求返回整数分，失败场景的 system 字段却漏掉了这条规则。优先检查哪里？","options":["购物车乘法的执行速度","从配置生成本轮请求的组装逻辑","训练模型的参数量"],"answer":1,"explanation":"上游材料还在、送给模型的输入发生缺失，两个观测把故障范围缩小到了请求组装过程。","next":"下一章让系统在收到不同错误时选择不同的恢复方式。","checkpoint":"请求发送前拼入当前规则与能力"},{"id":"s11","title":"Error Recovery","zh":"按副作用决定重试","group":"计划与上下文","previous":"正常路径能够组织请求、选择工具并拿到结果。","problem":"读文件超时可以再读一次。若写入后只是回执丢了，再把写请求执行一遍会发生什么？","mechanism":"错误恢复先判断调用走到了哪一步、是否已经产生副作用，再选择安全重试、回读核验、报告缺口或终止。重试需要有次数或时间上限。","input":"失败阶段、工具是否写入、已有调用记录与剩余预算。","output":"重试的一次新尝试、核验结果，或附有原因的停止。","walkthrough":["在只读步骤注入超时。重读可以取得 cart.py，文件内容本身不会因重复读取而改变。","在写入完成后丢掉回执。此时「没有收到成功消息」和「文件没有变化」是两个不同判断。","读取文件并跑两件商品的用例。先确定当前是 350 还是 700，再决定需不需要补写。"],"failure":"按异常类型一律重试会把丢失回执当成工具从未执行。对于非幂等操作，即重复一次可能多产生一次副作用的操作，这会直接改变结果。","question":"写工具已落盘，发送回执时超时。下一步优先做什么？","options":["立即重复整个写操作","认为任务已失败并抹掉之前所有记录","核对现在的文件和检查结果，再决定是否补做"],"answer":2,"explanation":"超时说明调用者没拿到回执。读取当前状态可以区分「已经完成」与「尚未完成」，随后才有依据重试。","next":"下一章把恢复范围从一次工具调用扩展到有依赖关系的任务。","checkpoint":"错误发生点决定重试或回读"},{"id":"s12","title":"Task System","zh":"用依赖决定可领取工作","group":"任务与协作","previous":"单次工具调用遇错已经有恢复策略，计划也能显示进度。","problem":"任务进行一半中断。恢复后，调度器怎么知道「验证修复」是否已经可以领取，而不用重新读完整段聊天？","mechanism":"把任务状态和前置依赖存下来。调度器重新载入后，根据前置任务是否完成计算当前可领取的工作。","input":"持久任务记录、修复与验证之间的依赖、最近写入的状态。","output":"新计算的就绪任务集合、被阻挡的任务及其原因。","walkthrough":["让 verify 依赖 fix。在缺陷快照下询问调度器是否可领取这两项任务。","完成 fix 并保存状态，再重新载入记录；查看 verify 的就绪条件哪一项变了。","尝试提前领取 verify。任务表里能看见它，只说明它已被创建，领取仍受前置条件限制。"],"failure":"如果只从上一轮的聊天摘要恢复，可能遗漏 fix 已完成或仍未完成的事实。检查持久记录和依赖计算能定位为何阻挡或错误放行。","question":"重新载入后 fix 仍未完成，verify 正依赖它。此时哪件事成立？","options":["verify 已存在，但还不能领取","verify 从任务表中永久删除","verify 应立即将自己记为通过"],"answer":0,"explanation":"创建任务、前置条件满足、执行验证、验证通过分别是不同状态。恢复后要根据持久记录重新推导就绪性。","next":"下一章允许已经领取的慢任务脱离当前回复继续执行。","checkpoint":"读取持久依赖后计算就绪任务"},{"id":"s13","title":"Background Tasks","zh":"先提交，稍后读结果","group":"任务与协作","previous":"调度器知道验证任务何时具备启动条件。","problem":"检查购物车可能要等一段时间。若主循环提交后立刻回复「通过」，它到底看到了运行结果，还是只拿到了提交回执？","mechanism":"后台任务把提交和完成拆成两个时刻。先返回可追踪的任务标识，主循环继续其他工作，等结果可用时再按标识取回。","input":"验证请求、任务标识，以及后台工作的当前状态。","output":"提交回执、执行状态和最终可以取回的验证结果。","walkthrough":["把购物车检查放到后台，记下提交得到的任务标识。","读失败场景的 job-polled。job-1 仍在 queued，result 为空，主循环此时可以整理修改说明。","切回正常场景。实验器先推进队列，再读取同一任务，输出 700 与通过的断言。这个队列由实验器推进，重置可重复观察两个时机。"],"failure":"提交成功只说明任务已被接收。提前轮询看不到结果可能只是时机太早，判断任务失败还需要明确的终止状态。","question":"后台检查已提交，但第一次读取时仍在运行。此时可以向用户确认什么？","options":["两件商品的回归断言已通过","本次检查已被接受，仍待结果","这次检查已永久失败"],"answer":1,"explanation":"提交回执可以证明被接受，不能推出计算是否完成。用同一标识读到终态和输出，才有条件汇报结果。","next":"下一章将检查的触发者由当前用户动作换成一段可复现的时间规则。","checkpoint":"提交回执与后台完成分两次返回"},{"id":"s14","title":"Cron Scheduler","zh":"用可控时钟触发复查","group":"任务与协作","previous":"验证已经可以作为一个后台任务执行。","problem":"希望定时复查购物车。调度器在同一个应触发时刻被唤醒两次，会发出几个验证任务？","mechanism":"本章只注册一条复查规则。用可控时钟推进时间，把已处理的分钟槽记入 seen，再次收到同一分钟就跳过派发。扩展到多条规则时还要区分规则身份。","input":"调度规则、模拟时钟、当前时间槽和该槽的触发记录。","output":"新建的复查任务，或重复到达同一时间槽时的去重记录。","walkthrough":["先让模拟时钟停在触发点之前，观察是否创建检查。","把时钟推进到 5，出现一次 check@5。查看 jobs 和 seen，它们分别回答派了什么任务、哪个时间槽已经处理。","让同一个时刻再次到达，核对总派发次数。只看时钟跳了几次不能回答创建了几个任务。"],"failure":"相同时间槽重复到达很常见。若仅判断「现在已到时间」而不检查触发记录，两次唤醒会生成两份相同的复查。","question":"同一条规则、同一个应触发时间槽被处理两次。教学调度器应该留下几次实际派发？","options":["零次","两次","一次，重复处理留下去重依据"],"answer":2,"explanation":"时间槽把多次唤醒归到同一次预定执行。下一时间槽仍可正常触发，去重不能把以后所有执行一并屏蔽。","next":"下一章把一次工作交给不同角色协同完成，追踪各自所用的快照。","checkpoint":"时间槽命中并检查是否已派发"},{"id":"s15","title":"Agent Teams","zh":"分工之后如何复核","group":"任务与协作","previous":"任务可以被调度，也可以在后台运行。","problem":"修复者报告 cart.py 已改，复核者却仍测到 350 分。协调者怎样判断是修复本身有错，还是复核者读了旧文件？","mechanism":"给参与者分配明确职责，并记录各自的任务、输入快照和产物。汇总时要把验证结果关联到对应修复版本，才知道两份报告能否比较。","input":"修复任务、复核任务、各角色拿到的文件版本。","output":"按角色和版本归属的修改、验证结果与汇总结论。","walkthrough":["找到 builder 的报告。changed 为真说明写操作改变了 cart.py，金额结果还要看 reviewer 的检查。","把待验版本交给复核者，查看它实际使用哪个快照、期望金额是多少。","把失败场景里 reviewer 的起始副本和正常场景里的修复后副本并排，对照实际 350 与 700。两个报告必须连同 snapshot 一起阅读。"],"failure":"复核者可以认真运行正确用例，却测在旧文件上。汇总者若丢掉快照身份，会把旧版本的失败错误地归到新修改上。","question":"修复者报告文件已修改，复核者却算出 350 分。判断修复是否有效前，最该先核对什么？","options":["各自检查的文件版本和测试输入","谁的总结更详细","谁最后发送消息"],"answer":0,"explanation":"只有同一待验版本和同一输入下的结果才能直接比较。版本不同本身已经足以解释数字差异。","next":"下一章将角色间的回复组织成可关联、可处理重复投递的消息。","checkpoint":"按角色与快照汇总验证结果"},{"id":"s16","title":"Team Protocols","zh":"重复消息只处理一次","group":"任务与协作","previous":"团队成员已经能分工，复核者也能核对文件快照。","problem":"修复者请复核者检查 cart.py，同一个复核请求被投递了两次。接收方怎样避免重复受理？","mechanism":"团队协议约定请求携带消息类型、发送者、接收者和关联任务。接收方先检查消息标识，首次受理后记录它，再次收到同一标识即可识别重发。","input":"修复者 builder 发给 reviewer 的 review-request，消息编号 msg-1，关联任务 cart-fix。","output":"受理或重复投递的决定，以及接收方保留的已收消息编号。","walkthrough":["展开 builder 发给 reviewer 的请求，分别找到消息编号 msg-1 和任务编号 cart-fix。","第一次送达时，接收方记录 msg-1，返回 accepted。此处只证明请求已被受理，验证结果要等以后产生。","重复送达同一请求，看返回值是否变成 duplicate，再数一次 receivedIds 中留下几项。"],"failure":"两次独立的复核请求可以使用相同正文。对照消息编号能区分重发与新请求，再根据任务编号确定该由哪项工作消费。","question":"同一消息 ID 的复核请求重复抵达。什么结果能说明接收方去重有效？","options":["将请求受理两次","第一次受理，重复投递标为 duplicate","永久屏蔽修复者的后续消息"],"answer":1,"explanation":"同一请求可以收到多次。去重后只保留一次受理记录，修复者以后发送新编号的请求仍可正常处理。","next":"下一章让成员自己发现并领取工作，观察竞争同一任务时谁成功。","checkpoint":"消息抵达后按身份去重并归属"},{"id":"s17","title":"Autonomous Agents","zh":"自主发现并认领工作","group":"任务与协作","previous":"成员能接收任务报告，协调方也能计算可执行任务。","problem":"两名空闲成员都看到购物车修复任务 cart-fix 可领取。cart-verify 还依赖它，怎样避免重复领修复或抢先做验证？","mechanism":"成员主动查询就绪工作，并尝试认领。认领时把「仍可领取」的判断和「设置负责人」这次修改绑定在一个不可拆开的操作里。","input":"当前就绪任务、申请认领的成员、任务负责人和状态。","output":"明确的认领成功或失败，及找不到可领取工作时的空闲状态。","walkthrough":["先看 ready-discovered 的前后状态。SQLite 表有 cart-fix 和 cart-verify，后者依赖尚未完成的前者。第一次查询只返回 cart-fix。","在竞争场景中，A 和 B 先后读到同一个候选。A 的条件更新将修复项置为 running 并写入负责人。B 用旧候选提交时再次检查状态、负责人和依赖；查看 won 是否为真。","两次重新查询均为空：修复有人执行，验证尚未就绪。到 worker-stopped 核对 reason=idle-limit 和 allTasksDone=false。空闲次数达到上限只结束本次轮询。"],"failure":"只先读「无人负责」，过一会儿再写自己的名字，会给另一位成员留下竞争窗口。教学轨迹检查的是认领合同，生产中的并发保证还取决于同步或存储实现。","question":"两名成员都看到任务曾经空闲。怎样判断谁取得了执行资格？","options":["两人都会自动取得资格","谁先看到任务列表谁就有资格","以条件认领成功并写入的负责人为准"],"answer":2,"explanation":"发现候选工作与成功取得所有权分两步。认领的返回值和最终负责人共同决定谁可以执行。","next":"即便任务归属清楚，两位成员仍可能改到同一个文件。下一章处理这个冲突。","checkpoint":"在认领时检查状态并设置负责人"},{"id":"s18","title":"Worktree Isolation","zh":"分开工作目录再合并","group":"任务与协作","previous":"工作可以清楚地归属于不同成员，但它们仍可能编辑同一份文件。","problem":"工作副本修了乘法，在它合回前，主目录的 cart.py 多了一行注释。两人改的是不同位置，教学合并器会放行吗？","mechanism":"为每份工作提供独立目录和共同基线。准备合并时比较基线、当前目标与待合入修改，目标已变化时先报告冲突。教学实验用临时目录副本演示边界。","input":"共同起点、各自的工作副本，以及合并时的目标内容。","output":"可安全应用的更新，或保留两侧修改的冲突报告。","walkthrough":["从同一个有缺陷版本准备工作副本，在一个副本修复乘法，观察另一个副本是否随之变化。","目标仍与基线相符时，观察修复怎样合入，再核对金额。","让主目录添加一行注释。教学合并器按整份文件比较基线，连这个不同位置的改动也会触发 conflict；主目录的注释应当保留下来。"],"failure":"独立目录解决编辑时互相覆盖的问题。两个改动最终写回同一位置时仍可能冲突；本章实验覆盖目录副本和基线检查，真实 Git worktree 的分支、索引和合并需要另行验证。","question":"成员在自己的目录里测试通过，合并前目标文件已改变。较稳妥的下一步是什么？","options":["比较基线与两侧修改、处理冲突，再对合并结果运行检查","用测试通过的一侧直接覆盖目标","删除两个工作目录并宣布完成"],"answer":0,"explanation":"副本内通过只支持该副本的行为。合并目标发生变化时，要确定双方修改的关系，并验证最终形成的新版本。","next":"下一章把验收能力接到外部工具接口上，沿同一工具合同追踪请求和返回。","checkpoint":"工作副本并行编辑后检查合并基线"},{"id":"s19","title":"MCP Tools","zh":"发现并调用外部工具","group":"扩展与集成","previous":"工具注册表只能分发已知的本地能力。验证购物车时，也可能需要使用外部服务暴露的检查工具。","problem":"外部服务列出了一个工具。运行时怎样知道该传哪些参数，又怎样把返回的结果送回发起请求的那一轮？","mechanism":"MCP（模型上下文协议）为发现与调用外部工具提供约定。适配层先取得工具定义，再把名称、参数和调用送到服务，最后将结果或错误归回本地循环。","input":"服务公布的工具名和参数约束、实际调用参数、本次请求的标识。","output":"发现的可用能力，以及归属明确的外部成功结果或错误。","walkthrough":["先查看教学服务公布的工具清单，再到第一轮 request-built 看模型实际收到的 cart/cart_check 及参数约束。此时还没有业务结果。","id=1 取得清单；模型调用 call-1 后，适配器用协议 id=2 调用 cart_check。在 rpc-returned 核对响应 ID，继续走到 tool-finished 与下一轮 request-built。模型从 call-1 的工具消息中读出实际 350、预期 700。","切到失败路径。模型请求 missing_cart，协议错误也放回 call-1 对应的工具消息。看最终回复能否指出服务返回的具体错误。此处服务位于同一进程，网络传输和连接协商需另行实验。"],"failure":"工具发现成功只支持「该接口给出了定义」。实际执行还依赖名称、参数和服务端响应，把清单当成功结果会漏掉这些失败点。","question":"服务已列出检查工具。能说明本次调用真正完成的是哪项观测？","options":["清单中含有工具名称","存在与本次调用匹配的响应，并能检查它携带的结果或错误","页面显示服务地址"],"answer":1,"explanation":"发现阶段可以没有任何业务输出。一个与本次调用匹配的响应能说明调用有了结果，但其中仍可能是错误。","next":"最后把工具、权限和后台验证接在一起，按一条完整任务的结果验收。","checkpoint":"先发现工具，再关联调用和响应"},{"id":"s20","title":"Comprehensive Agent","zh":"从复现到验证的完整运行","group":"扩展与集成","previous":"工具、权限、任务、并行修改和结果回收都有了可独立观察的边界。","problem":"用户关心的是两件 350 分的商品是否已经按 700 分收费。怎么沿调用链给出一个站得住的答复？","mechanism":"把已有机制用于同一次修复。模型依次读取源码写入和新增测试的工具回执，然后结束对话。实验器接着运行后台检查和 unittest，汇总读者可以据以报告的验收结果。","input":"含缺陷的起始快照、金额单位约束、授权分支，以及对同一用例的预期值 700。","output":"一条可回查复现依据与写入决定的轨迹。其最后一项给出后台金额、回归用例、计划状态与 completed 判定。","walkthrough":["从 350 × 2 的断言开始，保留修改前实际 350、预期 700 的观察。","沿正常路径追踪写入和测试变更。第二条用例是 2 × 350 + 3 × 20 = 760 分。在最后一步分别核对后台返回 700，以及 unittest 的两个用例都通过。","从同一初始快照切到拒绝路径，找出正常与受阻轨迹第一次不同的决定。判断后续哪些结论还可以成立。","回到用户语言，分别说明问题能否复现、写入是否获准、修复后断言是否通过。若某项没有证据，就报告它停在哪一步。"],"failure":"最终回复和后台任务都能正常结束，但若缺少对修改后版本的断言，仍无法回答是否已修复。先定位最早分叉，再检查它具体破坏了哪项承诺。","question":"哪组证据足以支持「这次修复解决了给定用例」？","options":["出现最终回复并且所有待办打勾","后台任务已提交且模型解释了乘法","同一用例在旧快照得到 350，修改后目标快照返回 700，回归断言通过"],"answer":2,"explanation":"相同输入与预期、明确关联的前后快照、可核对的断言支持给定用例上的修复结论。对其他商品和规则的推广仍需相应测试。","next":"可以回到 s03 对照拒绝分支，再到 s13 检查何时拿到结果，用同一套问题分析自己的 Harness。","checkpoint":"从复现、写入决定一直追到目标版本的检查结果"}],"mappings":{"s01":{"hermes":{"support":"native","evidence":["source-reviewed"],"title":"工具调用决定这一轮往哪走","body":"购物车报错进入一轮会话。模型若请求工具，循环交给工具轮次处理；若返回文本，进入文本收尾。两条路径都可能让用户看到回复，只有测试结果能说明金额是否正确。","entry":"TurnFacadeMixin.run_conversation 转入 conversation_loop.run_conversation，再进入 _run_conversation_turn。","state":"同一轮的消息、API 调用计数和退出原因由轮次状态维护。","checkpoint":"在收到助手消息后检查 tool_calls，再预测下一次模型调用会读到什么。","anchors":{"request-built":"turn_request_assembly.assemble_api_request 构造供 tframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n","diff":"--- s00.py\n+++ s01.py\n@@ -0,0 +1,90 @@\n+# ── s01_loop.py ──\n+\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\n+import inspect\n+import json\n+import runpy\n+import subprocess\n+import sys\n+from copy import deepcopy\n+from pathlib import Path\n+from shutil import copytree\n+\n+CHAPTERS = {}\n+\n+\n+class Lab:\n+    def __init__(self, root, chapter, scenario):\n+        self.root = root\n+        self.repo = root / \"cart_repo\"\n+        self.chapter = chapter\n+        self.scenario = scenario\n+        self.events = []\n+        self.messages = []\n+\n+    def event(self, step, title, before, after, payload=None, call=None, span=None):\n+        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n+        frame = inspect.currentframe().f_back\n+        filename = Path(frame.f_code.co_filename).name\n+        self.events.append(deepcopy({\n+            \"runId\": f\"{self.chapter}-{se 行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    requ ed\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPT 务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n","diff":"--- s05.py\n+++ s06.py\n@@ -250,2 +250,28 @@\n CHAPTERS[5] = demo_todo\n \n+# ── s06_subagent.py ──\n+def inspect_child(lab, assignment, span):\n+    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n+    scope = assignment[\"allowedFiles\"]\n+    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n+    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n+              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n+    if \"cart.py\" not in scope:\n+        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n+    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n+    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n+\n+\n+def demo_child(lab, failed):\n+    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n+    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n+    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n+              {\"assignment\": assignment}, span=\"child-1\")\n+    reply = inspect_child(lab, assignment, \"child-1\")\n+    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n+    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n+              {\"messages\": lab.messages}, reply, span=\"child-1\")\n+\n+\n+CHAPTERS[6] = demo_child\n+\n","path":"runtime/layers/s06_subagent.py"},"s07":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n","diff":"--- s06.py\n+++ s07.py\n@@ -276,2 +276,23 @@\n CHAPTERS[6] = demo_child\n \n+# ── s07_skills.py ──\n+SKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n+\n+\n+def demo_skill(lab, failed):\n+    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n+    model_input = {\"catalog\": catalog}\n+    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n+    name = \"currency\" if failed else \"money\"\n+    before = deepcopy(model_input)\n+    body = SKILLS.get(name)\n+    if body:\n+        model_input[\"loadedText\"] = body\n+    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n+              {\"requested\": name, \"found\": body is not None})\n+    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n+              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n+\n+\n+CHAPTERS[7] = demo_skill\n+\n","path":"runtime/layers/s07_skills.py"},"s08":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n","diff":"--- s07.py\n+++ s08.py\n@@ -297,2 +297,34 @@\n CHAPTERS[7] = demo_skill\n \n+# ── s08_compact.py ──\n+def compact_history(history, keep_constraint):\n+    finding = history[1][\"content\"]\n+    retained = [{\"role\": \"summary\",\n+                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n+    if keep_constraint:\n+        retained.insert(0, history[0])\n+    return retained + [history[-1]]\n+\n+\n+def demo_compact(lab, failed):\n+    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n+    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n+                   for n in range(1, 9)]\n+    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n+               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n+               {\"role\": \"tool\", \"content\": diagnostics},\n+               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n+    ledger = lab.root / \"turns.json\"\n+    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n+    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n+              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n+    visible = compact_history(archive, keep_constraint=not failed)\n+    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n+              {\"messages\": archive}, {\"messages\": visible})\n+    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n+    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n+              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n+\n+\n+CHAPTERS[8] = demo_compact\n+\n","path":"runtime/layers/s08_compact.py"},"s09":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCH
