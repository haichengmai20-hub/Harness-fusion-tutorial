     job = self.jobs[key]\n        if job[\"status\"] == \"queued\":\n            job.update(status=\"finished\", result=check_cart(job[\"repo\"]))\n\n    def poll(self, key):\n        job = self.jobs[key]\n        return {\"id\": key, \"status\": job[\"status\"], \"result\": job.get(\"result\")}\n\n\ndef demo_background(lab, failed):\n    execute_tool(lab, \"write_fix\", {}, \"fix\")\n    queue = CheckQueue()\n    queue.submit(\"job-1\", lab.repo)\n    lab.event(\"job-submitted\", \"立即返回任务 ID，主循环可继续工作\", {}, queue.poll(\"job-1\"))\n    lab.event(\"parent-continued\", \"主循环在结果到达前整理修改说明\",\n              {\"blocked\": False}, {\"note\": \"已把单价乘件数\", \"job\": \"job-1\"})\n    if not failed:\n        queue.advance(\"job-1\")\n    lab.event(\"job-polled\", \"按任务 ID 读取验证结果\", {\"job\": \"job-1\"}, queue.poll(\"job-1\"))\n\n\nCHAPTERS[13] = demo_background\n\n# ── s14_clock.py ──\nclass MinuteClock:\n    def __init__(self):\n        self.emitted = set()\n\n    def tick(self, minute):\n        if minute % 5 or minute in self.emitted:\n            return False\n        self.emitted.add(minute)\n        return True\n\n\ndef demo_clock(lab, failed):\n    clock = MinuteClock()\n    queue = CheckQueue()\n    for minute in ([4, 5, 5] if failed else [4, 5]):\n        before = sorted(clock.emitted)\n        triggered = clock.tick(minute)\n        if triggered:\n            queue.submit(f\"check@{minute}\", lab.repo)\n        lab.event(\"clock-ticked\", f\"时钟走到第 {minute} 分钟\",\n                  {\"seen\": before}, {\"seen\": sorted(clock.emitted), \"triggered\": triggered, \"jobs\": list(queue.jobs)})\n\n\nCHAPTERS[14] = demo_clock\n\n# ── s15_teams.py ──\ndef demo_team(lab, failed):\n    old_snapshot = lab.root / \"review-copy\"\n    copytree(lab.repo, old_snapshot)\n    tasks = {\"fix\": \"builder\", \"verify\": \"reviewer\"}\n    lab.event(\"team-assigned\", \"把修复和独立复核交给两个角色\", {}, {\"owners\": tasks})\n    fix = observed_tool(lab, \"write_fix\", {}, \"builder-write\")\n    lab.event(\"member-reported\", \"修复者提交变更摘要\", {\"role\": \"builder\"}, fix, span=\"builder\")\n    review_repo = old_snapshot if failed else lab.repo\n    verdict = check_cart(review_repo)\n    lab.event(\"member-reported\", \"复核者在自己的输入版本上重算金额\",\n              {\"role\": \"reviewer\", \"snapshot\": \"起始副本\" if failed else \"修复后副本\"},\n              verdict, span=\"reviewer\")\n    lab.event(\"team-collected\", \"负责人同时核对修复结果和复核输入\",\n              {\"owners\": tasks}, {\"write\": fix, \"review\": verdict, \"agreed\": verdict[\"passed\"]})\n\n\nCHAPTERS[15] = demo_team\n\n# ── s16_protocol.py ──\ndef receive_message(inbox, envelope):\n    if envelope[\"id\"] in inbox:\n        return \"duplicate\"\n    if envelope[\"to\"] != \"reviewer\" or envelope[\"type\"] != \"review-request\":\n        return \"unroutable\"\n    inbox[envelope[\"id\"]] = envelope\n    return \"accepted\"\n\n\ndef demo_protocol(lab, failed):\n    inbox = {}\n    message = {\"id\": \"msg-1\", \"taskId\": \"cart-fix\", \"from\": \"builder\",\n               \"to\": \"reviewer\", \"type\": \"review-request\", \"file\": \"cart.py\"}\n    lab.event(\"message-sent\", \"发送有类型和关联 ID 的复核请求\", {}, message, span=\"builder\")\n    for _ in range(2 if failed else 1):\n        before = list(inbox)\n        status = receive_message(inbox, message)\n        lab.event(\"message-received\", \"收件箱检查路由与消息 ID\",\n                  {\"receivedIds\": before}, {\"receivedIds\": list(inbox), \"status\": status},\n                  {\"messageId\": message[\"id\"], \"taskId\": message[\"taskId\"]}, span=\"reviewer\")\n\n\nCHAPTERS[16] = demo_protocol\n\n# ── s17_claim.py ──\nimport sqlite3\nfrom contextlib import closing\n\n\n# 一条任务最多有一个前置项。发现与认领使用同一条就绪条件。\nREADY = \"\"\"status='pending' AND owner IS NULL AND\n           (dependency IS NULL OR EXISTS\n               (SELECT 1 FROM task AS prior WHERE prior.name=t.dependency AND prior.status='done'))\"\"\"\n\n\ndef seed_tasks(database):\n    with closing(sqlite3.connect(database)) as db, db:\n        db.execute(\"CREATE TABLE task(name TEXT PRIMARY KEY, dependency TEXT, status TEXT, owner TEXT)\")\n        db.execute(\"INSERT INTO task VALUES ('cart-fix', NULL, 'pending', NULL)\")\n        db.execute(\"INSERT INTO task VALUES ('cart-verify', 'cart-fix', 'pending', NULL)\")\n\n\ndef discover_tasks(database):\n    with closing(sqlite3.connect(database)) as db:\n        ready = db.execute(\"SELECT name FROM task AS t WHERE \" + READY + \" ORDER BY name\").fetchall()\n        rows = db.execute(\"SELECT name, dependency, status, owner FROM task ORDER BY name\").fetchall()\n    state = {name: {\"dependsOn\": dep, \"status\": status, \"owner\": owner} for name, dep, status, owner in rows}\n    return [name for (name,) in ready], state\n\n\ndef claim_task(database, name, worker):\n    # 重检同一就绪条件：发现之后，依赖或负责人可能已变。\n    with closing(sqlite3.connect(database)) as db, db:\n        changed = db.execute(\"UPDATE task AS t SET owner=?, status='running' WHERE name=? AND \" + READY,\n                             (worker, name)).rowcount\n        current = db.execute(\"SELECT owner FROM task WHERE name=?\", (name,)).fetchone()\n    return changed == 1, current[0] if current else None\n\n\ndef scan_candidates(lab, database, worker):\n    ready, rows = discover_tasks(database)\n    lab.event(\"ready-discovered\", f\"{worker} 从持久任务表查询当前可领取项\",\n              {\"tasks\": rows}, {\"ready\": ready}, {\"worker\": worker})\n    return ready\n\n\ndef try_claim(lab, database, worker, candidate):\n    won, owner = claim_task(database, candidate, worker)\n    lab.event(\"claim-resolved\", f\"工作者 {worker} 条件领取 {candidate}\",\n              {\"candidate\": candidate}, {\"owner\": owner, \"won\": won},\n              {\"worker\": worker, \"task\": candidate})\n\n\ndef demo_claim(lab, failed):\n    database = lab.root / \"claims.db\"\n    seed_tasks(database)\n    workers = [\"A\", \"B\"] if failed else [\"A\"]\n    # 先收集各工作者当时看到的快照，再交错执行；由此稳定重现竞争窗口。\n    snapshots = {worker: scan_candidates(lab, database, worker) for worker in workers}\n    for worker, candidates in snapshots.items():\n        if candidates:\n            try_claim(lab, database, worker, candidates[0])\n\n    # 领用与完成各是一步。本实验保留 owner=A 且修复未完成。\n    idle_limit = 2\n    for attempt in range(1, idle_limit + 1):\n        ready = scan_candidates(lab, database, workers[-1])\n        if ready:\n            try_claim(lab, database, workers[-1], ready[0])\n            return\n        lab.event(\"worker-idle\", \"本轮没有可领取项\", {\"attempt\": attempt},\n                  {\"idleCount\": attempt, \"limit\": idle_limit})\n    _, tasks = discover_tasks(database)\n    lab.event(\"worker-stopped\", \"连续两次空闲，结束本次轮询\", {\"idleCount\": idle_limit},\n              {\"reason\": \"idle-limit\", \"allTasksDone\": all(t[\"status\"] == \"done\" for t in tasks.values())})\n\n\nCHAPTERS[17] = demo_claim\n\n# ── s18_workspace.py ──\ndef merge_file(path, base, incoming):\n    current = path.read_text(encoding=\"utf-8\")\n    if current != base and current != incoming:\n        return \"conflict\"\n    path.write_text(incoming, encoding=\"utf-8\")\n    return \"merged\"\n\n\ndef demo_workspace(lab, failed):\n    # 普通目录副本与单文件基线，演示隔离和冲突，没有创建 Git 分支。\n    scratch = lab.root / \"worker-copy\"\n    copytree(lab.repo, scratch)\n    target = lab.repo / \"cart.py\"\n    base = target.read_text(encoding=\"utf-8\")\n    patch_file = scratch / \"cart.py\"\n    incoming = base.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    patch_file.write_text(incoming, encoding=\"utf-8\")\n    lab.event(\"workspace-isolated\", \"在工作者副本修改后分别执行两个版本\",\n              {\"copies\": [\"cart_repo\", \"worker-copy\"]}, {\"main\": check_cart(lab.repo), \"worker\": check_cart(scratch)})\n    if failed:\n        target.write_text(base + \"\\n# 主目录已收到另一位工作者的改动\\n\", encoding=\"utf-8\")\n    before = target.read_text(encoding=\"utf-8\")\n    status = merge_file(target, base, patch_file.read_text(encoding=\"utf-8\"))\n    lab.event(\"merge-checked\", \"将主目录当前文本与分叉时基线比较\",\n              {\"targetMatchesBase\": before == base},\n              {\"status\": status, \"targetUnchanged\": target.read_text(encoding=\"utf-8\") == before,\n               \"main\": check_cart(lab.repo)})\n\n\nCHAPTERS[18] = demo_workspace\n\n# ── s19_mcp.py ──\ndef fixture_server(lab, request):\n    # 进程内协议子集，只演示 list/call 的请求结果形状。\n    # 省略连接、握手、版本协商、网络传输和实际 MCP SDK。\n    reply = {\"jsonrpc\": \"2.0\", \"id\": request[\"id\"]}\n    if request[\"method\"] == \"tools/list\":\n        reply[\"result\"] = {\"tools\": [{\"name\": \"cart_check\", \"description\": \"重算两件商品\",\n                                      \"inputSchema\": {\"type\": \"object\", \"properties\": {}}}]}\n    elif request[\"method\"] == \"tools/call\" and request[\"params\"][\"name\"] == \"cart_check\":\n        data = check_cart(lab.repo)\n        reply[\"result\"] = {\"content\": [{\"type\": \"text\", \"text\": json.dumps(data)}]}\n    else:\n        reply[\"error\"] = {\"code\": -32602, \"message\": \"该教学服务没有这个工具\"}\n    return reply\n\n\ndef demo_mcp(lab, failed):\n    listing = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\"}\n    catalog = fixture_server(lab, listing)\n    lab.event(\"tools-listed\", \"从本地教学服务发现工具\", {\"request\": listing}, catalog)\n    if catalog[\"id\"] != listing[\"id\"] or \"error\" in catalog:\n        raise RuntimeError(\"工具发现未收到匹配的清单\")\n    exposed = {\"cart/\" + item[\"name\"]: item[\"inputSchema\"] for item in catalog[\"result\"][\"tools\"]}\n    next_rpc_id = 2\n\n    def dispatch(local_name, args, call):\n        nonlocal next_rpc_id\n        rpc = {\"jsonrpc\": \"2.0\", \"id\": next_rpc_id, \"method\": \"tools/call\",\n               \"params\": {\"name\": local_name.removeprefix(\"cart/\"), \"arguments\": args}}\n        next_rpc_id += 1\n        lab.event(\"rpc-requested\", \"把模型调用转成协议请求\",\n                  {\"localTool\": local_name}, {\"request\": rpc}, call=call)\n        reply = fixture_server(lab, rpc)\n        matches = reply.get(\"id\") == rpc[\"id\"]\n        lab.event(\"rpc-returned\", \"按本次协议请求 ID 核对服务响应\",\n                  {\"rpcId\": rpc[\"id\"]}, {\"rpcReply\": reply}, {\"matches\": matches}, call=call)\n        if not matches:\n            return {\"error\": {\"message\": \"rpc-id-mismatch\"}, \"rpcId\": rpc[\"id\"]}\n        if \"error\" in reply:\n            return {\"error\": reply[\"error\"], \"rpcId\": rpc[\"id\"]}\n        return {\"content\": reply[\"result\"][\"content\"], \"rpcId\": rpc[\"id\"]}\n\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            name = \"cart/missing_cart\" if failed else next(iter(request[\"tools\"]))\n            return {\"tool\": name, \"args\": {}}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"{last['id']} 收到错误：{result['error']['message']}。\"}\n        observed = json.loads(result[\"content\"][0][\"text\"])\n        return {\"final\": f\"{last['id']} 收到协议响应 {result['rpcId']}：\"\n                         f\"实际 {observed['actual']} 分，预期 {observed['expected']} 分。\"}\n\n    run_loop(lab, \"使用外部购物车工具复查金额。\", provider, dispatch, tools=exposed)\n\n\nCHAPTERS[19] = demo_mcp\n\n","diff":"--- s18.py\n+++ s19.py\n@@ -635,2 +635,61 @@\n CHAPTERS[18] = demo_workspace\n \n+# ── s19_mcp.py ──\n+def fixture_server(lab, request):\n+    # 进程内协议子集，只演示 list/call 的请求结果形状。\n+    # 省略连接、握手、版本协商、网络传输和实际 MCP SDK。\n+    reply = {\"jsonrpc\": \"2.0\", \"id\": request[\"id\"]}\n+    if request[\"method\"] == \"tools/list\":\n+        reply[\"result\"] = {\"tools\": [{\"name\": \"cart_check\", \"description\": \"重算两件商品\",\n+                                      \"inputSchema\": {\"type\": \"object\", \"properties\": {}}}]}\n+    elif request[\"method\"] == \"tools/call\" and request[\"params\"][\"name\"] == \"cart_check\":\n+        data = check_cart(lab.repo)\n+        reply[\"result\"] = {\"content\": [{\"type\": \"text\", \"text\": json.dumps(data)}]}\n+    else:\n+        reply[\"error\"] = {\"code\": -32602, \"message\": \"该教学服务没有这个工具\"}\n+    return reply\n+\n+\n+def demo_mcp(lab, failed):\n+    listing = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\"}\n+    catalog = fixture_server(lab, listing)\n+    lab.event(\"tools-listed\", \"从本地教学服务发现工具\", {\"request\": listing}, catalog)\n+    if catalog[\"id\"] != listing[\"id\"] or \"error\" in catalog:\n+        raise RuntimeError(\"工具发现未收到匹配的清单\")\n+    exposed = {\"cart/\" + item[\"name\"]: item[\"inputSchema\"] for item in catalog[\"result\"][\"tools\"]}\n+    next_rpc_id = 2\n+\n+    def dispatch(local_name, args, call):\n+        nonlocal next_rpc_id\n+        rpc = {\"jsonrpc\": \"2.0\", \"id\": next_rpc_id, \"method\": \"tools/call\",\n+               \"params\": {\"name\": local_name.removeprefix(\"cart/\"), \"arguments\": args}}\n+        next_rpc_id += 1\n+        lab.event(\"rpc-requested\", \"把模型调用转成协议请求\",\n+                  {\"localTool\": local_name}, {\"request\": rpc}, call=call)\n+        reply = fixture_server(lab, rpc)\n+        matches = reply.get(\"id\") == rpc[\"id\"]\n+        lab.event(\"rpc-returned\", \"按本次协议请求 ID 核对服务响应\",\n+                  {\"rpcId\": rpc[\"id\"]}, {\"rpcReply\": reply}, {\"matches\": matches}, call=call)\n+        if not matches:\n+            return {\"error\": {\"message\": \"rpc-id-mismatch\"}, \"rpcId\": rpc[\"id\"]}\n+        if \"error\" in reply:\n+            return {\"error\": reply[\"error\"], \"rpcId\": rpc[\"id\"]}\n+        return {\"content\": reply[\"result\"][\"content\"], \"rpcId\": rpc[\"id\"]}\n+\n+    def provider(request):\n+        last = request[\"messages\"][-1]\n+        if last[\"role\"] == \"user\":\n+            name = \"cart/missing_cart\" if failed else next(iter(request[\"tools\"]))\n+            return {\"tool\": name, \"args\": {}}\n+        result = last[\"result\"]\n+        if \"error\" in result:\n+            return {\"final\": f\"{last['id']} 收到错误：{result['error']['message']}。\"}\n+        observed = json.loads(result[\"content\"][0][\"text\"])\n+        return {\"final\": f\"{last['id']} 收到协议响应 {result['rpcId']}：\"\n+                         f\"实际 {observed['actual']} 分，预期 {observed['expected']} 分。\"}\n+\n+    run_loop(lab, \"使用外部购物车工具复查金额。\", provider, dispatch, tools=exposed)\n+\n+\n+CHAPTERS[19] = demo_mcp\n+\n","path":"runtime/layers/s19_mcp.py"},"s20":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n# ── s09_memory.py ──\ndef open_session(memory_file):\n    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n    return {\"messages\": [], \"recalled\": recalled}\n\n\ndef demo_memory(lab, failed):\n    memory = lab.root / \"preferences.json\"\n    first = open_session(memory)\n    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n    if not failed:\n        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n    second = open_session(memory)\n    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n\n\nCHAPTERS[9] = demo_memory\n\n# ── s10_prompt.py ──\ndef build_request(repo, include_policy):\n    policy = (repo / \"README.md\").read_text(encoding=\"utf-8\").splitlines()[2]\n    parts = [\"你在修复教学购物车。\"]\n    if include_policy:\n        parts.append(policy)\n    parts.append(\"每轮最多申请 1 次写入。\")\n    return {\"system\": \"\\n\".join(parts), \"tools\": list(TOOLS),\n            \"messages\": [{\"role\": \"user\", \"content\": \"解释 350 分的差异。\"}]}\n\n\ndef demo_prompt(lab, failed):\n    request = build_request(lab.repo, include_policy=not failed)\n    lab.event(\"config-read\", \"读取系统角色、仓库约束和工具清单\", {},\n              {\"policyFile\": \"README.md\", \"tools\": list(TOOLS), \"writeBudget\": 1})\n    lab.event(\"request-built\", \"检查实际发送给教学模型的请求\",\n              {\"policyFileAvailable\": True}, request)\n    lab.event(\"outcome-checked\", \"在 system 字段中查找单位和预算\", {},\n              {\"hasCents\": \"整数分\" in request[\"system\"], \"hasBudget\": \"1 次写入\" in request[\"system\"]})\n\n\nCHAPTERS[10] = demo_prompt\n\n# ── s11_recovery.py ──\ndef demo_recovery(lab, failed):\n    # 注入故障的时点决定重试是否可能重复写入。\n    name = \"write_fix\" if failed else \"read\"\n    args = {} if failed else {\"path\": \"cart.py\"}\n    for attempt in (1, 2):\n        try:\n            if name == \"read\" and attempt == 1:\n                raise TimeoutError(\"读取前超时\")\n            result = execute_tool(lab, name, args, \"request-1\")\n            if name == \"write_fix\":\n                raise TimeoutError(\"写入后回执丢失\")\n            lab.event(\"tool-finished\", \"重试拿到读取结果\", {\"attempt\": attempt}, result, call=\"request-1\")\n            return\n        except TimeoutError as exc:\n            lab.event(\"tool-failed\", \"记录故障发生的位置\", {\"attempt\": attempt},\n                      {\"error\": str(exc), \"tool\": name}, call=\"request-1\")\n            if name == \"write_fix\":\n                lab.event(\"state-reconciled\", \"先读回当前文件来判定是否已经写入\",\n                          {\"writeReceipt\": None}, {\"check\": check_cart(lab.repo), \"writeRetries\": 0},\n                          call=\"request-1\")\n                return\n            lab.event(\"retry-scheduled\", \"只读操作可用剩余预算重试一次\",\n                      {\"remainingRetries\": 1}, {\"remainingRetries\": 0}, call=\"request-1\")\n\n\nCHAPTERS[11] = demo_recovery\n\n# ── s12_tasks.py ──\ndef ready_tasks(tasks):\n    return [name for name, t in tasks.items()\n            if t[\"status\"] == \"pending\" and all(tasks[d][\"status\"] == \"done\" for d in t[\"depends\"])]\n\n\ndef demo_tasks(lab, failed):\n    task_file = lab.root / \"tasks.json\"\n    tasks = {\"fix\": {\"status\": \"pending\", \"depends\": []},\n             \"verify\": {\"status\": \"pending\", \"depends\": [\"fix\"]}}\n    lab.event(\"tasks-created\", \"验证任务显式依赖修复任务\", {}, {\"ready\": ready_tasks(tasks), \"tasks\": tasks})\n    if not failed:\n        execute_tool(lab, \"write_fix\", {}, \"fix\")\n        tasks[\"fix\"][\"status\"] = \"done\"\n    task_file.write_text(json.dumps(tasks), encoding=\"utf-8\")\n    restored = json.loads(task_file.read_text(encoding=\"utf-8\"))\n    lab.event(\"tasks-restored\", \"重开任务表，再计算可以领取的工作\",\n              {\"file\": \"tasks.json\"}, {\"ready\": ready_tasks(restored), \"tasks\": restored})\n    lab.event(\"claim-checked\", \"尝试领取 verify\", {\"requested\": \"verify\"},\n              {\"allowed\": \"verify\" in ready_tasks(restored)})\n\n\nCHAPTERS[12] = demo_tasks\n\n# ── s13_background.py ──\nclass CheckQueue:\n    \"\"\"由实验器推进的单步工作队列，不依赖墙钟和线程调度。\"\"\"\n    def __init__(self):\n        self.jobs = {}\n\n    def submit(self, key, repo):\n        self.jobs[key] = {\"status\": \"queued\", \"repo\": repo}\n\n    def advance(self, key):\n        job = self.jobs[key]\n        if job[\"status\"] == \"queued\":\n            job.update(status=\"finished\", result=check_cart(job[\"repo\"]))\n\n    def poll(self, key):\n        job = self.jobs[key]\n        return {\"id\": key, \"status\": job[\"status\"], \"result\": job.get(\"result\")}\n\n\ndef demo_background(lab, failed):\n    execute_tool(lab, \"write_fix\", {}, \"fix\")\n    queue = CheckQueue()\n    queue.submit(\"job-1\", lab.repo)\n    lab.event(\"job-submitted\", \"立即返回任务 ID，主循环可继续工作\", {}, queue.poll(\"job-1\"))\n    lab.event(\"parent-continued\", \"主循环在结果到达前整理修改说明\",\n              {\"blocked\": False}, {\"note\": \"已把单价乘件数\", \"job\": \"job-1\"})\n    if not failed:\n        queue.advance(\"job-1\")\n    lab.event(\"job-polled\", \"按任务 ID 读取验证结果\", {\"job\": \"job-1\"}, queue.poll(\"job-1\"))\n\n\nCHAPTERS[13] = demo_background\n\n# ── s14_clock.py ──\nclass MinuteClock:\n    def __init__(self):\n        self.emitted = set()\n\n    def tick(self, minute):\n        if minute % 5 or minute in self.emitted:\n            return False\n        self.emitted.add(minute)\n        return True\n\n\ndef demo_clock(lab, failed):\n    clock = MinuteClock()\n    queue = CheckQueue()\n    for minute in ([4, 5, 5] if failed else [4, 5]):\n        before = sorted(clock.emitted)\n        triggered = clock.tick(minute)\n        if triggered:\n            queue.submit(f\"check@{minute}\", lab.repo)\n        lab.event(\"clock-ticked\", f\"时钟走到第 {minute} 分钟\",\n                  {\"seen\": before}, {\"seen\": sorted(clock.emitted), \"triggered\": triggered, \"jobs\": list(queue.jobs)})\n\n\nCHAPTERS[14] = demo_clock\n\n# ── s15_teams.py ──\ndef demo_team(lab, failed):\n    old_snapshot = lab.root / \"review-copy\"\n    copytree(lab.repo, old_snapshot)\n    tasks = {\"fix\": \"builder\", \"verify\": \"reviewer\"}\n    lab.event(\"team-assigned\", \"把修复和独立复核交给两个角色\", {}, {\"owners\": tasks})\n    fix = observed_tool(lab, \"write_fix\", {}, \"builder-write\")\n    lab.event(\"member-reported\", \"修复者提交变更摘要\", {\"role\": \"builder\"}, fix, span=\"builder\")\n    review_repo = old_snapshot if failed else lab.repo\n    verdict = check_cart(review_repo)\n    lab.event(\"member-reported\", \"复核者在自己的输入版本上重算金额\",\n              {\"role\": \"reviewer\", \"snapshot\": \"起始副本\" if failed else \"修复后副本\"},\n              verdict, span=\"reviewer\")\n    lab.event(\"team-collected\", \"负责人同时核对修复结果和复核输入\",\n              {\"owners\": tasks}, {\"write\": fix, \"review\": verdict, \"agreed\": verdict[\"passed\"]})\n\n\nCHAPTERS[15] = demo_team\n\n# ── s16_protocol.py ──\ndef receive_message(inbox, envelope):\n    if envelope[\"id\"] in inbox:\n        return \"duplicate\"\n    if envelope[\"to\"] != \"reviewer\" or envelope[\"type\"] != \"review-request\":\n        return \"unroutable\"\n    inbox[envelope[\"id\"]] = envelope\n    return \"accepted\"\n\n\ndef demo_protocol(lab, failed):\n    inbox = {}\n    message = {\"id\": \"msg-1\", \"taskId\": \"cart-fix\", \"from\": \"builder\",\n               \"to\": \"reviewer\", \"type\": \"review-request\", \"file\": \"cart.py\"}\n    lab.event(\"message-sent\", \"发送有类型和关联 ID 的复核请求\", {}, message, span=\"builder\")\n    for _ in range(2 if failed else 1):\n        before = list(inbox)\n        status = receive_message(inbox, message)\n        lab.event(\"message-received\", \"收件箱检查路由与消息 ID\",\n                  {\"receivedIds\": before}, {\"receivedIds\": list(inbox), \"status\": status},\n                  {\"messageId\": message[\"id\"], \"taskId\": message[\"taskId\"]}, span=\"reviewer\")\n\n\nCHAPTERS[16] = demo_protocol\n\n# ── s17_claim.py ──\nimport sqlite3\nfrom contextlib import closing\n\n\n# 一条任务最多有一个前置项。发现与认领使用同一条就绪条件。\nREADY = \"\"\"status='pending' AND owner IS NULL AND\n           (dependency IS NULL OR EXISTS\n               (SELECT 1 FROM task AS prior WHERE prior.name=t.dependency AND prior.status='done'))\"\"\"\n\n\ndef seed_tasks(database):\n    with closing(sqlite3.connect(database)) as db, db:\n        db.execute(\"CREATE TABLE task(name TEXT PRIMARY KEY, dependency TEXT, status TEXT, owner TEXT)\")\n        db.execute(\"INSERT INTO task VALUES ('cart-fix', NULL, 'pending', NULL)\")\n        db.execute(\"INSERT INTO task VALUES ('cart-verify', 'cart-fix', 'pending', NULL)\")\n\n\ndef discover_tasks(database):\n    with closing(sqlite3.connect(database)) as db:\n        ready = db.execute(\"SELECT name FROM task AS t WHERE \" + READY + \" ORDER BY name\").fetchall()\n        rows = db.execute(\"SELECT name, dependency, status, owner FROM task ORDER BY name\").fetchall()\n    state = {name: {\"dependsOn\": dep, \"status\": status, \"owner\": owner} for name, dep, status, owner in rows}\n    return [name for (name,) in ready], state\n\n\ndef claim_task(database, name, worker):\n    # 重检同一就绪条件：发现之后，依赖或负责人可能已变。\n    with closing(sqlite3.connect(database)) as db, db:\n        changed = db.execute(\"UPDATE task AS t SET owner=?, status='running' WHERE name=? AND \" + READY,\n                             (worker, name)).rowcount\n        current = db.execute(\"SELECT owner FROM task WHERE name=?\", (name,)).fetchone()\n    return changed == 1, current[0] if current else None\n\n\ndef scan_candidates(lab, database, worker):\n    ready, rows = discover_tasks(database)\n    lab.event(\"ready-discovered\", f\"{worker} 从持久任务表查询当前可领取项\",\n              {\"tasks\": rows}, {\"ready\": ready}, {\"worker\": worker})\n    return ready\n\n\ndef try_claim(lab, database, worker, candidate):\n    won, owner = claim_task(database, candidate, worker)\n    lab.event(\"claim-resolved\", f\"工作者 {worker} 条件领取 {candidate}\",\n              {\"candidate\": candidate}, {\"owner\": owner, \"won\": won},\n              {\"worker\": worker, \"task\": candidate})\n\n\ndef demo_claim(lab, failed):\n    database = lab.root / \"claims.db\"\n    seed_tasks(database)\n    workers = [\"A\", \"B\"] if failed else [\"A\"]\n    # 先收集各工作者当时看到的快照，再交错执行；由此稳定重现竞争窗口。\n    snapshots = {worker: scan_candidates(lab, database, worker) for worker in workers}\n    for worker, candidates in snapshots.items():\n        if candidates:\n            try_claim(lab, database, worker, candidates[0])\n\n    # 领用与完成各是一步。本实验保留 owner=A 且修复未完成。\n    idle_limit = 2\n    for attempt in range(1, idle_limit + 1):\n        ready = scan_candidates(lab, database, workers[-1])\n        if ready:\n            try_claim(lab, database, workers[-1], ready[0])\n            return\n        lab.event(\"worker-idle\", \"本轮没有可领取项\", {\"attempt\": attempt},\n                  {\"idleCount\": attempt, \"limit\": idle_limit})\n    _, tasks = discover_tasks(database)\n    lab.event(\"worker-stopped\", \"连续两次空闲，结束本次轮询\", {\"idleCount\": idle_limit},\n              {\"reason\": \"idle-limit\", \"allTasksDone\": all(t[\"status\"] == \"done\" for t in tasks.values())})\n\n\nCHAPTERS[17] = demo_claim\n\n# ── s18_workspace.py ──\ndef merge_file(path, base, incoming):\n    current = path.read_text(encoding=\"utf-8\")\n    if current != base and current != incoming:\n        return \"conflict\"\n    path.write_text(incoming, encoding=\"utf-8\")\n    return \"merged\"\n\n\ndef demo_workspace(lab, failed):\n    # 普通目录副本与单文件基线，演示隔离和冲突，没有创建 Git 分支。\n    scratch = lab.root / \"worker-copy\"\n    copytree(lab.repo, scratch)\n    target = lab.repo / \"cart.py\"\n    base = target.read_text(encoding=\"utf-8\")\n    patch_file = scratch / \"cart.py\"\n    incoming = base.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    patch_file.write_text(incoming, encoding=\"utf-8\")\n    lab.event(\"workspace-isolated\", \"在工作者副本修改后分别执行两个版本\",\n              {\"copies\": [\"cart_repo\", \"worker-copy\"]}, {\"main\": check_cart(lab.repo), \"worker\": check_cart(scratch)})\n    if failed:\n        target.write_text(base + \"\\n# 主目录已收到另一位工作者的改动\\n\", encoding=\"utf-8\")\n    before = target.read_text(encoding=\"utf-8\")\n    status = merge_file(target, base, patch_file.read_text(encoding=\"utf-8\"))\n    lab.event(\"merge-checked\", \"将主目录当前文本与分叉时基线比较\",\n              {\"targetMatchesBase\": before == base},\n              {\"status\": status, \"targetUnchanged\": target.read_text(encoding=\"utf-8\") == before,\n               \"main\": check_cart(lab.repo)})\n\n\nCHAPTERS[18] = demo_workspace\n\n# ── s19_mcp.py ──\ndef fixture_server(lab, request):\n    # 进程内协议子集，只演示 list/call 的请求结果形状。\n    # 省略连接、握手、版本协商、网络传输和实际 MCP SDK。\n    reply = {\"jsonrpc\": \"2.0\", \"id\": request[\"id\"]}\n    if request[\"method\"] == \"tools/list\":\n        reply[\"result\"] = {\"tools\": [{\"name\": \"cart_check\", \"description\": \"重算两件商品\",\n                                      \"inputSchema\": {\"type\": \"object\", \"properties\": {}}}]}\n    elif request[\"method\"] == \"tools/call\" and request[\"params\"][\"name\"] == \"cart_check\":\n        data = check_cart(lab.repo)\n        reply[\"result\"] = {\"content\": [{\"type\": \"text\", \"text\": json.dumps(data)}]}\n    else:\n        reply[\"error\"] = {\"code\": -32602, \"message\": \"该教学服务没有这个工具\"}\n    return reply\n\n\ndef demo_mcp(lab, failed):\n    listing = {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\"}\n    catalog = fixture_server(lab, listing)\n    lab.event(\"tools-listed\", \"从本地教学服务发现工具\", {\"request\": listing}, catalog)\n    if catalog[\"id\"] != listing[\"id\"] or \"error\" in catalog:\n        raise RuntimeError(\"工具发现未收到匹配的清单\")\n    exposed = {\"cart/\" + item[\"name\"]: item[\"inputSchema\"] for item in catalog[\"result\"][\"tools\"]}\n    next_rpc_id = 2\n\n    def dispatch(local_name, args, call):\n        nonlocal next_rpc_id\n        rpc = {\"jsonrpc\": \"2.0\", \"id\": next_rpc_id, \"method\": \"tools/call\",\n               \"params\": {\"name\": local_name.removeprefix(\"cart/\"), \"arguments\": args}}\n        next_rpc_id += 1\n        lab.event(\"rpc-requested\", \"把模型调用转成协议请求\",\n                  {\"localTool\": local_name}, {\"request\": rpc}, call=call)\n        reply = fixture_server(lab, rpc)\n        matches = reply.get(\"id\") == rpc[\"id\"]\n        lab.event(\"rpc-returned\", \"按本次协议请求 ID 核对服务响应\",\n                  {\"rpcId\": rpc[\"id\"]}, {\"rpcReply\": reply}, {\"matches\": matches}, call=call)\n        if not matches:\n            return {\"error\": {\"message\": \"rpc-id-mismatch\"}, \"rpcId\": rpc[\"id\"]}\n        if \"error\" in reply:\n            return {\"error\": reply[\"error\"], \"rpcId\": rpc[\"id\"]}\n        return {\"content\": reply[\"result\"][\"content\"], \"rpcId\": rpc[\"id\"]}\n\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            name = \"cart/missing_cart\" if failed else next(iter(request[\"tools\"]))\n            return {\"tool\": name, \"args\": {}}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"{last['id']} 收到错误：{result['error']['message']}。\"}\n        observed = json.loads(result[\"content\"][0][\"text\"])\n        return {\"final\": f\"{last['id']} 收到协议响应 {result['rpcId']}：\"\n                         f\"实际 {observed['actual']} 分，预期 {observed['expected']} 分。\"}\n\n    run_loop(lab, \"使用外部购物车工具复查金额。\", provider, dispatch, tools=exposed)\n\n\nCHAPTERS[19] = demo_mcp\n\n# ── s20_integration.py ──\ndef run_suite(repo):\n    # 在独立 Python 进程运行副本里的 unittest，回传可比较的结构化结果。\n    script = \"\"\"import io, json, os, sys, unittest\nsys.path.insert(0, os.getcwd())\nsuite = unittest.defaultTestLoader.discover(\"tests\")\nclass ObservedResults(unittest.TextTestResult):\n    def addSuccess(self, test):\n        super().addSuccess(test)\n        successes.append(test.id())\nsuccesses = []\nresult = unittest.TextTestRunner(stream=io.StringIO(), resultclass=ObservedResults).run(suite)\nprint(json.dumps({\"count\": result.testsRun, \"passedTestIds\": sorted(successes), \"failures\": [c.id() for c, _ in result.failures],\n                  \"errors\": [c.id() for c, _ in result.errors], \"passed\": result.wasSuccessful()}))\n\"\"\"\n    proc = subprocess.run([sys.executable, \"-I\", \"-B\", \"-c\", script], cwd=repo,\n                          capture_output=True, text=True, check=True, timeout=10)\n    return json.loads(proc.stdout)\n\n\ndef integration_tool(lab, name, args, call):\n    if name != \"add_regression\":\n        return execute_tool(lab, name, args, call)\n    if args:\n        return {\"error\": \"invalid-arguments\", \"expected\": {}}\n    test_file = lab.repo / \"tests\" / \"test_cart.py\"\n    source = test_file.read_text(encoding=\"utf-8\")\n    test = (\"\\n    def test_mixed_items(self):\\n\"\n            \"        self.assertEqual(total_cents([(350, 2), (20, 3)]), 760)\\n\")\n    if test in source:\n        return {\"path\": \"tests/test_cart.py\", \"changed\": False}\n    test_file.write_text(source + test, encoding=\"utf-8\")\n    lab.event(\"regression-added\", \"补充混合商品回归断言\",\n              {\"case\": \"2 × 350 + 3 × 20\"}, {\"expected\": 760, \"file\": \"tests/test_cart.py\"}, call=call)\n    return {\"path\": \"tests/test_cart.py\", \"changed\": True}\n\n\ndef repair_provider(request):\n    last = request[\"messages\"][-1]\n    if last[\"role\"] == \"user\":\n        return {\"tool\": \"write_fix\", \"args\": {}}\n    result = last[\"result\"]\n    if \"error\" in result:\n        return {\"final\": f\"工具返回 {result['error']}，结束写入，保留现场等待检查。\"}\n    if result[\"path\"] == \"cart.py\":\n        return {\"tool\": \"add_regression\", \"args\": {}}\n    return {\"final\": \"实现和测试已返回，等待执行验证。\"}\n\n\ndef meets_acceptance(background, suite):\n    required = {\"test_cart.CartTests.test_two_units\", \"test_cart.CartTests.test_mixed_items\"}\n    return (background[\"status\"] == \"finished\" and background[\"result\"][\"passed\"]\n            and suite[\"passed\"] and required.issubset(suite[\"passedTestIds\"]))\n\n\ndef demo_integration(lab, failed):\n    plan = {\"定位\": \"running\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"建立修复计划\", {}, {\"plan\": plan})\n    finding = inspect_child(lab, {\"question\": \"定位购物车求和\", \"allowedFiles\": [\"cart.py\"]}, \"diagnose\")\n    plan[\"定位\"] = \"done\"\n    lab.event(\"child-returned\", \"子任务返回表达式，复跑原测试\",\n              {\"finding\": finding}, {\"baselineTests\": run_suite(lab.repo), \"cart\": check_cart(lab.repo)},\n              span=\"diagnose\")\n    targets = {**WRITE_TARGETS, \"add_regression\": \"tests/test_cart.py\"}\n    run_loop(lab, \"修复购物车并补充测试。\", repair_provider,\n             lambda n, a, c: observed_tool(lab, n, a, c, allow_write=not failed,\n                                           executor=integration_tool, write_targets=targets),\n             tools={**public_tools(), \"add_regression\": {}})\n    queue = CheckQueue()\n    queue.submit(\"verify\", lab.repo)\n    lab.event(\"job-submitted\", \"提交后台金额检查\", {}, queue.poll(\"verify\"))\n    queue.advance(\"verify\")\n    cart_check = queue.poll(\"verify\")\n    tests = run_suite(lab.repo)\n    completed = meets_acceptance(cart_check, tests)\n    plan[\"修复\"] = \"done\" if cart_check[\"result\"][\"passed\"] else \"pending\"\n    plan[\"验证\"] = \"done\" if completed else \"blocked\"\n    lab.event(\"outcome-checked\", \"汇总后台结果、真实 unittest 和计划状态\",\n              {\"job\": \"verify\"}, {\"job\": cart_check, \"tests\": tests, \"plan\": plan,\n                                  \"completed\": completed})\n\n\nCHAPTERS[20] = demo_integration\n\n","diff":"--- s19.py\n+++ s20.py\n@@ -694,2 +694,86 @@\n CHAPTERS[19] = demo_mcp\n \n+# ── s20_integration.py ──\n+def run_suite(repo):\n+    # 在独立 Python 进程运行副本里的 unittest，回传可比较的结构化结果。\n+    script = \"\"\"import io, json, os, sys, unittest\n+sys.path.insert(0, os.getcwd())\n+suite = unittest.defaultTestLoader.discover(\"tests\")\n+class ObservedResults(unittest.TextTestResult):\n+    def addSuccess(self, test):\n+        super().addSuccess(test)\n+        successes.append(test.id())\n+successes = []\n+result = unittest.TextTestRunner(stream=io.StringIO(), resultclass=ObservedResults).run(suite)\n+print(json.dumps({\"count\": result.testsRun, \"passedTestIds\": sorted(successes), \"failures\": [c.id() for c, _ in result.failures],\n+                  \"errors\": [c.id() for c, _ in result.errors], \"passed\": result.wasSuccessful()}))\n+\"\"\"\n+    proc = subprocess.run([sys.executable, \"-I\", \"-B\", \"-c\", script], cwd=repo,\n+                          capture_output=True, text=True, check=True, timeout=10)\n+    return json.loads(proc.stdout)\n+\n+\n+def integration_tool(lab, name, args, call):\n+    if name != \"add_regression\":\n+        return execute_tool(lab, name, args, call)\n+    if args:\n+        return {\"error\": \"invalid-arguments\", \"expected\": {}}\n+    test_file = lab.repo / \"tests\" / \"test_cart.py\"\n+    source = test_file.read_text(encoding=\"utf-8\")\n+    test = (\"\\n    def test_mixed_items(self):\\n\"\n+            \"        self.assertEqual(total_cents([(350, 2), (20, 3)]), 760)\\n\")\n+    if test in source:\n+        return {\"path\": \"tests/test_cart.py\", \"changed\": False}\n+    test_file.write_text(source + test, encoding=\"utf-8\")\n+    lab.event(\"regression-added\", \"补充混合商品回归断言\",\n+              {\"case\": \"2 × 350 + 3 × 20\"}, {\"expected\": 760, \"file\": \"tests/test_cart.py\"}, call=call)\n+    return {\"path\": \"tests/test_cart.py\", \"changed\": True}\n+\n+\n+def repair_provider(request):\n+    last = request[\"messages\"][-1]\n+    if last[\"role\"] == \"user\":\n+        return {\"tool\": \"write_fix\", \"args\": {}}\n+    result = last[\"result\"]\n+    if \"error\" in result:\n+        return {\"final\": f\"工具返回 {result['error']}，结束写入，保留现场等待检查。\"}\n+    if result[\"path\"] == \"cart.py\":\n+        return {\"tool\": \"add_regression\", \"args\": {}}\n+    return {\"final\": \"实现和测试已返回，等待执行验证。\"}\n+\n+\n+def meets_acceptance(background, suite):\n+    required = {\"test_cart.CartTests.test_two_units\", \"test_cart.CartTests.test_mixed_items\"}\n+    return (background[\"status\"] == \"finished\" and background[\"result\"][\"passed\"]\n+            and suite[\"passed\"] and required.issubset(suite[\"passedTestIds\"]))\n+\n+\n+def demo_integration(lab, failed):\n+    plan = {\"定位\": \"running\", \"修复\": \"pending\", \"验证\": \"pending\"}\n+    lab.event(\"plan-created\", \"建立修复计划\", {}, {\"plan\": plan})\n+    finding = inspect_child(lab, {\"question\": \"定位购物车求和\", \"allowedFiles\": [\"cart.py\"]}, \"diagnose\")\n+    plan[\"定位\"] = \"done\"\n+    lab.event(\"child-returned\", \"子任务返回表达式，复跑原测试\",\n+              {\"finding\": finding}, {\"baselineTests\": run_suite(lab.repo), \"cart\": check_cart(lab.repo)},\n+              span=\"diagnose\")\n+    targets = {**WRITE_TARGETS, \"add_regression\": \"tests/test_cart.py\"}\n+    run_loop(lab, \"修复购物车并补充测试。\", repair_provider,\n+             lambda n, a, c: observed_tool(lab, n, a, c, allow_write=not failed,\n+                                           executor=integration_tool, write_targets=targets),\n+             tools={**public_tools(), \"add_regression\": {}})\n+    queue = CheckQueue()\n+    queue.submit(\"verify\", lab.repo)\n+    lab.event(\"job-submitted\", \"提交后台金额检查\", {}, queue.poll(\"verify\"))\n+    queue.advance(\"verify\")\n+    cart_check = queue.poll(\"verify\")\n+    tests = run_suite(lab.repo)\n+    completed = meets_acceptance(cart_check, tests)\n+    plan[\"修复\"] = \"done\" if cart_check[\"result\"][\"passed\"] else \"pending\"\n+    plan[\"验证\"] = \"done\" if completed else \"blocked\"\n+    lab.event(\"outcome-checked\", \"汇总后台结果、真实 unittest 和计划状态\",\n+              {\"job\": \"verify\"}, {\"job\": cart_check, \"tests\": tests, \"plan\": plan,\n+                                  \"completed\": completed})\n+\n+\n+CHAPTERS[20] = demo_integration\n+\n","path":"runtime/layers/s20_integration.py"}}}</script>
<script>async function boot(){
"use strict";
const $ = (selector, scope = document) => scope.querySelector(selector);
const h = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const pretty = value => JSON.stringify(value, null, 2) ?? "—";
const fw = {hermes:"Hermes",dsh:"dsh",agentscope:"AgentScope"};
const tabs = {learn:"学习",sim:"模拟",source:"源码",explore:"深入探索"};
const level = {native:"原生实现",composed:"组合实现","no-direct-equivalent":"无直接对应",unverified:"待核验"};
const tier = {"document-reviewed":"已核对文档","source-reviewed":"已核对源码","offline-tested":"框架离线实测","live-tested":"真模型实测"};
const icons = {
  learn:'<path d="M3 5q5-2 9 1 4-3 9-1v14q-5-2-9 1-4-3-9-1zM12 6v14"/>',
  sim:'<path d="m8 4 12 8-12 8z"/>', source:'<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-16-3 20"/>',
  explore:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6z"/>',
  loop:'<path d="M4 9a8 8 0 0 1 14-4l2 2m0-5v5h-5M20 15a8 8 0 0 1-14 4l-2-2m0 5v-5h5"/>',
  arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',prev:'<path d="M20 12H5m6-6-6 6 6 6"/>',
  layers:'<path d="m3 8 9-5 9 5-9 5zm0 5 9 5 9-5m-18 5 9 5 9-5"/>',
  terminal:'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 3 3-3 3m6 0h5"/>',
  external:'<path d="M14 3h7v7m0-7L10 14m0-9H5q-2 0-2 2v12q0 2 2 2h12q2 0 2-2v-5"/>'
};
const icon = (key,size=17) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]}</svg>`;
const keys = ["chapters","mappings","runs","code"];
let data;
if ($("#packed")) data = JSON.parse($("#packed").textContent);
else data = Object.fromEntries(await Promise.all(keys.map(async key=>{
  const response = await fetch(`data/${key}.json`);
  if (!response.ok) throw new Error(key);
  return [key,await response.json()];
})));
const {chapters,mappings,runs,code} = data;
const ids = chapters.map(c=>c.id);
const valid = (value, options, fallback) => options.includes(value) ? value : fallback;
const getStored = (key,fallback) => { try {return JSON.parse(localStorage.getItem("harness-lab:v1:"+key)) ?? fallback;} catch { return fallback; } };
const save = (key,value) => { try {localStorage.setItem("harness-lab:v1:"+key,JSON.stringify(value));} catch {} };
let viewed = new Set(getStored("viewed",[])), passed = new Set(getStored("passed",[]));
let attempt = null, timer = null, route, mobileOpen = false;
let concealFuture = Boolean(getStored("conceal",false));
function parse(){
  const params = new URLSearchParams(location.hash.startsWith("#?") ? location.hash.slice(2) : location.search);
  const c = valid(params.get("chapter"),ids,"s01");
  const sc = valid(params.get("scenario"),["normal","failure"],"normal");
  const timeline = runs[c][sc];
  const marker = params.get("step") || "";
  const idx = timeline.findIndex((ev,i)=>eventKey(timeline,i)===marker);
  return {chapter:c,harness:valid(params.get("harness"),Object.keys(fw),"hermes"),tab:valid(params.get("tab"),Object.keys(tabs),"learn"),scenario:sc,index:Math.max(0,idx),codeView:valid(params.get("view"),["diff","full","origin"],"diff")};
}
function eventKey(events,i) {
  const key = events[i].semanticStep;
  const occurrence = events.slice(0,i+1).filter(ev=>ev.semanticStep===key).length;
  return `${key}.${occurrence}`;
}
function url(r){
  const p = new URLSearchParams({chapter:r.chapter,harness:r.harness,tab:r.tab,scenario:r.scenario});
  if (r.index) p.set("step",eventKey(runs[r.chapter][r.scenario],r.index));
  if (r.tab==="source" && r.codeView!=="diff") p.set("view",r.codeView);
  return (location.protocol==="file:"?"#?":"?")+p.toString();
}
function stop(){ if(timer) clearInterval(timer); timer=null; }
function nav(patch,replace=false,autoplay=false){
  const changedChapter = patch.chapter && patch.chapter!==route.chapter;
  if(!autoplay) stop();
  if(changedChapter){attempt=null;mobileOpen=false;}
  route = {...route,...patch};
  const href = url(route);
  try {
    if((location.protocol==="file:"?location.hash:location.search)!==href) history[replace?"replaceState":"pushState"](null,"",href);
  } catch {location.assign(new URL(href,location.href));return;}
  render();
  if(changedChapter) {window.scrollTo({top:0}); $("#lesson").focus({preventScroll:true});}
}
function cLink(c,label,cls=""){
  if(!c) return "";
  return `<a class="${cls}" data-chapter="${c.id}" href="${h(url({...route,chapter:c.id,index:0}))}">${label}</a>`;
}
function fwButtons(){
  return `<div class="switch" aria-label="框架视角">${Object.entries(fw).map(([k,v])=>`<button data-fw="${k}" aria-pressed="${route.harness===k}">${v}</button>`).join("")}</div>`;
}
function side(c){
  const groups = [];
  for (const ch of chapters){
    if(!groups.length || groups.at(-1).name!==ch.group) groups.push({name:ch.group,items:[]});
    groups.at(-1).items.push(ch);
  }
  $("#sidebar").innerHTML=`<div class="side-heading">${icon("layers")} 课程目录 <span>20 章</span></div><nav>${groups.map(group=>`<div class="side-group">${h(group.name)}</div>${group.items.map(ch=>cLink(ch,`<span class="chap-no">${ch.id.slice(1)}</span><span>${h(ch.title)}</span>${passed.has(ch.id)?'<i class="pass" aria-label="练习已通过">✓</i>':""}`,ch.id===c.id?"chapter active":"chapter")).join("")}`).join("")}</nav><div class="progress"><div>学习进度 <b>${viewed.size} / 20</b></div><progress max="20" value="${viewed.size}"></progress><small>已读 ${viewed.size} 章 · 练习通过 ${passed.size} 章</small></div>`;
  $("#sidebar").classList.toggle("open",mobileOpen);
  $("#menu").setAttribute("aria-expanded",String(mobileOpen));
  $("#sidebar .chapter.active")?.setAttribute("aria-current","page");
}
// Each course increment attaches to one stable part of the minimal loop.
const chapterStage = [2,3,3,3,6,6,0,0,0,1,3,6,6,6,6,6,6,3,3,5];
const stageNames = ["消息上下文","调用模型","判断下一步","执行工具","最终回复","任务验收","任务与协作"];
function stageOf(e){
  const key = e.semanticStep;
  if(key==="assistant-finished") return 4;
  if(key==="outcome-checked") return 5;
  if(key==="tool-requested") return 2;
  if(key==="request-built") return 1;
  if(/^(tool-f|tools-listed|hook-|permission-|retry-|state-reconciled|workspace-|merge-|regression-)/.test(key)) return 3;
  if(/^(user-input|catalog-|skill-|history-|context-|session-|memory-|config-)/.test(key)) return 0;
  return 6;
}
function diagram(c,n,ev){
  const sim=route.tab==="sim", focus=sim?stageOf(ev):chapterStage[n];
  const compact=window.matchMedia("(max-width: 600px)").matches;
  const names=["messages[]","model","tool_call?","dispatch()","return","assert","work state"];
  const boxes=compact
    ? [[12,74,137],[185,74,137],[185,148,137],[12,148,137],[185,222,137],[12,222,137],[12,6,137]]
    : [[26,68,142],[224,68,142],[426,68,148],[636,68,142],[426,158,148],[636,158,142],[26,158,142]];
  const connections=compact
    ? ["M149 100h31","M253 127v16","M185 174h-31","M253 201v16","M185 248h-31","M79 148v-16","M79 59v10"]
    : ["M168 94H218","M366 94H420","M574 94H630","M499 121v32","M574 184h56","M707 68V40q0-8-8-8H104q-8 0-8 8v22","M96 158v-30"];
  const labels=compact
    ? [[167,165,"有"],[270,216,"无"],[106,143,"回传"]]
    : [[385,25,"工具结果回到下一轮"],[604,83,"有"],[516,145,"无"]];
  const nodes=boxes.map(([x,y,w],i)=>`<g data-stage="${i}" class="node ${i===focus?"hot":i===6&&n<4?"later":""}" tabindex="0" role="button" aria-label="${stageNames[i]}，查看本场景对应事件"><rect x="${x}" y="${y}" width="${w}" height="53" rx="8"/><circle cx="${x+17}" cy="${y+18}" r="3"/><text x="${x+27}" y="${y+23}" class="node-name">${stageNames[i]}</text><text x="${x+17}" y="${y+42}" class="node-code">${names[i]}</text></g>`).join("");
  return `<section class="diagram"><div class="diagram-head"><h2>${icon("loop",17)} 运行全貌</h2><span><i></i>${sim?"当前事件":"本章接点"}</span></div>
    <div class="map-scroll"><svg viewBox="${compact?"0 0 334 282":"0 0 810 224"}" role="group" aria-label="Agent Loop 的消息、模型、工具分支与最终回复">
    <defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#bda9dd" stroke-width="1.3"/></marker></defs>
    <g fill="none" stroke="#bda9dd" stroke-width="1.65" marker-end="url(#tip)">${connections.map((p,i)=>`<path d="${p}" ${i>=4?'stroke-dasharray="4 3"':""}/>`).join("")}</g>
    <g class="edge-text">${labels.map(([x,y,label])=>`<text x="${x}" y="${y}" text-anchor="middle">${label}</text>`).join("")}</g>${nodes}</svg></div>
    <div class="diagram-foot"><span>${h(c.id.toUpperCase())} <b>／</b> ${h(c.checkpoint)}</span><button data-open="sim">查看轨迹 ${icon("arrow",15)}</button></div></section>`;
}
function sourceLink(card){
  const url = String(card.url||"");
  return /^https?:\/\//i.test(url)?`<a class="source-link" href="${h(url)}" target="_blank" rel="noopener noreferrer">${icon("external",14)} ${h(card.source || "查看上游来源")}</a>`:`<span class="muted">${h(card.source || "暂无固定来源")}</span>`;
}
function frame(c,mode="full"){
  const card = mappings[c.id][route.harness];
  return `<section id="framework-impl" class="frame-card"><div class="split-head"><h2>${icon("layers")} ${h(fw[route.harness])} 实现</h2></div>
    <div class="frame-body"><div class="evidence"><span>${h(level[card.support]??card.support)}</span>${card.evidence.map(t=>`<small>${h(tier[t]??t)}</small>`).join("")}</div>
    <h3>${h(card.title)}</h3><p>${h(card.body)}</p>
    <dl class="facts">${(mode==="sim"?[["状态归属",card.state],["对照位置",card.checkpoint]]:[["执行入口",card.entry],["状态归属",card.state],["对照位置",card.checkpoint]]).map(([k,v])=>`<div><dt>${k}</dt><dd>${h(v)}</dd></div>`).join("")}</dl>${sourceLink(card)}</div></section>`;
}
function lesson(c){
  return `<section class="content-section"><h2>本章新增了什么</h2><p class="lead">${h(c.mechanism)}</p><div class="io"><div><label>上游输入</label><p>${h(c.input)}</p></div>${icon("arrow")}<div><label>下游输出</label><p>${h(c.output)}</p></div></div></section>
    <section class="content-section"><h2>跟着购物车走一遍</h2><p class="muted">${h(c.previous)}</p><ol class="walk">${c.walkthrough.map(s=>`<li>${h(s)}</li>`).join("")}</ol><button class="action" data-open="sim">${icon("sim",15)} 进入单步实验</button></section>
    ${frame(c)}<details class="all-mech"><summary>累积到本章的机制</summary><ol>${chapters.map((v,i)=>`<li class="${i>ids.indexOf(c.id)?"future":""}">${cLink(v,`${v.id} · ${h(v.zh)}`)}<small>${v.id===c.id?"本章新增":i<ids.indexOf(c.id)?"已引入":"后续章节"}</small></li>`).join("")}</ol></details>`;
}
function sim(c,events,ev){
  const i = route.index;
  const card = mappings[c.id][route.harness];
  const anchor = card.anchors?.[ev.semanticStep];
  const scenarioNames = {
    s01:["运行检查","跳过检查"],s02:["有效调用","未知工具与参数错误"],
    s03:["允许写入","拒绝写入"],s04:["前后回调正常","前置回调异常"]
  };
  const labels = scenarioNames[c.id] || ["正常路径","失败对照"];
  const table = value => `<pre class="state-json" tabindex="0">${h(pretty(value))}</pre>`;
  return `<section class="content-section"><div class="split-head"><h2>轨迹实验台</h2><span class="mode">教学模拟 · 确定性回放</span></div><p class="muted">购物车使用同一份初始快照。切换框架可对照源码位置，时间线来自共同教学程序。</p>
    <div class="sim-controls"><div class="switch" aria-label="实验场景">${["normal","failure"].map(k=>`<button data-scenario="${k}" aria-pressed="${k===route.scenario}">${labels[k==="normal"?0:1]}</button>`).join("")}</div>
    <div class="play-controls"><button data-sim="reset">重置</button><button data-sim="back" ${i===0?"disabled":""}>上一步</button><button data-sim="step" ${i===events.length-1?"disabled":""}>单步 →</button><button class="action" data-sim="play">${timer?"暂停":"播放"}</button></div></div>
    <div class="predict"><label><input type="checkbox" data-conceal ${concealFuture?"checked":""}> 先预测，隐藏后续事件</label><span>${h(c.checkpoint)}</span></div>
    <div class="trace-grid"><div class="timeline" role="group" aria-label="事件时间线">${events.map((e,j)=>`<button data-seq="${j}" aria-current="${j===i?"step":"false"}"><span>${String(j+1).padStart(2,"0")}</span><div>${concealFuture&&j>i?"等待单步揭晓":h(e.title||e.eventType)}<small>${concealFuture&&j>i?"…":h(e.semanticStep)}</small></div></button>`).join("")}</div><article class="event"><div class="mono muted">EVENT ${i+1} / ${events.length}</div><h3>${h(ev.title||ev.eventType)}</h3><p>${h(ev.note||ev.semanticStep)}</p>${ev.toolCallId?`<div class="callid">toolCallId · ${h(ev.toolCallId)}</div>`:""}<h4>本步载荷</h4>${Object.keys(ev.payload||{}).length?table(ev.payload):'<p class="muted">本步观测见下方执行前后状态。</p>'}<button class="text-action" data-event-source>定位教学源码 ${icon("arrow",14)}</button></article></div>
    <div class="anchor-note"><strong>${h(fw[route.harness])} · 当前事件</strong><p>${h(anchor||"这一教学事件尚无单独核实的框架检查点。可在下方实现卡查阅整章依据。")}</p></div>
    <div class="state-pair"><div><h3>执行前</h3>${table(ev.before)}</div><div><h3>执行后</h3>${table(ev.after)}</div></div>
    <details><summary>原始教学事件与来源</summary>${table(ev)}</details></section>${frame(c,"sim")}`;
}
function source(c,ev){
  const doc = code[c.id];
  const text = route.codeView==="full"?doc.code:doc.diff;
  const [filePath, symbolName=""] = String(ev.sourceRef||"").split("#");
  const fileName = filePath.split("/").at(-1);
  const symbol = symbolName.split(".").at(-1);
  const lines = (text||"").split("\n");
  const start = lines.indexOf("# ── "+fileName+" ──");
  const nextFile = lines.findIndex((line,i)=>i>start && line.startsWith("# ── "));
  const target = route.codeView==="full" && symbol && start>=0
    ? lines.findIndex((line,i)=>i>start && (nextFile<0 || i<nextFile) && line.trimStart().startsWith("def "+symbol+"("))
    : -1;
  return `<section class="content-section"><div class="split-head"><h2>源码对照</h2><div class="switch" aria-label="源码视图">${[["diff","本章增量"],["full","累计代码"],["origin","框架来源"]].map(([k,label])=>`<button data-code="${k}" aria-pressed="${route.codeView===k}">${label}</button>`).join("")}</div></div>
    ${route.codeView==="origin"?"":`<div class="code-head"><span>${icon("terminal",16)} ${h(route.codeView==="full"?`s01 → ${c.id} 累计教学实现`:doc.path)}</span><small>${route.codeView==="full"?"Python":"Unified diff"}</small></div><pre class="code" tabindex="0"><code>${lines.map((line,i)=>`<span class="line ${i===target?"target":route.codeView==="diff"&&line[0]==="+"?"added":route.codeView==="diff"&&line[0]==="-"?"removed":""}" ${i===target?'id="source-target"':""}><i aria-hidden="true">${i+1}</i>${h(line)||" "}</span>`).join("")}</code></pre>
    <div class="code-note">当前教学事件 <code>${h(ev.sourceRef||ev.semanticStep)}</code>${target>=0?` <a href="#source-target" data-scroll="source-target">定位定义行</a>`:""} · ${cLink(chapters[0],"返回最小 Loop")}</div>`}</section>${frame(c)}`;
}
function explore(c){
  return `<section class="content-section"><h2>失败与边界</h2><p class="lead">${h(c.failure)}</p><button class="action" data-failure>查看失败轨迹 ${icon("arrow",14)}</button></section>
    <section id="framework-impl" class="content-section"><h2>用同一个问题比较三家</h2><div class="compare">${Object.entries(fw).map(([k,v])=>{const m=mappings[c.id][k];return `<article><h3>${v}</h3><small>${h(level[m.support])}</small><p>${h(m.checkpoint)}</p>${sourceLink(m)}</article>`;}).join("")}</div></section>
    <section class="quiz"><h2>理解检查</h2><p>${h(c.question)}</p><div class="answers">${c.options.map((opt,i)=>`<button data-answer="${i}" aria-pressed="${attempt===i}"><span>${String.fromCharCode(65+i)}</span>${h(opt)}</button>`).join("")}</div><div class="feedback" role="status">${attempt===null?(passed.has(c.id)?"本章练习已通过，可重新作答。":"先作答，再看解释。"):(attempt===c.answer?"回答正确。":"再看一次判据。")+h(c.explanation)}</div></section>`;
}
function render(){
  const oldFocus=document.activeElement;
  const focusAttr=oldFocus && [...oldFocus.attributes].find(a=>a.name.startsWith("data-"));
  const navTop=$("#sidebar nav")?.scrollTop;
  const n=ids.indexOf(route.chapter), c=chapters[n];
  const events = runs[c.id][route.scenario], ev = events[route.index];
  $("#reader-back").href="index.html?mode=original&chapter="+c.id+"&harness="+route.harness;
  document.title=`${c.id.toUpperCase()} ${c.title} · Harness 研习室`;
  if(!viewed.has(c.id)) {viewed.add(c.id);save("viewed",[...viewed]);}
  side(c);
  if(navTop!==undefined) $("#sidebar nav").scrollTop=navTop;
  const activeChapter=$("#sidebar .active"), scroller=$("#sidebar nav");
  if(activeChapter && scroller.clientHeight) {
    const item=activeChapter.getBoundingClientRect(), viewport=scroller.getBoundingClientRect();
    if(item.bottom>viewport.bottom || item.top<viewport.top) scroller.scrollTop+=item.top-viewport.top-scroller.clientHeight/2;
  }
  $("#crumb").innerHTML=`课程 <span>/</span> ${h(c.group)} <span>/</span> <b>${h(c.id.toUpperCase())}</b>`;
  $("#lesson").innerHTML=`
    <div class="lesson-heading"><div class="chapter-kicker"><i></i> 第 ${String(n+1).padStart(2,"0")} 章 <span>/ 20</span></div>
    <h1>${h(c.title)}</h1><div class="subtitle">${h(c.zh)}</div><p>${h(c.problem)}</p></div>
    ${diagram(c,n,ev)}
    <nav class="tabs" aria-label="学习模式">${Object.entries(tabs).map(([key,label])=>`<button data-tab="${key}" aria-current="${key===route.tab?"page":"false"}">${icon(key)} ${label}</button>`).join("")}</nav>
    <div class="focus-bar"><span>框架视角</span>${fwButtons()}<a href="#framework-impl" data-scroll="framework-impl">${h(mappings[c.id][route.harness].title)} ↓</a></div>
    <div id="panel">${route.tab==="learn"?lesson(c):route.tab==="sim"?sim(c,events,ev):route.tab==="source"?source(c,ev):explore(c)}</div>
    <footer><p>${h(c.next)}</p><div>${cLink(chapters[n-1],`${icon("prev")} 上一章 · ${h(chapters[n-1]?.title)}`,"nav-link")}${cLink(chapters[n+1],`下一章 · ${h(chapters[n+1]?.title)} ${icon("arrow")}`,"nav-link next")}</div></footer>`;
  if(focusAttr && !document.contains(oldFocus)) {
    const found=document.querySelector(`[${focusAttr.name}="${CSS.escape(focusAttr.value)}"]`);
    if(found && !found.disabled) found.focus({preventScroll:true});
  }
  const selected=$(".timeline [aria-current=step]");
  if(selected){const box=selected.parentElement;box.scrollTop=Math.max(0,selected.offsetTop-box.clientHeight/2+selected.offsetHeight/2);}
}
function panelScroll(){ $(".tabs").scrollIntoView({block:"start"}); }
function handle(el){
  const d=el.dataset;
  if("scroll" in d) {document.getElementById(d.scroll)?.scrollIntoView({block:"center"});return;}
  if("chapter" in d) {nav({chapter:d.chapter,index:0});return;}
  if("tab" in d) {nav({tab:d.tab});return;}
  if("fw" in d) {nav({harness:d.fw});return;}
  if("open" in d) {nav({tab:d.open});panelScroll();return;}
  if("failure" in d) {nav({tab:"sim",scenario:"failure",index:0});panelScroll();return;}
  if("code" in d) {nav({codeView:d.code});return;}
  if("eventSource" in d) {nav({tab:"source",codeView:"full"});($("#source-target")||$(".code-head"))?.scrollIntoView({block:"center"});return;}
  if("answer" in d){
    attempt=Number(d.answer);
    if(attempt===chapters[ids.indexOf(route.chapter)].answer){passed.add(route.chapter);save("passed",[...passed]);}
    render();return;
  }
  if("scenario" in d){nav({scenario:d.scenario,index:0});return;}
  if("seq" in d){nav({index:Number(d.seq)},true);return;}
  const events=runs[route.chapter][route.scenario];
  if("stage" in d){
    const match=events.findIndex(e=>stageOf(e)===Number(d.stage));
    if(match!==-1){nav({tab:"sim",index:match});panelScroll();}
    else {const msg=`当前场景没有“${stageNames[Number(d.stage)]}”的独立事件。`;$(".diagram-foot span").textContent=msg;$("#announce").textContent=msg;}
    return;
  }
  if("sim" in d){
    if(d.sim==="play"){
      if(timer){stop();render();return;}
      if(route.index===events.length-1) nav({index:0},true);
      timer=setInterval(()=>{
        const i=route.index+1;
        if(i>=events.length-1) stop();
        nav({index:Math.min(i,events.length-1)},true,true);
      },1150);render();
    } else nav({index:d.sim==="reset"?0:d.sim==="back"?Math.max(0,route.index-1):Math.min(route.index+1,events.length-1)},true);
  }
}
document.addEventListener("click",e=>{
  const target=e.target.closest("[data-scroll],[data-chapter],[data-tab],[data-fw],[data-open],[data-failure],[data-code],[data-event-source],[data-answer],[data-scenario],[data-seq],[data-stage],[data-sim]");
  if(!target||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
  e.preventDefault();handle(target);
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-conceal]")){stop();concealFuture=e.target.checked;save("conceal",concealFuture);render();}
});
document.addEventListener("keydown",e=>{
  if(["Enter"," "].includes(e.key)&&e.target.matches("g[data-stage]")){e.preventDefault();handle(e.target);}
  if(e.key==="Escape" && mobileOpen){mobileOpen=false;side(chapters[ids.indexOf(route.chapter)]);$("#menu").focus();}
});
$("#menu").onclick=()=>{mobileOpen=!mobileOpen;side(chapters[ids.indexOf(route.chapter)]);};
window.addEventListener("popstate",()=>{stop();attempt=null;route=parse();render();});
window.matchMedia("(max-width: 600px)").addEventListener("change",()=>render());
route=parse(); render();
}

boot().catch(error => {
  document.querySelector('#lesson').textContent = '课程数据加载失败。请打开 dist/index.html，或在项目目录运行 python study.py serve。' + String(error.message);
});

</script>
</body>
