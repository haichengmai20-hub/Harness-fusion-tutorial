APTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n# ── s09_memory.py ──\ndef open_session(memory_file):\n    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n    return {\"messages\": [], \"recalled\": recalled}\n\n\ndef demo_memory(lab, failed):\n    memory = lab.root / \"preferences.json\"\n    first = open_session(memory)\n    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n    if not failed:\n        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n    second = open_session(memory)\n    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n\n\nCHAPTERS[9] = demo_memory\n\n","diff":"--- s08.py\n+++ s09.py\n@@ -329,2 +329,23 @@\n CHAPTERS[8] = demo_compact\n \n+# ── s09_memory.py ──\n+def open_session(memory_file):\n+    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n+    return {\"messages\": [], \"recalled\": recalled}\n+\n+\n+def demo_memory(lab, failed):\n+    memory = lab.root / \"preferences.json\"\n+    first = open_session(memory)\n+    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n+    if not failed:\n+        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n+    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n+              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n+    second = open_session(memory)\n+    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n+              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n+\n+\n+CHAPTERS[9] = demo_memory\n+\n","path":"runtime/layers/s09_memory.py"},"s10":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n# ── s09_memory.py ──\ndef open_session(memory_file):\n    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n    return {\"messages\": [], \"recalled\": recalled}\n\n\ndef demo_memory(lab, failed):\n    memory = lab.root / \"preferences.json\"\n    first = open_session(memory)\n    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n    if not failed:\n        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n    second = open_session(memory)\n    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n\n\nCHAPTERS[9] = demo_memory\n\n# ── s10_prompt.py ──\ndef build_request(repo, include_policy):\n    policy = (repo / \"README.md\").read_text(encoding=\"utf-8\").splitlines()[2]\n    parts = [\"你在修复教学购物车。\"]\n    if include_policy:\n        parts.append(policy)\n    parts.append(\"每轮最多申请 1 次写入。\")\n    return {\"system\": \"\\n\".join(parts), \"tools\": list(TOOLS),\n            \"messages\": [{\"role\": \"user\", \"content\": \"解释 350 分的差异。\"}]}\n\n\ndef demo_prompt(lab, failed):\n    request = build_request(lab.repo, include_policy=not failed)\n    lab.event(\"config-read\", \"读取系统角色、仓库约束和工具清单\", {},\n              {\"policyFile\": \"README.md\", \"tools\": list(TOOLS), \"writeBudget\": 1})\n    lab.event(\"request-built\", \"检查实际发送给教学模型的请求\",\n              {\"policyFileAvailable\": True}, request)\n    lab.event(\"outcome-checked\", \"在 system 字段中查找单位和预算\", {},\n              {\"hasCents\": \"整数分\" in request[\"system\"], \"hasBudget\": \"1 次写入\" in request[\"system\"]})\n\n\nCHAPTERS[10] = demo_prompt\n\n","diff":"--- s09.py\n+++ s10.py\n@@ -350,2 +350,25 @@\n CHAPTERS[9] = demo_memory\n \n+# ── s10_prompt.py ──\n+def build_request(repo, include_policy):\n+    policy = (repo / \"README.md\").read_text(encoding=\"utf-8\").splitlines()[2]\n+    parts = [\"你在修复教学购物车。\"]\n+    if include_policy:\n+        parts.append(policy)\n+    parts.append(\"每轮最多申请 1 次写入。\")\n+    return {\"system\": \"\\n\".join(parts), \"tools\": list(TOOLS),\n+            \"messages\": [{\"role\": \"user\", \"content\": \"解释 350 分的差异。\"}]}\n+\n+\n+def demo_prompt(lab, failed):\n+    request = build_request(lab.repo, include_policy=not failed)\n+    lab.event(\"config-read\", \"读取系统角色、仓库约束和工具清单\", {},\n+              {\"policyFile\": \"README.md\", \"tools\": list(TOOLS), \"writeBudget\": 1})\n+    lab.event(\"request-built\", \"检查实际发送给教学模型的请求\",\n+              {\"policyFileAvailable\": True}, request)\n+    lab.event(\"outcome-checked\", \"在 system 字段中查找单位和预算\", {},\n+              {\"hasCents\": \"整数分\" in request[\"system\"], \"hasBudget\": \"1 次写入\" in request[\"system\"]})\n+\n+\n+CHAPTERS[10] = demo_prompt\n+\n","path":"runtime/layers/s10_prompt.py"},"s11":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n# ── s09_memory.py ──\ndef open_session(memory_file):\n    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n    return {\"messages\": [], \"recalled\": recalled}\n\n\ndef demo_memory(lab, failed):\n    memory = lab.root / \"preferences.json\"\n    first = open_session(memory)\n    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n    if not failed:\n        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n    second = open_session(memory)\n    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n\n\nCHAPTERS[9] = demo_memory\n\n# ── s10_prompt.py ──\ndef build_request(repo, include_policy):\n    policy = (repo / \"README.md\").read_text(encoding=\"utf-8\").splitlines()[2]\n    parts = [\"你在修复教学购物车。\"]\n    if include_policy:\n        parts.append(policy)\n    parts.append(\"每轮最多申请 1 次写入。\")\n    return {\"system\": \"\\n\".join(parts), \"tools\": list(TOOLS),\n            \"messages\": [{\"role\": \"user\", \"content\": \"解释 350 分的差异。\"}]}\n\n\ndef demo_prompt(lab, failed):\n    request = build_request(lab.repo, include_policy=not failed)\n    lab.event(\"config-read\", \"读取系统角色、仓库约束和工具清单\", {},\n              {\"policyFile\": \"README.md\", \"tools\": list(TOOLS), \"writeBudget\": 1})\n    lab.event(\"request-built\", \"检查实际发送给教学模型的请求\",\n              {\"policyFileAvailable\": True}, request)\n    lab.event(\"outcome-checked\", \"在 system 字段中查找单位和预算\", {},\n              {\"hasCents\": \"整数分\" in request[\"system\"], \"hasBudget\": \"1 次写入\" in request[\"system\"]})\n\n\nCHAPTERS[10] = demo_prompt\n\n# ── s11_recovery.py ──\ndef demo_recovery(lab, failed):\n    # 注入故障的时点决定重试是否可能重复写入。\n    name = \"write_fix\" if failed else \"read\"\n    args = {} if failed else {\"path\": \"cart.py\"}\n    for attempt in (1, 2):\n        try:\n            if name == \"read\" and attempt == 1:\n                raise TimeoutError(\"读取前超时\")\n            result = execute_tool(lab, name, args, \"request-1\")\n            if name == \"write_fix\":\n                raise TimeoutError(\"写入后回执丢失\")\n            lab.event(\"tool-finished\", \"重试拿到读取结果\", {\"attempt\": attempt}, result, call=\"request-1\")\n            return\n        except TimeoutError as exc:\n            lab.event(\"tool-failed\", \"记录故障发生的位置\", {\"attempt\": attempt},\n                      {\"error\": str(exc), \"tool\": name}, call=\"request-1\")\n            if name == \"write_fix\":\n                lab.event(\"state-reconciled\", \"先读回当前文件来判定是否已经写入\",\n                          {\"writeReceipt\": None}, {\"check\": check_cart(lab.repo), \"writeRetries\": 0},\n                          call=\"request-1\")\n                return\n            lab.event(\"retry-scheduled\", \"只读操作可用剩余预算重试一次\",\n                      {\"remainingRetries\": 1}, {\"remainingRetries\": 0}, call=\"request-1\")\n\n\nCHAPTERS[11] = demo_recovery\n\n","diff":"--- s10.py\n+++ s11.py\n@@ -373,2 +373,30 @@\n CHAPTERS[10] = demo_prompt\n \n+# ── s11_recovery.py ──\n+def demo_recovery(lab, failed):\n+    # 注入故障的时点决定重试是否可能重复写入。\n+    name = \"write_fix\" if failed else \"read\"\n+    args = {} if failed else {\"path\": \"cart.py\"}\n+    for attempt in (1, 2):\n+        try:\n+            if name == \"read\" and attempt == 1:\n+                raise TimeoutError(\"读取前超时\")\n+            result = execute_tool(lab, name, args, \"request-1\")\n+            if name == \"write_fix\":\n+                raise TimeoutError(\"写入后回执丢失\")\n+            lab.event(\"tool-finished\", \"重试拿到读取结果\", {\"attempt\": attempt}, result, call=\"request-1\")\n+            return\n+        except TimeoutError as exc:\n+            lab.event(\"tool-failed\", \"记录故障发生的位置\", {\"attempt\": attempt},\n+                      {\"error\": str(exc), \"tool\": name}, call=\"request-1\")\n+            if name == \"write_fix\":\n+                lab.event(\"state-reconciled\", \"先读回当前文件来判定是否已经写入\",\n+                          {\"writeReceipt\": None}, {\"check\": check_cart(lab.repo), \"writeRetries\": 0},\n+                          call=\"request-1\")\n+                return\n+            lab.event(\"retry-scheduled\", \"只读操作可用剩余预算重试一次\",\n+                      {\"remainingRetries\": 1}, {\"remainingRetries\": 0}, call=\"request-1\")\n+\n+\n+CHAPTERS[11] = demo_recovery\n+\n","path":"runtime/layers/s11_recovery.py"},"s12":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE_TARGETS if write_targets is None else write_targets\n    allowed = name not in targets or allow_write\n    lab.event(\"permission-resolved\", \"检查本次调用的写入许可\",\n              {\"requested\": name}, {\"allowed\": allowed}, {\"resource\": targets.get(name)}, call)\n    if not allowed:\n        return {\"error\": \"permission-denied\", \"executed\": False}\n    return executor(lab, name, args, call)\n\n\ndef demo_permission(lab, failed):\n    before = check_cart(lab.repo)\n    cart_file = lab.repo / \"cart.py\"\n    original_bytes = cart_file.read_bytes()\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: permitted_tool(lab, n, a, c, allow_write=not failed),\n                     \"修复购物车的件数乘法。\")\n    after = check_cart(lab.repo)\n    after[\"fileBytesChanged\"] = cart_file.read_bytes() != original_bytes\n    lab.event(\"outcome-checked\", \"重算金额并与写入前的文件字节对照\", before, after)\n\n\nCHAPTERS[3] = demo_permission\n\n# ── s04_hooks.py ──\ndef record_request(name, args, call):\n    return {\"id\": call, \"requested\": name, \"argumentKeys\": list(args)}\n\n\ndef record_result(name, result, call):\n    return {\"id\": call, \"tool\": name, \"observed\": result}\n\n\ndef observed_tool(lab, name, args, call, allow_write=True,\n                  before_hook=record_request, after_hook=record_result, executor=None, write_targets=None):\n    try:\n        observation = before_hook(name, args, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"前置 Hook 异常，结束本次调用\",\n                  {\"hook\": \"before\"}, {\"executed\": False}, {\"error\": str(exc)}, call)\n        return {\"error\": \"before-hook-failed\", \"executed\": False}\n    lab.event(\"hook-before\", \"前置 Hook 收到调用参数\", {\"tool\": name}, observation, call=call)\n    result = permitted_tool(lab, name, args, call, allow_write, executor, write_targets)\n    try:\n        observation = after_hook(name, result, call)\n    except Exception as exc:\n        lab.event(\"hook-failed\", \"后置 Hook 抛错，保留已经收到的执行结果\",\n                  {\"hook\": \"after\", \"operationResult\": result}, {\"error\": str(exc)}, call=call)\n        return {\"error\": \"after-hook-failed\", \"operationResult\": result}\n    lab.event(\"hook-after\", \"后置 Hook 记录执行返回值\", {\"tool\": name},\n              observation, call=call)\n    return result\n\n\ndef demo_hooks(lab, failed):\n    def broken_observer(name, args, call):\n        raise ValueError(\"观测器加载的规则有误\")\n\n    before = check_cart(lab.repo)\n    request_one_tool(lab, \"write_fix\", {},\n                     lambda n, a, c: observed_tool(lab, n, a, c,\n                                                   before_hook=broken_observer if failed else record_request),\n                     \"用 Hook 记录这次修复。\")\n    lab.event(\"outcome-checked\", \"重算金额，核对 Hook 路径的副作用\", before, check_cart(lab.repo))\n\n\nCHAPTERS[4] = demo_hooks\n\n# ── s05_todo.py ──\ndef demo_todo(lab, failed):\n    plan = {\"定位\": \"done\", \"修复\": \"pending\", \"验证\": \"pending\"}\n    lab.event(\"plan-created\", \"把接下来的工作写入显式计划\", {}, {\"plan\": plan})\n    if not failed:\n        observed_tool(lab, \"write_fix\", {}, \"todo-write\")\n    previous = plan.copy()\n    plan.update({\"修复\": \"done\", \"验证\": \"done\"})\n    lab.event(\"plan-updated\", \"记录计划填写者给出的进度\", {\"plan\": previous}, {\"plan\": plan})\n    result = check_cart(lab.repo)\n    if not result[\"passed\"]:\n        plan.update({\"修复\": \"pending\", \"验证\": \"pending\"})\n    lab.event(\"outcome-checked\", \"用实际金额校正计划\", {\"reported\": \"done\"},\n              {\"plan\": plan, \"check\": result})\n\n\nCHAPTERS[5] = demo_todo\n\n# ── s06_subagent.py ──\ndef inspect_child(lab, assignment, span):\n    # 子调用只获得委派参数；不接收父对话。允许读取的文件由参数决定。\n    scope = assignment[\"allowedFiles\"]\n    child_messages = [{\"role\": \"user\", \"content\": assignment[\"question\"]}]\n    lab.event(\"child-started\", \"创建独立子上下文\", {\"parent\": \"cart-repair\"},\n              {\"messages\": child_messages, \"allowedFiles\": scope}, span=span)\n    if \"cart.py\" not in scope:\n        return {\"error\": \"file-out-of-scope\", \"file\": \"cart.py\"}\n    result = execute_tool(lab, \"read\", {\"path\": \"cart.py\"}, \"child-read\")\n    return {\"file\": result[\"path\"], \"line\": result[\"text\"].splitlines()[-1].strip()}\n\n\ndef demo_child(lab, failed):\n    lab.messages = [{\"role\": \"user\", \"content\": \"修复并说明金额错误。\"}]\n    assignment = {\"question\": \"找出 cart.py 中的求和表达式。\", \"allowedFiles\": [] if failed else [\"cart.py\"]}\n    lab.event(\"child-delegated\", \"父任务交给只读子任务\", {\"parentMessages\": lab.messages},\n              {\"assignment\": assignment}, span=\"child-1\")\n    reply = inspect_child(lab, assignment, \"child-1\")\n    lab.messages.append({\"role\": \"tool\", \"name\": \"delegate\", \"result\": reply})\n    lab.event(\"child-returned\", \"父任务只收到子任务的摘要或错误\", {\"parentMessageCount\": 1},\n              {\"messages\": lab.messages}, reply, span=\"child-1\")\n\n\nCHAPTERS[6] = demo_child\n\n# ── s07_skills.py ──\nSKILLS = {\"money\": \"金额以整数分计算；单价乘以件数后求和。\"}\n\n\ndef demo_skill(lab, failed):\n    catalog = [{\"name\": \"money\", \"description\": \"购物车金额规则\"}]\n    model_input = {\"catalog\": catalog}\n    lab.event(\"catalog-listed\", \"先把技能名和用途送入输入\", {}, model_input)\n    name = \"currency\" if failed else \"money\"\n    before = deepcopy(model_input)\n    body = SKILLS.get(name)\n    if body:\n        model_input[\"loadedText\"] = body\n    lab.event(\"skill-requested\", \"按模型请求的名字读取技能正文\", before, model_input,\n              {\"requested\": name, \"found\": body is not None})\n    lab.event(\"request-built\", \"检查下一轮实际能看到的文字\",\n              {\"requested\": name}, {\"modelInput\": model_input, \"bodyVisible\": \"loadedText\" in model_input})\n\n\nCHAPTERS[7] = demo_skill\n\n# ── s08_compact.py ──\ndef compact_history(history, keep_constraint):\n    finding = history[1][\"content\"]\n    retained = [{\"role\": \"summary\",\n                 \"content\": f\"上次检查实得 {finding['actual']} 分，预期 {finding['expected']} 分。\"}]\n    if keep_constraint:\n        retained.insert(0, history[0])\n    return retained + [history[-1]]\n\n\ndef demo_compact(lab, failed):\n    total = runpy.run_path(str(lab.repo / \"cart.py\"))[\"total_cents\"]\n    diagnostics = [{\"quantity\": n, \"actual\": total([(350, n)]), \"expected\": 350 * n}\n                   for n in range(1, 9)]\n    archive = [{\"role\": \"user\", \"content\": \"保持整数分和 total_cents 接口。\"},\n               {\"role\": \"tool\", \"content\": check_cart(lab.repo)},\n               {\"role\": \"tool\", \"content\": diagnostics},\n               {\"role\": \"assistant\", \"content\": \"下一步修改计算式。\"}]\n    ledger = lab.root / \"turns.json\"\n    ledger.write_text(json.dumps(archive, ensure_ascii=False), encoding=\"utf-8\")\n    lab.event(\"history-archived\", \"把原始消息保存为只读实验基准\", {},\n              {\"archiveLength\": len(archive)}, {\"file\": \"turns.json\"})\n    visible = compact_history(archive, keep_constraint=not failed)\n    lab.event(\"context-compacted\", \"从四条原始消息构造下一轮可见输入\",\n              {\"messages\": archive}, {\"messages\": visible})\n    recovered = json.loads(ledger.read_text(encoding=\"utf-8\"))\n    lab.event(\"outcome-checked\", \"在模型输入和磁盘原文中分别查找金额约束\", {},\n              {\"constraintVisible\": recovered[0] in visible, \"originalIntact\": recovered == archive})\n\n\nCHAPTERS[8] = demo_compact\n\n# ── s09_memory.py ──\ndef open_session(memory_file):\n    recalled = json.loads(memory_file.read_text(encoding=\"utf-8\")) if memory_file.exists() else {}\n    return {\"messages\": [], \"recalled\": recalled}\n\n\ndef demo_memory(lab, failed):\n    memory = lab.root / \"preferences.json\"\n    first = open_session(memory)\n    first[\"messages\"].append({\"role\": \"user\", \"content\": \"回归测试名用英文。\"})\n    if not failed:\n        memory.write_text(json.dumps({\"testNames\": \"English\"}), encoding=\"utf-8\")\n    lab.event(\"session-closed\", \"结束 A 会话并检查偏好是否写入文件\", first,\n              {\"persisted\": memory.exists()}, {\"file\": \"preferences.json\"})\n    second = open_session(memory)\n    lab.event(\"memory-recalled\", \"新建空消息的 B 会话，读取偏好\", {\"session\": \"B\"},\n              second, {\"readFrom\": \"preferences.json\" if memory.exists() else None})\n\n\nCHAPTERS[9] = demo_memory\n\n# ── s10_prompt.py ──\ndef build_request(repo, include_policy):\n    policy = (repo / \"README.md\").read_text(encoding=\"utf-8\").splitlines()[2]\n    parts = [\"你在修复教学购物车。\"]\n    if include_policy:\n        parts.append(policy)\n    parts.append(\"每轮最多申请 1 次写入。\")\n    return {\"system\": \"\\n\".join(parts), \"tools\": list(TOOLS),\n            \"messages\": [{\"role\": \"user\", \"content\": \"解释 350 分的差异。\"}]}\n\n\ndef demo_prompt(lab, failed):\n    request = build_request(lab.repo, include_policy=not failed)\n    lab.event(\"config-read\", \"读取系统角色、仓库约束和工具清单\", {},\n              {\"policyFile\": \"README.md\", \"tools\": list(TOOLS), \"writeBudget\": 1})\n    lab.event(\"request-built\", \"检查实际发送给教学模型的请求\",\n              {\"policyFileAvailable\": True}, request)\n    lab.event(\"outcome-checked\", \"在 system 字段中查找单位和预算\", {},\n              {\"hasCents\": \"整数分\" in request[\"system\"], \"hasBudget\": \"1 次写入\" in request[\"system\"]})\n\n\nCHAPTERS[10] = demo_prompt\n\n# ── s11_recovery.py ──\ndef demo_recovery(lab, failed):\n    # 注入故障的时点决定重试是否可能重复写入。\n    name = \"write_fix\" if failed else \"read\"\n    args = {} if failed else {\"path\": \"cart.py\"}\n    for attempt in (1, 2):\n        try:\n            if name == \"read\" and attempt == 1:\n                raise TimeoutError(\"读取前超时\")\n            result = execute_tool(lab, name, args, \"request-1\")\n            if name == \"write_fix\":\n                raise TimeoutError(\"写入后回执丢失\")\n            lab.event(\"tool-finished\", \"重试拿到读取结果\", {\"attempt\": attempt}, result, call=\"request-1\")\n            return\n        except TimeoutError as exc:\n            lab.event(\"tool-failed\", \"记录故障发生的位置\", {\"attempt\": attempt},\n                      {\"error\": str(exc), \"tool\": name}, call=\"request-1\")\n            if name == \"write_fix\":\n                lab.event(\"state-reconciled\", \"先读回当前文件来判定是否已经写入\",\n                          {\"writeReceipt\": None}, {\"check\": check_cart(lab.repo), \"writeRetries\": 0},\n                          call=\"request-1\")\n                return\n            lab.event(\"retry-scheduled\", \"只读操作可用剩余预算重试一次\",\n                      {\"remainingRetries\": 1}, {\"remainingRetries\": 0}, call=\"request-1\")\n\n\nCHAPTERS[11] = demo_recovery\n\n# ── s12_tasks.py ──\ndef ready_tasks(tasks):\n    return [name for name, t in tasks.items()\n            if t[\"status\"] == \"pending\" and all(tasks[d][\"status\"] == \"done\" for d in t[\"depends\"])]\n\n\ndef demo_tasks(lab, failed):\n    task_file = lab.root / \"tasks.json\"\n    tasks = {\"fix\": {\"status\": \"pending\", \"depends\": []},\n             \"verify\": {\"status\": \"pending\", \"depends\": [\"fix\"]}}\n    lab.event(\"tasks-created\", \"验证任务显式依赖修复任务\", {}, {\"ready\": ready_tasks(tasks), \"tasks\": tasks})\n    if not failed:\n        execute_tool(lab, \"write_fix\", {}, \"fix\")\n        tasks[\"fix\"][\"status\"] = \"done\"\n    task_file.write_text(json.dumps(tasks), encoding=\"utf-8\")\n    restored = json.loads(task_file.read_text(encoding=\"utf-8\"))\n    lab.event(\"tasks-restored\", \"重开任务表，再计算可以领取的工作\",\n              {\"file\": \"tasks.json\"}, {\"ready\": ready_tasks(restored), \"tasks\": restored})\n    lab.event(\"claim-checked\", \"尝试领取 verify\", {\"requested\": \"verify\"},\n              {\"allowed\": \"verify\" in ready_tasks(restored)})\n\n\nCHAPTERS[12] = demo_tasks\n\n","diff":"--- s11.py\n+++ s12.py\n@@ -401,2 +401,26 @@\n CHAPTERS[11] = demo_recovery\n \n+# ── s12_tasks.py ──\n+def ready_tasks(tasks):\n+    return [name for name, t in tasks.items()\n+            if t[\"status\"] == \"pending\" and all(tasks[d][\"status\"] == \"done\" for d in t[\"depends\"])]\n+\n+\n+def demo_tasks(lab, failed):\n+    task_file = lab.root / \"tasks.json\"\n+    tasks = {\"fix\": {\"status\": \"pending\", \"depends\": []},\n+             \"verify\": {\"status\": \"pending\", \"depends\": [\"fix\"]}}\n+    lab.event(\"tasks-created\", \"验证任务显式依赖修复任务\", {}, {\"ready\": ready_tasks(tasks), \"tasks\": tasks})\n+    if not failed:\n+        execute_tool(lab, \"write_fix\", {}, \"fix\")\n+        tasks[\"fix\"][\"status\"] = \"done\"\n+    task_file.write_text(json.dumps(tasks), encoding=\"utf-8\")\n+    restored = json.loads(task_file.read_text(encoding=\"utf-8\"))\n+    lab.event(\"tasks-restored\", \"重开任务表，再计算可以领取的工作\",\n+              {\"file\": \"tasks.json\"}, {\"ready\": ready_tasks(restored), \"tasks\": restored})\n+    lab.event(\"claim-checked\", \"尝试领取 verify\", {\"requested\": \"verify\"},\n+              {\"allowed\": \"verify\" in ready_tasks(restored)})\n+\n+\n+CHAPTERS[12] = demo_tasks\n+\n","path":"runtime/layers/s12_tasks.py"},"s13":{"code":"# ── s01_loop.py ──\n\"\"\"累计教学实现。直接运行请用 runtime/lab.py。\"\"\"\nimport inspect\nimport json\nimport runpy\nimport subprocess\nimport sys\nfrom copy import deepcopy\nfrom pathlib import Path\nfrom shutil import copytree\n\nCHAPTERS = {}\n\n\nclass Lab:\n    def __init__(self, root, chapter, scenario):\n        self.root = root\n        self.repo = root / \"cart_repo\"\n        self.chapter = chapter\n        self.scenario = scenario\n        self.events = []\n        self.messages = []\n\n    def event(self, step, title, before, after, payload=None, call=None, span=None):\n        # 每一步展示被观察的局部变量，立即复制以保留当时的值。\n        frame = inspect.currentframe().f_back\n        filename = Path(frame.f_code.co_filename).name\n        self.events.append(deepcopy({\n            \"runId\": f\"{self.chapter}-{self.scenario}\", \"chapterId\": self.chapter,\n            \"harness\": \"common\", \"mode\": \"teaching-simulation\",\n            \"seq\": len(self.events) + 1, \"semanticStep\": step,\n            \"eventType\": step, \"title\": title, \"toolCallId\": call,\n            \"parentSpanId\": span, \"before\": before, \"after\": after,\n            \"payload\": payload or {},\n            \"sourceRef\": f\"runtime/layers/{filename}#{frame.f_code.co_name}\",\n        }))\n\n    def message(self, step, title, message, call=None):\n        before = list(self.messages)\n        self.messages.append(message)\n        self.event(step, title, {\"messages\": before}, {\"messages\": self.messages}, message, call)\n\n\ndef check_cart(repo):\n    # 执行固定教学快照中的纯函数。输入数据由本实验提供。\n    total = runpy.run_path(str(repo / \"cart.py\"))[\"total_cents\"]\n    actual = total([(350, 2)])\n    return {\"actual\": actual, \"expected\": 700, \"passed\": actual == 700}\n\n\ndef run_loop(lab, user, provider, dispatch, budget=6, **request_fields):\n    lab.message(\"user-input\", \"用户把购物车问题交给模型\", {\"role\": \"user\", \"content\": user})\n    for turn in range(1, budget + 1):\n        request = {**request_fields, \"messages\": list(lab.messages)}\n        lab.event(\"request-built\", \"构造本轮模型输入\", {\"turn\": turn},\n                  {\"messageCount\": len(lab.messages)}, request)\n        action = provider(request)\n        if \"tool\" not in action:\n            lab.message(\"assistant-finished\", \"模型给出最终回复\",\n                        {\"role\": \"assistant\", \"content\": action[\"final\"]})\n            return\n        call = f\"call-{turn}\"\n        lab.message(\"tool-requested\", \"模型请求调用 \" + action[\"tool\"],\n                    {\"role\": \"assistant\", \"tool\": action[\"tool\"], \"args\": action[\"args\"], \"id\": call}, call)\n        result = dispatch(action[\"tool\"], action[\"args\"], call)\n        lab.message(\"tool-finished\", \"把工具结果交回模型\",\n                    {\"role\": \"tool\", \"id\": call, \"result\": result}, call)\n    lab.event(\"budget-exhausted\", \"模型轮次用尽\", {\"budget\": budget}, {\"stopped\": True})\n\n\ndef demo_loop(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if failed:\n            return {\"final\": \"我已经修好了。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"check_cart\", \"args\": {}}\n        result = messages[-1][\"result\"]\n        return {\"final\": f\"已复现，得到 {result['actual']} 分，预期 {result['expected']} 分。\"}\n\n    run_loop(lab, \"请检查两件单价 350 分的商品。\", provider,\n             lambda name, args, call: check_cart(lab.repo))\n    checked = any(m[\"role\"] == \"tool\" for m in lab.messages)\n    lab.event(\"outcome-checked\", \"用独立断言核对模型的说法\",\n              {\"hasToolResult\": checked}, check_cart(lab.repo),\n              {\"finding\": \"已复现，尚未修复\" if checked else \"回复称已修复，文件仍复现错误\"})\n\n\nCHAPTERS[1] = demo_loop\n\n# ── s02_tools.py ──\ndef read_fixture(lab, args):\n    if args[\"path\"] not in (\"cart.py\", \"README.md\", \"tests/test_cart.py\"):\n        return {\"error\": \"unknown-fixture-file\"}\n    return {\"path\": args[\"path\"], \"text\": (lab.repo / args[\"path\"]).read_text(encoding=\"utf-8\")}\n\n\ndef fix_cart(lab, args):\n    path = lab.repo / \"cart.py\"\n    source = path.read_text(encoding=\"utf-8\")\n    fixed = source.replace(\"sum(unit_cents for\", \"sum(unit_cents * quantity for\")\n    path.write_text(fixed, encoding=\"utf-8\")\n    return {\"path\": \"cart.py\", \"changed\": source != fixed}\n\n\n# 注册项同时保存公开参数合同和本地处理函数。模型只收到工具名和合同。\nTOOLS = {\"read\": ({\"path\": \"string\"}, read_fixture),\n         \"write_fix\": ({}, fix_cart),\n         \"check_cart\": ({}, lambda lab, args: check_cart(lab.repo))}\nARG_TYPES = {\"string\": str, \"integer\": int, \"boolean\": bool}\n\n\ndef public_tools():\n    return {name: schema for name, (schema, handler) in TOOLS.items()}\n\n\ndef execute_tool(lab, name, args, call):\n    if name not in TOOLS:\n        return {\"error\": \"unknown-tool\", \"name\": name}\n    schema, handler = TOOLS[name]\n    if (not isinstance(args, dict) or set(args) != set(schema)\n            or any(type(args[k]) is not ARG_TYPES.get(kind) for k, kind in schema.items())):\n        return {\"error\": \"invalid-arguments\", \"expected\": schema, \"received\": args}\n    return handler(lab, args)\n\n\ndef request_one_tool(lab, name, args, dispatch, question):\n    def provider(request):\n        last = request[\"messages\"][-1]\n        if last[\"role\"] == \"user\":\n            return {\"tool\": name, \"args\": args}\n        result = last[\"result\"]\n        if \"error\" in result:\n            return {\"final\": f\"工具返回 {result['error']}，请核对执行记录。\"}\n        return {\"final\": f\"工具返回 {result}，请独立验证结果。\"}\n    run_loop(lab, question, provider, dispatch, tools=public_tools())\n\n\ndef demo_tools(lab, failed):\n    def provider(request):\n        messages = request[\"messages\"]\n        if request[\"tools\"].get(\"read\") != {\"path\": \"string\"}:\n            return {\"final\": \"本轮工具清单没有可用的 read(path) 合同。\"}\n        if messages[-1][\"role\"] == \"user\":\n            return {\"tool\": \"scan\", \"args\": {}} if failed else {\"tool\": \"read\", \"args\": {\"path\": \"cart.py\"}}\n        result = messages[-1][\"result\"]\n        if result.get(\"error\") == \"unknown-tool\":\n            # 错误样本：替换成已注册的名字，但仍传入了错误类型。\n            return {\"tool\": \"read\", \"args\": {\"path\": 12}}\n        if \"error\" in result:\n            return {\"final\": f\"读取失败：{result['error']}。\"}\n        return {\"final\": \"读到的计算式是：\" + result[\"text\"].splitlines()[-1].strip()}\n    catalog = public_tools()\n    lab.event(\"tools-listed\", \"从注册表导出可公开的工具名与参数\", {}, {\"tools\": catalog})\n    run_loop(lab, \"读取金额计算的代码。\", provider,\n             lambda name, args, call: execute_tool(lab, name, args, call), tools=catalog)\n\n\nCHAPTERS[2] = demo_tools\n\n# ── s03_permission.py ──\nWRITE_TARGETS = {\"write_fix\": \"cart.py\"}\n\n\ndef permitted_tool(lab, name, args, call, allow_write, executor=None, write_targets=None):\n    executor = execute_tool if executor is None else executor\n    targets = WRITE
